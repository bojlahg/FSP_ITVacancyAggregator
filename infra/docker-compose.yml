name: itscout

# Ротация логов контейнеров: без неё json-file растёт без предела и забивает диск сервера
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itscout}
      POSTGRES_USER: ${POSTGRES_USER:-itscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ../backend
    restart: unless-stopped
    logging: *logging
    env_file:
      - path: ../.env
        required: false
    environment:
      # Без APP_ENV в .env сервис стартует как prod: проверка секретов не даст подняться с dev-значениями
      APP_ENV: ${APP_ENV:-prod}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-itscout}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-itscout}
      FSP_API_URL: http://fsp-mock:8001/fsp-api/v1
      UPLOAD_DIR: /data/uploads
      LLM_STATE_DIR: /data/uploads/llm
      FSP_DATA_PATH: /data/fsp/fsp.json
      # Процессы uvicorn: лимиты частоты и учёт LLM общие (Postgres и файл под блокировкой)
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      # Reseed из кабинета сначала просит бэкап у сервиса backup (infra/scripts/backup.sh)
      BACKUP_REQUESTS_DIR: /backup-requests
    volumes:
      - uploads:/data/uploads
      - fspdata:/data/fsp
      - backup_requests:/backup-requests
    depends_on:
      db:
        condition: service_healthy

  fsp-mock:
    build: ../fsp-mock
    restart: unless-stopped
    logging: *logging
    environment:
      FSP_API_KEY: ${FSP_API_KEY:-dev-fsp-key}
      FSP_DATA_PATH: /data/fsp/fsp.json
    volumes:
      - fspdata:/data/fsp:ro

  # Мок IdP «ФСП ID» (§9.3): realm fsp из infra/keycloak, данные во встроенной H2 — пересоздаётся при деплое.
  # Наружу через Caddy только /fsp-id/realms/fsp/* и /fsp-id/resources/*; админка закрыта.
  keycloak:
    build: ./keycloak
    restart: unless-stopped
    logging: *logging
    environment:
      KC_HOSTNAME: ${PUBLIC_BASE_URL:-http://localhost}/fsp-id
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?задайте KEYCLOAK_ADMIN_PASSWORD в .env}
      JAVA_OPTS_KC_HEAP: -Xms64m -Xmx512m
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /fsp-id/health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Только отправка почты от noreply@itscout.ru с подписью DKIM (порт 25 у VDSina открыт по запросу)
  mail:
    # Версия закреплена: на 06.10.2026 тег latest указывает на тот же образ 5.1.0
    image: boky/postfix:5.1.0
    restart: unless-stopped
    logging: *logging
    environment:
      HOSTNAME: itscout.ru
      ALLOWED_SENDER_DOMAINS: itscout.ru
      DKIM_AUTOGENERATE: "true"
      DKIM_SELECTOR: mail
    volumes:
      - dkim:/etc/opendkim/keys

  # Ежедневный бэкап БД и загруженных файлов в отдельный том: деплой (rsync --delete) его не трогает
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itscout}
      POSTGRES_USER: ${POSTGRES_USER:-itscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups
      - uploads:/uploads:ro
      - backup_requests:/requests
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  fspdata:
  caddy_data:
  caddy_config:
  dkim:
  backups:
  backup_requests:
