# Локальная разработка: БД и backend с hot reload, Mailpit для писем. Фронт — `npm run dev` (прокси /api → :8000).
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    environment:
      APP_ENV: dev
      DEMO_MODE: "true"
      EMAIL_BACKEND: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../backend:/app

  fsp-mock:
    ports:
      - "127.0.0.1:8001:8001"

  keycloak:
    environment:
      KC_HOSTNAME: http://localhost:8080/fsp-id
    ports:
      - "127.0.0.1:8080:8080"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  web:
    profiles: ["prod"]
