# Проверка текста потребности на запрещённые требования (docs/implementation.md §8.1, docs/research/legal.md).
# ТК РФ ст. 3 и 64, Закон о занятости (565-ФЗ) ст. 53: в вакансии нельзя ограничивать по полу, возрасту,
# национальности, месту жительства (в том числе регистрации), семейному положению, религии и т. п.
# severity: block — публикация запрещена в режиме NEED_TEXT_CHECK=block; warn — только подсказка.
# unless_before — не срабатывать, если такое слово стоит в окне перед совпадением («опыт от 10 лет»).
context_chars: 25
rules:
  - id: age
    severity: block
    label: возраст
    message: "Требование к возрасту запрещено (ТК РФ ст. 3, 64; 565-ФЗ ст. 53). Опишите нужный опыт и навыки."
    patterns:
      - '\bвозраст\w*\b[^.\n]{0,20}\d{2}'
      - '\bне\s+(?:старше|моложе)\s+\d{2}'
      - '\b(?:от|до)\s+\d{2}\s*(?:(?:до|-|–)\s*\d{2}\s*)?(?:лет|года)\b'
      - '\b\d{2}\s*(?:-|–|—)\s*\d{2}\s*(?:лет|года)\b'
      - '\bмолод\w*\s+(?:и\s+)?(?:дружн\w*\s+)?(?:коллектив\w*|команд\w*)'
    unless_before: 'опыт|стаж|работ|компани|рынке|истори|существ'
  - id: gender
    severity: block
    label: пол
    message: "Требование к полу запрещено (ТК РФ ст. 3, 64; 565-ФЗ ст. 53)."
    patterns:
      - '\b(?:только\s+)?(?:мужчин\w*|женщин\w*|девушк\w*|юнош\w*|парн(?:я|ей|и))\b'
      - '\b(?:мужск|женск)\w*\s+пол\w*'
  - id: nationality
    severity: block
    label: национальность
    message: "Требование к национальности или расе запрещено (ТК РФ ст. 3, 64)."
    patterns:
      - '\bнациональност\w*'
      - '\bславянск\w*\s+(?:внешност\w*|происхожден\w*|национальност\w*)'
      - '\b(?:только\s+)?славян(?:е|ин|ка)\b'
  - id: residence
    severity: block
    label: место жительства
    message: "Требование к месту жительства или регистрации запрещено (565-ФЗ ст. 53). Можно указать город офиса и формат работы."
    patterns:
      - '\b(?:прописк|регистраци)\w*\s+(?:в|по)\s+(?!налог)\w+'
      - '\bместн\w*\s+жител\w*'
      - '\bтолько\s+(?:москвич\w*|местн\w*|жител\w*)'
  - id: family
    severity: block
    label: семейное положение
    message: "Требования к семейному положению и детям запрещены (ТК РФ ст. 3, 64)."
    patterns:
      - '\bсемейн\w*\s+положени\w*'
      - '\bбез\s+(?:маленьких\s+)?детей\b'
      - '\bне\s+замужем\b'
      - '\bхолост\w*\b'
  - id: religion
    severity: block
    label: религия и убеждения
    message: "Требования к религии и убеждениям запрещены (ТК РФ ст. 3)."
    patterns:
      - '\bвероисповедани\w*'
      - '\bрелигиозн\w*\s+(?:взгляд\w*|убеждени\w*)'
      - '\bпартийн\w*\s+принадлежност\w*'
  - id: appearance
    severity: warn
    label: внешность
    message: "Требования к внешности не связаны с деловыми качествами и могут считаться дискриминацией."
    patterns:
      - '\b(?:приятн|привлекательн|славянск)\w*\s+внешност\w*'
      - '\bфото\s+(?:в\s+)?(?:резюме|обязательн\w*)'
  - id: citizenship
    severity: warn
    label: гражданство
    message: "Требование гражданства допустимо, только если его прямо требует закон (например, допуск к гостайне). Иначе уберите."
    patterns:
      - '\bгражданств\w*\s+(?:рф|россии|российской)'
      - '\bтолько\s+граждан\w*'
