# Близость навыков для частичного зачёта в skills-компоненте score — docs/implementation.md §8.3.
# Таблица построена офлайн вручную по иерархии ESCO и семействам content/skills.yaml (одна роль в стеке,
# переносимые знания, похожая модель) и заморожена: в рантайме ничего не вычисляется, LLM не участвует.
# Пары симметричны; значение — доля ценности навыка кандидата, которая засчитывается за требуемый
# близкий навык. Ограничение сверху и выключатель — skill_similarity в content/matching.yaml.
# Ориентиры: 0.7 — почти взаимозаменяемы; 0.5–0.6 — та же роль, другая модель; 0.3–0.4 — смежная область.
# Пары «родитель — потомок» (CI/CD — GitLab CI) допустимы: parent_only засчитывает 0.3 только в сторону
# «есть родитель, нужен потомок», а близость — в обе; берётся больший из зачётов.

