# Числовые константы формулы силы результата ФСП — docs/implementation.md §9.2.
# strength = percentile × level_weight × 0.5^(возраст_в_годах / recency_half_life_years)
# competency = 1 − Π(1 − strength_i); для связи по роли strength × role_link_factor
# competency = max(competency, rank_floor[разряд])

fsp:
  # Все уровни равны: организаторы советуют не ранжировать соревнования («чемпионат России выше хакатона»),
  # а учитывать результативность — она уже в percentile (место среди участников). Веса настраиваемые:
  # платформа может снова различать уровни, поменяв числа здесь.
  level_weight:
    international: 1.0
    national: 1.0
    interregional: 1.0
    regional: 1.0
    municipal: 1.0
  recency_half_life_years: 3
  role_link_factor: 0.7
  rank_floor:
    "МС": 0.95
    "КМС": 0.85
    "I": 0.70
    "II": 0.55
    "III": 0.40
    "юношеский": 0.25
  rank_order: ["юношеский", "III", "II", "I", "КМС", "МС"]
