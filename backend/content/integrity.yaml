# Сигналы честности попытки — docs/implementation.md §10.9, обзор: docs/research/psychometrics.md §3,
# docs/research/integrity.md §2.1. Это пометка «стоит перепроверить» для человека: в θ̂, грейд, категорию
# и score подбора сигналы не входят (инвариант; 152-ФЗ ст. 16 — без решений только на автоматической обработке).
# Выключатель — INTEGRITY_SIGNALS_ENABLED (core/config.py). Пороги стартовые: реальных норм времени пока нет,
# поведение детектора проверяется на симуляции (validation/integrity_check.py → docs/validation/integrity.md).

# Меньше оценённых заданий — «недостаточно данных», сигналы не считаются: lz* на коротком тесте неустойчив
min_items: 12

person_fit:
  # lz* (Snijders, 2001, Psychometrika 66:331; Magis, Raîche & Béland, 2012, JEBS 37:778) с поправкой
  # на оценённую θ̂ и априорное N(0, 1) EAP-оценки. При H0 ≈ N(0, 1): −1,645 — односторонние 5%.
  threshold: -1.645

rapid:
  # Быстрое угадывание по нормативному порогу NT10 (Wise & DeMars, 2006, JEM 43:19; Wise & Ma, 2012):
  # 10% типичного времени задания, но не больше 10 с. Норм времени ещё нет — берём долю лимита задания.
  limit_fraction: 0.10
  max_sec: 10
  # RTE < 0,9 (Wise & Kong, 2005): больше 10% ответов быстрее порога — признак дезангажированности
  share_threshold: 0.10

fast_correct:
  # «Быстро и верно на трудном» — упрощённая идея детекции предзнания по времени (Sinharay, 2020,
  # APM 44:376; Sinharay & Johnson, 2017): верный ответ быстрее limit_fraction лимита (не больше max_sec)
  # на задании, чья сложность выше θ̂ хотя бы на b_margin логита.
  limit_fraction: 0.20
  max_sec: 30
  b_margin: 1.0
  # Сколько таких ответов дают сигнал
  count_threshold: 2

# Тексты для работодателя: нейтрально, без обвинения
texts:
  note: "Нетипичный рисунок ответов — стоит перепроверить на собеседовании; на грейд не влияет."
  clean: "Рисунок ответов типичный."
  insufficient: "Недостаточно данных для оценки рисунка ответов."
  reasons:
    person_fit: "Ответы плохо согласуются с моделью: верно решены трудные задания и пропущены лёгкие"
    rapid_guessing: "Много ответов дано быстрее, чем обычно нужно, чтобы прочитать задание"
    fast_correct_hard: "Несколько трудных заданий решены верно необычно быстро"
