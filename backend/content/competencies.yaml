# Компетенции ФСП — docs/implementation.md §9.2: то, что реально измеряют соревнования.
# Технологический навык (Python, Docker) из ФСП не выводится напрямую — только через роль
# в продуктовой дисциплине и не выше статуса «подтверждено ФСП».

- id: algorithms
  name: Алгоритмы и структуры данных
  description: Решение алгоритмических задач на время, знание структур данных и оценка сложности.

- id: product_team_dev
  name: Командная продуктовая разработка
  description: Разработка работающего продукта в команде в сжатые сроки по реальной постановке.

- id: backend_dev
  name: Backend-разработка
  description: Серверная часть продукта в командной продуктовой дисциплине (роль backend).

- id: frontend_dev
  name: Frontend-разработка
  description: Клиентская часть продукта в командной продуктовой дисциплине (роль frontend).

- id: ml_dev
  name: ML-разработка
  description: Модели машинного обучения и работа с данными в командной продуктовой дисциплине (роль ML).

- id: team_lead
  name: Лидерство в команде
  description: Роль капитана или лида команды — распределение задач, планирование, защита решения.

- id: infosec_ctf
  name: Информационная безопасность (CTF)
  description: Поиск и эксплуатация уязвимостей, анализ и защита систем в соревнованиях CTF.

- id: drone_programming
  name: Программирование беспилотных систем
  description: Программирование беспилотных авиационных систем; общий инженерный сигнал.

- id: robotics_programming
  name: Программирование робототехники
  description: Программирование роботов и встраиваемых систем; общий инженерный сигнал.
