# Веса и пороги ранжирования — docs/implementation.md §8.3. Проверяются процедурой валидации (§12).

weights:          # match = 100 × Σ weight·component
  skills: 0.40     # полнота стека важнее силы профиля: валидация, P@5 0,65 → 0,69 (docs/validation/report.md)
  strength: 0.20
  category: 0.15
  fsp: 0.10
  fresh: 0.05
  conditions: 0.10

category_fit:     # насколько категория кандидата подходит потребности
  exact: 1.0
  # Соседний грейд штрафуем сильнее смежной специализации: в «общем топе» перерослые кандидаты
  # вытесняли точное совпадение (docs/validation/report.md, раздел «Подбор»)
  adjacent_grade: 0.3
  adjacent_specialization: 0.6
  adjacent_both: 0.15

skill_value:      # ценность навыка кандидата для требования
  verified: 1.0
  fsp_confirmed: 0.9
  task_confirmed: 0.9
  declared: 0.5
  parent_only: 0.3
required_weight: 1.0
optional_weight: 0.3

strength:
  ability_share: 0.7     # 0.7·Φ((θ − cut_грейда)/scale) + 0.3·topic_fit
  scale: 0.6
  # Штраф за «перерос грейд»: λ·max(0, 2·Φ((θ − cut_следующего_грейда)/scale) − 1) вычитается из ability
  overqualified_penalty: 1.5

# Свежесть: fresh = 0.5^(дней с последнего проверенного действия / half_life_days)
freshness:
  half_life_days: 90

# Сила подтверждённого профиля внутри категории (каталог, поиск без потребности):
# VPS = Σ weight·component, percentile — перцентиль θ̂ в категории, approach — оценка подхода
vps_weights:
  percentile: 0.60
  fsp: 0.15
  fresh: 0.15
  approach: 0.10

conditions:
  salary_share: 0.6
  format_share: 0.4
  salary_tolerance: 0.3  # ожидания выше вилки на 30% — salary_fit = 0 и жёсткий фильтр

# Адекватность вилки рынку категории (§24, защита от фиктивных вакансий): по ожиданиям кандидатов
# категории в индексе выдачи. Меньше min_candidates ожиданий — вердикт не выносится.
market:
  min_candidates: 5
  low_coverage: 0.2      # верхняя граница покрывает ожидания меньше 20% кандидатов — «ниже рынка»
  high_ratio: 2.0        # нижняя граница вдвое выше медианы ожиданий — «подозрительно высокая»

# Экспертная разметка (§12.2): набор пар — по `needs` потребностей (поровну по специализациям),
# для каждой — объединение топ-`top_k` выдачи ITScout и топ-`top_k` счёта ключевых слов.
# Релевантна пара со средней оценкой экспертов ≥ relevant_from (шкала 0–3).
expert:
  needs: 10
  top_k: 6
  relevant_from: 2

# «Рынок вашей категории» для кандидата (§8.5): только агрегаты по действующим потребностям.
# Распределения (вилки, навыки, «что поможет») показываются, если в выборке не меньше min_needs потребностей
# от не меньше min_employers компаний — иначе по агрегату можно узнать одного работодателя.
insights:
  min_needs: 3
  min_employers: 2
  top_skills: 8
  max_suggestions: 3
  skills_match: 0.75     # потребность «подходит по навыкам», если skills-компонент score ≥ порога
  # Учитывать неопубликованные потребности (внутренние планы компаний) в агрегатах для кандидатов.
  # true — данных больше; false — только открытые вакансии (строже к конфиденциальности работодателей)
  include_unpublished: true

recommendations:
  default_limit: 50
  max_explanation_lines: 6
