- id: be.node.unhandled_rejection
  specializations: [backend]
  topic: stack
  stack_module: nodejs
  skills: [nodejs]
  kind: single_choice
  irt: {a: 1.1, b: 1.0}
  params:
    fn: {choice: [syncInventory, refreshToken, flushMetrics, sendWebhook]}
    ver: {choice: [18, 20, 22]}
  stem: >-
    В сервисе на Node.js {{ver}} функция {{fn}}() вызывается без await и без .catch(), и возвращаемый ею промис
    отклоняется. Обработчика process.on('unhandledRejection') нет, флаги запуска по умолчанию. Что произойдёт?
  options:
    correct: ["Процесс завершится с ошибкой: по умолчанию необработанное отклонение промиса приводит к падению процесса"]
    wrong:
      - "Будет выведено предупреждение, процесс продолжит работу"
      - "Ошибка будет молча проигнорирована"
      - "Node.js автоматически повторит вызов {{fn}}()"
      - "Отклонение будет перехвачено ближайшим try/catch вызывающей функции"
