- id: be.node.stream_backpressure
  specializations: [backend]
  topic: stack
  stack_module: nodejs
  skills: [nodejs]
  kind: single_choice
  irt: {a: 1.2, b: 1.5}
  time_limit_sec: 120
  params:
    source: {choice: [файл на 20 ГБ, выгрузку из PostgreSQL через курсор, объект из S3, лог-файл на 5 ГБ]}
    dest: {choice: [HTTP-ответ медленному клиенту, TCP-сокет партнёра, gzip-поток в файл на медленном диске]}
  stem_variants:
    - >-
      Сервис на Node.js читает {{source}} потоком и в обработчике события 'data' вызывает dest.write(chunk), где dest —
      {{dest}}. Возвращаемое значение write() не проверяется. Память процесса растёт до OOM. В чём причина и как исправить?
    - >-
      Код копирует {{source}} в {{dest}}: source.on('data', (chunk) => dest.write(chunk)). На больших объёмах процесс
      падает с нехваткой памяти. Что не так?
  options:
    correct:
      - "Не учитывается backpressure: write() возвращает false, когда внутренний буфер переполнен, а данные продолжают поступать; нужно приостанавливать чтение до события 'drain' или использовать stream.pipeline()"
    wrong:
      - "Утечка из-за замыкания в обработчике 'data'; нужно вынести обработчик в именованную функцию"
      - "Нужно увеличить --max-old-space-size — это и есть исправление"
      - "write() синхронно ждёт отправки данных, поэтому блокирует event loop и память растёт"
      - "Нужно вызывать global.gc() после каждого чанка"
      - "Поток читается в бинарном режиме; нужно задать кодировку utf8"
