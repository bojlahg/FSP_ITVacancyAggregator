- id: be.http.hol_blocking
  specializations: [backend]
  topic: http_api
  skills: [http, networking]
  kind: single_choice
  irt: {a: 1.2, b: 1.5}
  time_limit_sec: 120
  params:
    client: {choice: [мобильное приложение, браузер, SDK партнёра, IoT-устройство]}
    n: {choice: [20, 40, 60, 100]}
    loss: {choice: [1, 2, 3, 5]}
  stem_variants:
    - >-
      Клиент ({{client}}) отправляет {{n}} параллельных запросов по одному HTTP/2-соединению. В сети с потерей {{loss}}% пакетов
      задержки растут сразу у всех потоков, а не только у того, чей пакет потерян. Почему так происходит и что меняет HTTP/3?
    - >-
      Профилирование показало: когда в сети теряется около {{loss}}% пакетов, все {{n}} мультиплексированных потоков HTTP/2
      ({{client}}) замирают одновременно. В чём причина и как это решает HTTP/3?
  options:
    correct:
      - "Все потоки HTTP/2 идут в одном TCP-соединении, и потерянный сегмент задерживает доставку данных всех потоков (head-of-line blocking на уровне TCP); HTTP/3 работает поверх QUIC, где потеря пакета задерживает только свой поток"
    wrong:
      - "HTTP/2 отправляет ответы строго по очереди, следующий — только после завершения предыдущего; HTTP/3 впервые добавляет мультиплексирование"
      - "При потере пакета HTTP/2 закрывает соединение и заново выполняет TLS-рукопожатие; HTTP/3 сохраняет сессию в cookie"
      - "HPACK заново пересылает всю таблицу заголовков после каждой потери; в HTTP/3 сжатие заголовков отключено"
      - "Сервер при потерях снижает SETTINGS_MAX_CONCURRENT_STREAMS до 1; в HTTP/3 такого ограничения нет"
      - "Приоритеты потоков HTTP/2 откладывают все потоки, кроме самого важного; в HTTP/3 приоритетов нет, поэтому потоки равны"

