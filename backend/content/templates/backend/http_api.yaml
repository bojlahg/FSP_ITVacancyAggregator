- id: be.http.created_201
  specializations: [backend]
  topic: http_api
  skills: [http, rest]
  kind: single_choice
  irt: {a: 1.0, b: -1.4}
  params:
    res: {choice: [orders, users, projects, invoices, comments, tickets, bookings, products]}
