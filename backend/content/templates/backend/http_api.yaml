# Backend · HTTP и API — шаблоны заданий (§10.2). Формат: content/templates/README.md

- id: be.http.idempotent_method
  specializations: [backend]
  topic: http_api
  skills: [rest]
  kind: single_choice
  irt: {a: 1.1, b: -1.2}
  params:
    resource: {choice: [заказ, платёж, профиль пользователя, корзину, подписку]}
  stem_variants:
    - "Клиент повторяет запрос на изменение ресурса «{{resource}}» после таймаута. Какой метод по RFC 9110 идемпотентен и подходит для полной замены ресурса?"
    - "Нужно полностью заменить {{resource}}, и запрос может быть отправлен повторно. Какой HTTP-метод идемпотентен и предназначен для этого?"
  options:
    correct: [PUT]
    wrong: [POST, PATCH, CONNECT, OPTIONS]

- id: be.http.status_codes_conflict
  specializations: [backend]
  topic: http_api
  skills: [rest]
  kind: single_choice
  irt: {a: 1.3, b: -0.3}
  params:
    entity: {choice: [пользователя с таким email, заказ с таким номером, товар с таким артикулом]}
  stem: "API получает запрос на создание сущности, но {{entity}} уже существует. Какой код ответа наиболее точен?"
  options:
    correct: ["409 Conflict"]
    wrong: ["400 Bad Request", "404 Not Found", "500 Internal Server Error", "422 Unprocessable Content"]

- id: be.http.retry_budget
  specializations: [backend]
  topic: http_api
  skills: [rest, system_design]
  kind: numeric
  irt: {a: 1.2, b: 0.6}
  params:
    rps: {int: [200, 1200], step: 100}
    retries: {int: [1, 3]}
    error_pct: {choice: [10, 20, 50]}
  stem: >-
    Сервис получает {{rps}} запросов в секунду. Из-за сбоя зависимости {{error_pct}}% запросов к ней
    падают, и клиент делает до {{retries}} повторов на каждый упавший запрос (повторы тоже падают с той же
    вероятностью). Сколько запросов в секунду в среднем получит зависимость? Округлите до целого.
  answer:
    # первый вызов + повторы: rps · (1 + p + … + p^retries) = rps · (1 − p^(r+1)) / (1 − p)
    expr: "round({{rps}} * (1 - ({{error_pct}} / 100) ** ({{retries}} + 1)) / (1 - {{error_pct}} / 100))"
    tolerance: 1

- id: be.http.design_rate_limit
  specializations: [backend]
  topic: http_api
  skills: [rest, system_design, redis]
  kind: open_approach
  status: active
  irt: {a: 1.0, b: 0.8}
  time_limit_sec: 600
  params:
    limit: {int: [10, 100], step: 10}
  stem: >-
    Нужно ограничить публичный API до {{limit}} запросов в минуту на ключ клиента. Сервис работает в
    нескольких экземплярах за балансировщиком. Опишите подход: где хранить счётчики, какой алгоритм
    выбрать и что вернуть клиенту при превышении.
  rubric:
    - Счётчики хранятся в общем хранилище (Redis и т.п.), а не в памяти экземпляра
    - Назван алгоритм (token bucket, sliding window, fixed window) и его компромисс
    - Атомарность обновления счётчика (INCR с TTL, Lua-скрипт, транзакция)
    - Ответ 429 Too Many Requests и заголовок Retry-After или лимиты в заголовках

- id: be.http.forbidden_vs_unauthorized
  specializations: [backend]
  topic: http_api
  skills: [http, rest]
  kind: single_choice
  irt: {a: 1.1, b: -1.0}
  params:
    action: {choice: [удалить чужой заказ, изменить настройки биллинга, выгрузить отчёт по всем клиентам, заблокировать пользователя]}
    role: {choice: [viewer, support, guest, analyst]}
  stem: >-
    Пользователь с ролью {{role}} передал валидный, не истёкший токен и пытается {{action}}. Прав на это у роли нет.
    Какой код ответа наиболее точен по семантике HTTP?
  options:
    correct: ["403 Forbidden"]
    wrong: ["401 Unauthorized", "400 Bad Request", "405 Method Not Allowed", "407 Proxy Authentication Required"]

- id: be.http.safe_methods
  specializations: [backend]
  topic: http_api
  skills: [http, rest]
  kind: multi_choice
  irt: {a: 1.1, b: -0.9}
  n_options: 5
  params:
    service: {choice: [каталога товаров, сервиса заказов, API профилей, сервиса бронирований]}
  stem_variants:
    - "Какие HTTP-методы по RFC 9110 являются безопасными (safe), то есть не должны менять состояние на сервере {{service}}?"
    - "Кеширующий прокси перед API {{service}} должен отличать безопасные (safe) методы. Какие методы безопасны по RFC 9110?"
  options:
    correct: [GET, HEAD, OPTIONS, TRACE]
    wrong: [POST, PUT, DELETE, PATCH]

- id: be.http.request_path_order
  specializations: [backend]
  topic: http_api
  skills: [http, networking]
  kind: ordering
  irt: {a: 1.0, b: -0.7}
  params:
    host: {choice: [api.itscout.ru, shop.example.com, pay.example.org, auth.example.net]}
    path: {choice: [/v1/orders, /login, /health, /v2/profile]}
  stem: "Клиент впервые обращается к https://{{host}}{{path}} по HTTP/1.1, кешей и открытых соединений нет. Расположите этапы в правильном порядке."
  order_items:
    - "DNS-резолвинг имени {{host}} в IP-адрес"
    - "Установка TCP-соединения (трёхстороннее рукопожатие)"
    - "TLS-рукопожатие и проверка сертификата {{host}}"
    - "Отправка HTTP-запроса GET {{path}}"
    - "Получение HTTP-ответа со статусом и заголовками"

- id: be.http.etag_not_modified
  specializations: [backend]
  topic: http_api
  skills: [http, caching]
  kind: single_choice
  irt: {a: 1.2, b: -0.1}
  params:
    etag: {choice: ['"a1b2c3"', '"v42"', '"9f8e7d"', 'W/"17-abc"']}
    resource: {choice: [/api/catalog, /api/profile, /static/app.js, /api/prices]}
  stem: >-
    Клиент запрашивает GET {{resource}} с заголовком If-None-Match: {{etag}}. Ресурс не менялся, и его текущий ETag
    совпадает. Что вернёт сервер, корректно поддерживающий условные запросы?
  options:
    correct: ["304 Not Modified без тела ответа"]
    wrong:
      - "204 No Content"
      - "200 OK с полным телом ресурса"
      - "412 Precondition Failed"
      - "302 Found с редиректом на закешированную версию"

- id: be.http.keyset_pagination
  specializations: [backend]
  topic: http_api
  skills: [rest, sql]
  kind: single_choice
  irt: {a: 1.2, b: 0.4}
  params:
    entity: {choice: [ленты событий, списка заказов, истории платежей, журнала аудита]}
    page: {int: [500, 5000], step: 250}
  stem: >-
    API {{entity}} отдаёт страницы через LIMIT 50 OFFSET N, и запрос страницы {{page}} работает заметно медленнее
    первой. Новые записи постоянно добавляются в начало выборки. Какое утверждение о переходе на keyset-пагинацию
    (курсор по последнему (created_at, id)) верно?
  options:
    correct:
      - "OFFSET заставляет БД прочитать и отбросить все пропущенные строки, а при вставках страницы сдвигаются; курсор с индексом по (created_at, id) решает обе проблемы"
    wrong:
      - "Keyset-пагинация позволяет сразу перейти на страницу с произвольным номером"
      - "Keyset-пагинация не требует индекса по полям сортировки"
      - "OFFSET-пагинация медленная только из-за сериализации JSON, а не из-за базы данных"
      - "Keyset-пагинация позволяет получить общее число страниц без COUNT(*)"

- id: be.http.cache_no_store
  specializations: [backend]
  topic: http_api
  skills: [http, caching]
  kind: single_choice
  irt: {a: 1.2, b: 0.5}
  params:
    data: {choice: [паспортные данные, выписку по счёту, медицинскую карту, платёжные реквизиты]}
  stem_variants:
    - "Ответ API содержит {{data}}. Его нельзя сохранять ни в каком кеше — ни в браузере, ни на промежуточных прокси. Какой заголовок ответа это выражает?"
    - "Эндпоинт отдаёт {{data}}, и ответ не должен записываться ни в один кеш (включая диск браузера). Какую директиву указать?"
  options:
    correct: ["Cache-Control: no-store"]
    wrong:
      - "Cache-Control: no-cache"
      - "Cache-Control: private"
      - "Cache-Control: max-age=0"
      - "Cache-Control: must-revalidate"

- id: be.http.if_match_precondition
  specializations: [backend]
  topic: http_api
  skills: [http, rest, concurrency]
  kind: single_choice
  irt: {a: 1.2, b: 1.0}
  params:
    etag: {choice: ['"r17"', '"v5"', '"7c1e"', '"2024-a"']}
    resource: {choice: [/api/articles/42, /api/orders/918, /api/profiles/7, /api/configs/main]}
  stem: >-
    Для защиты от потерянных обновлений клиент отправляет PUT {{resource}} с заголовком If-Match: {{etag}}.
    Пока он редактировал, другой клиент уже изменил ресурс, и ETag на сервере другой. Какой код ответа
    предписывает RFC 9110?
  options:
    correct: ["412 Precondition Failed"]
    wrong: ["409 Conflict", "304 Not Modified", "428 Precondition Required", "422 Unprocessable Content"]

- id: be.http.idempotency_key
  specializations: [backend]
  topic: http_api
  skills: [rest, system_design]
  kind: multi_choice
  irt: {a: 1.3, b: 1.4}
  n_options: 5
  params:
    op: {choice: [создания платежа, оформления заказа, отправки перевода, бронирования места]}
  stem: >-
    Для POST-запроса {{op}} вводится заголовок Idempotency-Key, чтобы повтор после таймаута не выполнил операцию
    дважды. Сервис работает в нескольких экземплярах. Какие решения правильные?
  options:
    correct:
      - "Сохранять ключ вместе с результатом первого выполнения и на повтор возвращать сохранённый ответ"
      - "Регистрировать ключ атомарно (уникальный индекс, INSERT … ON CONFLICT), чтобы два параллельных повтора не выполнились оба"
      - "Связывать ключ с клиентом и отклонять повтор с тем же ключом, но другим телом запроса"
    wrong:
      - "Хранить ключи в памяти экземпляра: балансировщик всегда отправляет повтор на тот же экземпляр"
      - "Ключ можно не хранить: POST по RFC 9110 идемпотентен"
      - "Если запрос с этим ключом ещё выполняется, выполнять повтор параллельно, чтобы клиент не ждал"
      - "Хранить ключи меньше, чем клиент может делать повторы, чтобы таблица не росла"

- id: be.http.grpc_deadline
  specializations: [backend]
  topic: http_api
  skills: [grpc]
  kind: single_choice
  status: pilot
  irt: {a: 1.0, b: 0.8}
  params:
    a: {choice: [gateway, orders, checkout]}
    b: {choice: [inventory, pricing, billing]}
    ms: {choice: [200, 300, 500, 800]}
  stem: >-
    Сервис {{a}} вызывает по gRPC сервис {{b}} с дедлайном {{ms}} мс. {{b}} не уложился в срок. Что получит {{a}}?
  options:
    correct: ["Ошибку со статусом DEADLINE_EXCEEDED"]
    wrong:
      - "Ошибку со статусом UNAVAILABLE"
      - "Ответ, как только {{b}} закончит обработку, — дедлайн носит рекомендательный характер"
      - "HTTP 504 Gateway Timeout"
      - "Ошибку со статусом CANCELLED"
