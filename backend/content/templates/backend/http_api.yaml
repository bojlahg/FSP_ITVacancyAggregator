  stem_variants:
    - "Клиент отправил POST /api/{{res}}, и сервер синхронно создал {{entity}}. Какой ответ наиболее точен по семантике HTTP?"
    - "Обработчик POST /api/{{res}} успешно сохранил {{entity}} в базе до отправки ответа. Какой ответ API лучше всего соответствует RFC 9110?"
    - "REST API: запрос POST /api/{{res}} создал {{entity}} сразу, без фоновой обработки. Что вернуть клиенту?"
