# Backend · безопасность (§10.2). Формат: content/templates/README.md

- id: be.sec.sql_injection
  specializations: [backend]
  topic: security
  skills: [appsec, owasp, sql]
  kind: single_choice
  irt: {a: 1.1, b: -1.1}
  params:
    table: {choice: [users, orders, products, accounts]}
    col: {choice: [email, login, sku, phone]}
    arg: {choice: [value, query, term, needle]}
  stem: "Как правильно устранить уязвимость в этом коде?"
  code: |
    def find(cursor, {{arg}}: str):
        cursor.execute(f"SELECT * FROM {{table}} WHERE {{col}} = '{{{arg}}}'")
        return cursor.fetchall()
  code_language: python
  options:
    correct: ["Передавать значение как параметр запроса (placeholder) и не собирать SQL из строки"]
    wrong:
      - "Вручную экранировать одинарные кавычки через replace"
      - "Проверять, что строка не содержит слов DROP и DELETE"
      - "Обернуть запрос в транзакцию"
      - "Принимать запросы только по HTTPS"

- id: be.sec.password_storage
  specializations: [backend]
  topic: security
  skills: [appsec, cryptography]
  kind: single_choice
  irt: {a: 1.2, b: -0.6}
  params:
    app: {choice: [интернет-магазина, личного кабинета, корпоративного портала, мобильного банка, онлайн-школы, сервиса доставки, CRM-системы, игрового сервиса]}
  stem_variants:
    - "Как следует хранить пароли пользователей {{app}} в базе данных?"
    - "Какой способ хранения паролей пользователей {{app}} соответствует современным рекомендациям (OWASP)?"
    - "Разработчик проектирует таблицу пользователей {{app}}. Как правильно сохранить пароль, чтобы при утечке базы его было максимально трудно восстановить?"
  options:
    correct:
      - "Хешем специальной медленной функции с солью: Argon2id, scrypt или bcrypt"
      - "Через функцию хеширования паролей с уникальной солью и настраиваемой стоимостью (Argon2id, bcrypt, scrypt)"
    wrong:
      - "Хешем SHA-256 от пароля"
      - "Шифровать AES-ключом из конфигурации приложения"
      - "Хешем MD5 с единой солью для всех пользователей"
      - "В Base64, чтобы пароль не был виден при просмотре таблицы"
      - "Хешем SHA-512 от пароля, соединённого с логином пользователя"
      - "В открытом виде, но с доступом к таблице только у администратора БД"

- id: be.sec.csrf
  status: showcase
  specializations: [backend]
  topic: security
  skills: [appsec, owasp]
  kind: single_choice
  irt: {a: 1.2, b: 0.2}
  params:
    site: {choice: [bank.example, shop.example, crm.example, portal.example]}
    action: {choice: [/transfer, /change-email, /delete-account, /orders/cancel]}
  stem: >-
    Сайт {{site}} хранит сессию в cookie. Страница злоумышленника на другом домене автоматически отправляет форму
    POST на https://{{site}}{{action}}, и браузер жертвы прикладывает её cookie. Как называется атака и чем от неё защищаются?
  options:
    correct: ["CSRF; CSRF-токен в форме и/или cookie сессии с атрибутом SameSite=Lax или Strict"]
    wrong:
      - "XSS; флаг HttpOnly у cookie сессии"
      - "CSRF; перевод сайта на HTTPS"
      - "SQL-инъекция; параметризованные запросы"
      - "Clickjacking; заголовок Access-Control-Allow-Origin"

- id: be.sec.jwt_facts
  specializations: [backend]
  topic: security
  skills: [appsec, iam, oauth]
  kind: multi_choice
  irt: {a: 1.2, b: 0.5}
  n_options: 5
  params:
    svc: {choice: [API заказов, сервис профилей, шлюз платежей, внутренний сервис отчётов, API мобильного приложения, сервис уведомлений, BFF веб-клиента]}
  stem_variants:
    - "{{svc}} принимает access token в формате JWT, подписанный по JWS. Какие утверждения верны?"
    - "Сервис ({{svc}}) авторизует запросы по JWT access token с подписью JWS. Какие утверждения о таких токенах верны?"
  options:
    correct:
      - "Payload подписан, но не зашифрован: его может прочитать любой, у кого есть токен"
      - "Нужно проверять подпись с ожидаемым алгоритмом и не принимать alg=none"
      - "Нужно проверять срок действия (exp) и, как правило, издателя и аудиторию (iss, aud)"
    wrong:
      - "Внутри доверенной сети подпись можно не проверять — достаточно декодировать payload"
      - "Отзыв токена до истечения exp работает сам по себе, без дополнительного хранилища или списка"
      - "Payload зашифрован секретом сервера, поэтому в нём можно хранить пароль"
      - "Подпись гарантирует, что токен не был перехвачен"
      - "Алгоритм проверки подписи нужно брать из заголовка alg самого токена"

- id: be.sec.cors
  specializations: [backend]
  topic: security
  skills: [appsec, http]
  kind: single_choice
  irt: {a: 1.2, b: 0.6}
  params:
    api: {choice: [api.shop.example, api.bank.example, api.crm.example, api.school.example, api.maps.example]}
    front: {choice: [app.shop.example, lk.bank.example, admin.crm.example, my.school.example, web.maps.example]}
  stem_variants:
    - "Фронтенд на https://{{front}} обращается к https://{{api}}, и разработчики настраивают CORS. Какое утверждение о CORS верно?"
    - "SPA с https://{{front}} вызывает API https://{{api}}. Команда спорит, от чего защищает CORS. Какое утверждение верно?"
  options:
    correct:
      - "Это механизм браузера: без разрешающих заголовков Access-Control-Allow-* скрипт страницы с другого origin не сможет прочитать ответ"
    wrong:
      - "CORS защищает API от любых запросов с чужих серверов, в том числе от curl"
      - "Access-Control-Allow-Origin: * разрешает запросы с cookie с любого origin"
      - "Перед каждым GET-запросом браузер отправляет preflight-запрос OPTIONS"
      - "CORS шифрует запросы между разными доменами"
      - "Настроенный CORS заменяет проверку аутентификации на сервере"
      - "Ограничения CORS применяет сервер, отклоняя запросы с чужим Origin до обработки"

- id: be.sec.idor
  specializations: [backend]
  topic: security
  skills: [appsec, owasp]
  kind: single_choice
  irt: {a: 1.3, b: 0.9}
  params:
    res: {choice: [invoices, documents, orders, medical-records]}
    id: {int: [1000, 99999]}
  stem: >-
    Аутентифицированный пользователь меняет в запросе GET /api/{{res}}/{{id}} число в пути и получает чужие данные.
    Какое исправление устраняет уязвимость (Broken Object Level Authorization, OWASP API Top 10)?
  options:
    correct: ["Проверять на сервере, что запрошенный объект принадлежит текущему пользователю или доступен ему"]
    wrong:
      - "Заменить последовательные числовые id на UUID — этого достаточно"
      - "Передавать id в теле POST-запроса вместо пути"
      - "Добавить ограничение частоты запросов"
      - "Проверять в запросе заголовок Referer"

- id: be.sec.ssrf
  specializations: [backend]
  topic: security
  skills: [appsec, owasp]
  kind: multi_choice
  irt: {a: 1.2, b: 1.4}
  n_options: 5
  params:
    feature: {choice: [превью ссылок в чате, загрузку аватара по URL, вебхуки на адрес клиента, импорт фида по ссылке, проверку доступности сайта клиента, конвертацию HTML-страницы в PDF]}
  stem_variants:
    - "Сервис реализует {{feature}}: сервер сам скачивает URL, указанный пользователем. Какие утверждения о рисках SSRF и защите верны?"
    - "В продукте появилась функция «{{feature}}»: бэкенд обращается по адресу, который ввёл пользователь. Какие утверждения о SSRF верны?"
  options:
    correct:
      - "Злоумышленник может заставить сервер обратиться к внутренним адресам: localhost, 169.254.169.254, сервисам внутренней сети"
      - "Проверять нужно IP-адрес после DNS-резолвинга, и повторно — при каждом редиректе"
      - "Исходящие запросы стоит пускать через выделенный egress-прокси со списком разрешённых адресов"
    wrong:
      - "Достаточно проверить, что URL начинается с https://"
      - "Достаточно запретить в URL строку «localhost»"
      - "Если сервер скачивает URL методом POST, а не GET, риск исчезает"
      - "SSRF опасна только для серверов без файрвола на входящие соединения"
      - "Достаточно один раз проверить имя хоста по чёрному списку до DNS-резолвинга"

- id: be.sec.https_guarantees
  specializations: [backend]
  topic: security
  skills: [appsec, cryptography, http]
  kind: single_choice
  irt: {a: 1.0, b: -1.6}
  params:
    site: {choice: [интернет-магазин, личный кабинет, форум, сервис бронирования, онлайн-банк, сайт школы]}
    data: {choice: [логин и пароль, номер телефона, адрес доставки, текст сообщения]}
  stem_variants:
    - "Сайт ({{site}}) перевели с HTTP на HTTPS. Пользователь отправляет {{data}}. Что обеспечивает HTTPS (TLS) при корректно настроенном сертификате?"
    - "Зачем сайту (например, {{site}}) HTTPS, если пользователь передаёт через форму {{data}}? Что именно гарантирует TLS?"
  options:
    correct:
      - "Данные шифруются при передаче, а клиент проверяет подлинность сервера по сертификату"
    wrong:
      - "Сервер защищён от SQL-инъекций и XSS"
      - "Данные хранятся в базе сервера в зашифрованном виде"
      - "Провайдер не может узнать, с каким сервером соединяется пользователь"
      - "Сервер гарантированно не содержит уязвимостей"
      - "Пароль автоматически хешируется в браузере перед отправкой"

- id: be.sec.xss_escape
  specializations: [backend]
  topic: security
  skills: [appsec, owasp]
  kind: single_choice
  irt: {a: 1.1, b: -1.1}
  params:
    field: {choice: [комментарий, имя пользователя, отзыв о товаре, название проекта, подпись к фото, статус в профиле]}
    page: {choice: [странице товара, ленте новостей, профиле, списке задач]}
  stem_variants:
    - >-
      Сервер вставляет {{field}} из базы в HTML на {{page}} как есть, без обработки. Пользователь сохранил в это поле
      строку <script>…</script>, и скрипт выполняется у всех посетителей. Как называется уязвимость и как её правильно устранить?
    - >-
      Поле «{{field}}» выводится на {{page}} простой конкатенацией строк в HTML. Злоумышленник сохранил туда тег <script>,
      и его код выполняется в браузерах других пользователей. Что это за уязвимость и что делать?
  options:
    correct:
      - "Хранимая XSS; экранировать данные при выводе с учётом контекста (HTML, атрибут, JS) — например, автоэкранированием шаблонизатора"
    wrong:
      - "SQL-инъекция; использовать параметризованные запросы"
      - "CSRF; добавить CSRF-токен в форму"
      - "Хранимая XSS; перевести сайт на HTTPS"
      - "Хранимая XSS; удалять из ввода только строку «<script>»"
      - "Clickjacking; добавить заголовок X-Frame-Options"

- id: be.sec.timing_attack
  specializations: [backend]
  topic: security
  skills: [appsec, cryptography]
  kind: single_choice
  irt: {a: 1.2, b: 1.4}
  params:
    what: {choice: [HMAC-подпись вебхука, API-токен, одноразовый код сброса пароля, подпись ссылки на скачивание]}
    lang: {choice: [Python, Go, Java, Node.js]}
  stem_variants:
    - >-
      Сервис на {{lang}} проверяет {{what}} обычным сравнением строк (==): сравнение прекращается на первом
      несовпавшем символе. Какой риск это создаёт и как его устраняют?
    - >-
      В коде на {{lang}} полученное значение ({{what}}) сравнивается с ожидаемым через обычное равенство строк. Ревьюер
      просит это исправить. Почему и на что заменить?
  options:
    correct:
      - "Атака по времени: по длительности ответа можно подбирать значение посимвольно; сравнивать функцией с постоянным временем (hmac.compare_digest, subtle.ConstantTimeCompare, MessageDigest.isEqual, crypto.timingSafeEqual)"
    wrong:
      - "Риска нет: сравнение строк выполняется за наносекунды, разницу нельзя измерить в принципе"
      - "Риск коллизий; перейти с HMAC-SHA256 на MD5, у которого сравнение быстрее"
      - "Риск SQL-инъекции; экранировать значение перед сравнением"
      - "Атака по времени; приводить обе строки к нижнему регистру перед сравнением"
      - "Атака по времени; ограничиться логированием неудачных сравнений"

# --- Senior ---

- id: be.sec.jwt_pitfalls
  specializations: [backend]
  topic: security
  skills: [appsec, oauth, cryptography]
  kind: multi_choice
  irt: {a: 1.4, b: 1.5}
  time_limit_sec: 120
  n_options: 5
  params:
    svc: {choice: [billing, orders, profile, reports, gateway]}
  stem_variants:
    - >-
      Сервис {{svc}} принимает access-токены JWT, выпущенные корпоративным IdP (подпись RS256, публичные ключи —
      из JWKS этого IdP). Какие варианты проверки токена уязвимы?
    - >-
      Ревью проверки JWT в сервисе {{svc}}: токены выдаёт IdP, подпись RS256, ключи публикуются в JWKS. Какие
      реализации позволяют принять поддельный или чужой токен?
  options:
    correct:
      - "Алгоритм берётся из заголовка alg: токен с alg=HS256, подписанный публичным RSA-ключом как HMAC-секретом, пройдёт проверку"
      - "Проверяются подпись и exp, но не aud: токен того же IdP, выданный для другого сервиса, будет принят"
      - "Ключ проверки скачивается по URL из заголовка jku токена без белого списка адресов"
      - "Библиотека настроена принимать любой алгоритм из заголовка, включая alg=none"
    wrong:
      - "Алгоритм зафиксирован в коде (только RS256), ключ выбирается по kid из закешированного JWKS доверенного IdP"
      - "Проверяются подпись, exp, nbf, iss и aud с допуском на расхождение часов в пару минут"
      - "JWKS кешируется и обновляется по расписанию и при встрече неизвестного kid"
      - "Токен проверяется локально на каждом запросе, без обращения к IdP"
