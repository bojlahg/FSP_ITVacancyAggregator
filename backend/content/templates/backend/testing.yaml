# Backend · тестирование (§10.2). Формат: content/templates/README.md

- id: be.test.pyramid
  specializations: [backend]
  topic: testing
  skills: [unit_testing]
  kind: single_choice
  irt: {a: 1.0, b: -1.3}
  params:
    product: {choice: [сервиса заказов, платёжного шлюза, API каталога, сервиса авторизации, сервиса уведомлений, биллинга, сервиса поиска, API личного кабинета]}
  stem_variants:
    - "Команда строит набор автотестов для {{product}} по классической пирамиде тестирования. Каких тестов в ней должно быть больше всего?"
    - "Какой уровень находится в основании пирамиды тестирования и составляет большинство автотестов {{product}}?"
    - "По классической пирамиде тестирования какие автотесты {{product}} должны быть самыми многочисленными, быстрыми и дешёвыми?"
  options:
    correct: ["Модульные (unit) тесты"]
    wrong: ["End-to-end тесты через UI", "Интеграционные тесты с реальной БД", "Ручные регрессионные проверки", "Нагрузочные тесты", "Контрактные тесты", "Приёмочные тесты"]

- id: be.test.mock_double
  specializations: [backend]
  topic: testing
  skills: [unit_testing]
  kind: single_choice
  irt: {a: 1.1, b: -0.5}
  params:
    svc: {choice: [CheckoutService, RegistrationService, RefundService, ReminderService]}
    dep: {choice: [EmailClient, SmsGateway, AuditLog, PushSender]}
    method: {choice: [send, notify, write, publish]}
  stem: >-
    В модульном тесте {{svc}} нужно проверить, что при успешной операции у зависимости {{dep}} ровно один раз вызван
    метод {{method}}() с нужными аргументами. Какой вид тестового двойника предназначен именно для проверки
    таких взаимодействий?
  options:
    correct: ["Mock"]
    wrong: ["Stub", "Dummy", "Fake", "Fixture"]

- id: be.test.flaky_causes
  specializations: [backend]
  topic: testing
  skills: [unit_testing, test_automation]
  kind: multi_choice
  irt: {a: 1.1, b: 0.4}
  n_options: 5
  params:
    name: {choice: [test_create_order, test_refund_flow, test_daily_report, test_user_search]}
  stem: "Тест {{name}} то проходит, то падает в CI без изменений кода. Какие причины типичны для таких «мигающих» тестов?"
  options:
    correct:
      - "Зависимость от текущего времени, даты или часового пояса"
      - "Зависимость от порядка выполнения тестов и общего состояния между ними"
      - "Фиксированный sleep вместо ожидания условия при асинхронных операциях"
      - "Проверка порядка строк из БД, когда в запросе нет ORDER BY"
    wrong:
      - "Слишком много assert в одном тесте"
      - "Использование параметризованных тестов"
      - "Тест написан до кода (TDD)"
      - "Высокое покрытие кода тестами"

- id: be.test.sqlite_instead_of_pg
  specializations: [backend]
  topic: testing
  skills: [unit_testing, postgresql]
  kind: multi_choice
  irt: {a: 1.1, b: 0.9}
  n_options: 5
  params:
    repo: {choice: [OrderRepository, UserRepository, PaymentRepository, ReportRepository, InvoiceRepository, TaskRepository]}
  stem_variants:
    - "Тесты {{repo}} гоняют на SQLite в памяти, а в проде PostgreSQL. Какие ошибки такие тесты могут пропустить?"
    - "Чтобы ускорить CI, тесты {{repo}} переключили с PostgreSQL на SQLite в памяти. Какие проблемы продакшена такие тесты могут не заметить?"
  options:
    correct:
      - "Запросы с синтаксисом или функциями, специфичными для PostgreSQL (JSONB-операторы, массивы, расширения)"
      - "Различия в типах и их проверке: SQLite по умолчанию позволяет записать строку в INTEGER-столбец"
      - "Поведение конкурентных транзакций, блокировок строк и уровней изоляции"
    wrong:
      - "Любые ошибки в транзакциях, так как SQLite не поддерживает транзакции"
      - "Ошибки в запросах с JOIN, так как SQLite их не поддерживает"
      - "Ошибки миграций, потому что SQLite не умеет создавать индексы"
      - "Ошибки в запросах с подзапросами, так как SQLite их не поддерживает"
      - "Ошибки в запросах с GROUP BY, так как SQLite не поддерживает агрегатные функции"

- id: be.test.contract_testing
  specializations: [backend]
  topic: testing
  skills: [api_testing, microservices]
  kind: single_choice
  irt: {a: 1.2, b: 1.2}
  params:
    a: {choice: [orders, checkout, mobile-bff, web-bff, billing, notifications]}
    b: {choice: [pricing, inventory, profile, loyalty, delivery, catalog]}
  stem_variants:
    - >-
      Сервис {{a}} вызывает API сервиса {{b}}, их разрабатывают разные команды и деплоят независимо. Нужно ловить
      ломающие изменения API {{b}} до деплоя, не поднимая полное end-to-end окружение. Какой подход для этого предназначен?
    - >-
      Команда {{b}} случайно переименовала поле в ответе, и сломался потребитель {{a}}. Как ловить такие изменения ещё в CI
      {{b}}, проверяя ожидания {{a}} без общего тестового стенда?
  options:
    correct: ["Контрактные тесты, управляемые потребителем (consumer-driven contracts, например Pact)"]
    wrong:
      - "Нагрузочные тесты {{b}}"
      - "Модульные тесты {{b}} с замоканной базой данных"
      - "Мутационное тестирование кода {{a}}"
      - "Snapshot-тесты пользовательского интерфейса"
      - "Smoke-тесты {{a}} после деплоя в прод"
      - "Статический анализ кода {{b}} линтером"

- id: be.test.unit_isolation
  specializations: [backend]
  topic: testing
  skills: [unit_testing]
  kind: single_choice
  irt: {a: 1.0, b: -1.4}
  params:
    fn: {choice: [calculate_delivery_price, convert_currency, check_address, get_weather_discount, validate_inn, enrich_profile]}
    dep: {choice: [внешнего API, сервиса партнёра, HTTP-сервиса справочников, облачного сервиса]}
  stem_variants:
    - >-
      Модульный тест функции {{fn}} иногда падает: функция обращается к реальному серверу {{dep}}, который бывает
      недоступен. Логику функции нужно проверять независимо от сети. Что сделать?
    - >-
      Unit-тесты {{fn}} медленные и нестабильные, потому что каждый тест ходит по сети к серверу {{dep}}. Как правильно изолировать
      проверяемую логику?
  options:
    correct:
      - "Подменить клиент {{dep}} тестовым двойником (stub или mock), возвращающим заданные ответы"
    wrong:
      - "Добавить в тест повтор запроса до 5 раз"
      - "Пометить тест как пропускаемый, если сервер недоступен"
      - "Увеличить таймаут запроса в тесте до минуты"
      - "Запускать тесты только ночью, когда сервер меньше нагружен"
      - "Удалить тест: модульные тесты не должны проверять функции с зависимостями"

- id: be.test.mutation_testing
  specializations: [backend]
  topic: testing
  skills: [unit_testing, test_automation]
  kind: single_choice
  irt: {a: 1.2, b: 1.4}
  params:
    cov: {int: [88, 99]}
    pct: {int: [30, 60], step: 5}
    module: {choice: [расчёта скидок, тарификации, валидации заявок, начисления бонусов]}
  stem_variants:
    - >-
      Модуль {{module}} покрыт тестами на {{cov}}% строк. Мутационное тестирование показало, что {{pct}}% мутантов
      (например, «>» заменено на «>=», «+» на «-») выживают — все тесты проходят. Что это означает?
    - >-
      Покрытие строк модуля {{module}} — {{cov}}%, но мутационный анализ даёт много выживших мутантов: около {{pct}}%.
      Как это интерпретировать?
  options:
    correct:
      - "Тесты выполняют код, но их проверки слабые: они не замечают изменений поведения; нужно добавить или усилить assert'ы, в том числе на граничные значения"
    wrong:
      - "Покрытие недостаточно: нужно поднять его до 100% строк, и мутанты исчезнут"
      - "Мутационное тестирование всегда даёт высокий процент выживших — результат можно игнорировать"
      - "В коде модуля есть ошибки, которые мутационное тестирование уже нашло"
      - "Тесты слишком медленные, поэтому мутанты не успевают проверяться"
      - "Выжившие мутанты означают, что в тестах есть flaky-тесты"
