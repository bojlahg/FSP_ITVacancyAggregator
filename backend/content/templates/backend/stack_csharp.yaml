- id: be.cs.sync_over_async
  specializations: [backend]
  topic: stack
  stack_module: csharp
  skills: [csharp, dotnet, concurrency]
  kind: single_choice
  irt: {a: 1.2, b: 1.2}
  params:
    method: {choice: [GetUserAsync, LoadPricesAsync, FetchReportAsync]}
  stem: >-
    Синхронный код вызывает асинхронный метод так: var x = {{method}}().Result;. Какое утверждение верно?
  options:
    correct:
      - "Поток блокируется до завершения задачи; при SynchronizationContext (WinForms, WPF, классический ASP.NET) это может дать взаимоблокировку, а в ASP.NET Core под нагрузкой — истощение пула потоков"
    wrong:
      - ".Result не блокирует поток: компилятор превращает его в await"
      - "Взаимоблокировка невозможна ни в каком окружении, потому что Task всегда выполняется в отдельном потоке"
      - "ConfigureAwait(false) в вызывающем коде на строке с .Result делает вызов неблокирующим"
      - "Асинхронный метод при вызове через .Result выполняется в отдельном процессе"
