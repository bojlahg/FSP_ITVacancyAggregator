- id: be.cs.async_void
  specializations: [backend]
  topic: stack
  stack_module: csharp
  skills: [csharp, dotnet, concurrency]
  kind: single_choice
  irt: {a: 1.2, b: 0.8}
  params:
    name: {choice: [SendReceipt, SyncInventory, RefreshCache, NotifyPartner, WriteAudit, UploadReport]}
    ex: {choice: [HttpRequestException, InvalidOperationException, TimeoutException, IOException]}
  stem_variants:
    - >-
      Метод объявлен как async void {{name}}(), внутри после await выбрасывается {{ex}}. Вызывающий код делает
      try { {{name}}(); } catch (Exception e) { … }. Что произойдёт?
    - >-
      В ASP.NET Core сервисе вызывается async void {{name}}(), обёрнутый в try/catch. После первого await внутри метода
      летит {{ex}}. Каков результат?
  options:
    correct:
      - "catch вызывающего кода исключение не поймает: у async void нет Task, которую можно ожидать; исключение уходит в контекст синхронизации или пул потоков и обычно завершает процесс — метод должен возвращать Task и ожидаться через await"
    wrong:
      - "Исключение будет перехвачено catch, как у синхронного метода"
      - "Исключение сохранится в возвращённой Task и пробросится при её ожидании"
      - "Среда выполнения молча проигнорирует исключение"
      - "Код не скомпилируется: async void запрещён везде, кроме обработчиков событий"
      - "Исключение будет записано в лог как предупреждение, а метод перезапустится"

- id: be.cs.concurrent_dictionary
  specializations: [backend]
  topic: stack
  stack_module: csharp
  skills: [csharp, dotnet, concurrency]
  kind: single_choice
  irt: {a: 1.1, b: -0.2}
  params:
    svc: {choice: [PriceCache, SessionRegistry, RateCounter, TemplateCache, TenantSettings, ExchangeRates]}
    value: {choice: [decimal, string, int, "List<string>"]}
  stem_variants:
    - >-
      Сервис {{svc}} зарегистрирован как Singleton и хранит данные в Dictionary<string, {{value}}>, который изменяется
      из параллельных HTTP-запросов без блокировок. Какое утверждение верно?
    - >-
      В синглтоне {{svc}} поле Dictionary<string, {{value}}> заполняется лениво при первом обращении из разных запросов
      ASP.NET Core одновременно. Синхронизации нет. Что верно?
  options:
    correct:
      - "Dictionary не потокобезопасен при одновременной записи: возможны повреждение структуры и исключения; использовать ConcurrentDictionary (например, GetOrAdd) или блокировку"
    wrong:
      - "Dictionary потокобезопасен: методы коллекций .NET синхронизированы"
      - "Проблем нет: ASP.NET Core обрабатывает все запросы в одном потоке"
      - "Достаточно объявить поле readonly"
      - "Достаточно объявить поле volatile"
      - "Достаточно заменить Dictionary на List<KeyValuePair<string, {{value}}>>"
