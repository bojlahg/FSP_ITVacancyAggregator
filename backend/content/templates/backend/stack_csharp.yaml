- id: be.cs.using_dispose
  specializations: [backend]
  topic: stack
  stack_module: csharp
  skills: [csharp, dotnet]
  kind: single_choice
  irt: {a: 1.0, b: -1.0}
  params:
    res: {choice: [SqlConnection, FileStream, HttpResponseMessage, StreamReader, NpgsqlConnection, MemoryStream, StreamWriter, Timer]}
  stem_variants:
    - "Объект {{res}} создаётся в блоке using. Что гарантирует using?"
    - "Код работает с {{res}} внутри using (var x = …) { … }. Какое утверждение о таком блоке верно?"
    - "Зачем объект {{res}} оборачивают в using? Что именно гарантирует эта конструкция?"
  options:
    correct: ["Dispose() будет вызван при выходе из блока, в том числе если внутри возникло исключение"]
    wrong:
      - "Объект сразу удаляется из памяти сборщиком мусора при выходе из блока"
      - "Dispose() вызывается только при нормальном выходе из блока, без исключений"
      - "Объект становится потокобезопасным внутри блока"
      - "Исключения внутри блока автоматически перехватываются и логируются"
      - "Dispose() вызывается в фоновом потоке через некоторое время после выхода из блока"

