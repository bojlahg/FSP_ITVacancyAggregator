- id: be.cs.scoped_in_singleton
  specializations: [backend]
  topic: stack
  stack_module: csharp
  skills: [csharp, aspnet]
  kind: single_choice
  irt: {a: 1.2, b: 0.5}
  params:
    single: {choice: [PriceCache, ReportScheduler, RateLimiter, FeatureFlags, MetricsCollector, TokenProvider]}
    scoped: {choice: [AppDbContext, UnitOfWork, CurrentUserContext, OrderRepository, TenantContext, RequestAuditLog]}
  stem_variants:
    - >-
      В ASP.NET Core {{single}} зарегистрирован как Singleton и принимает в конструкторе {{scoped}}, зарегистрированный
      как Scoped. Что не так с такой конфигурацией?
    - >-
      services.AddSingleton<{{single}}>(); services.AddScoped<{{scoped}}>(); — и {{single}} получает {{scoped}} через
      конструктор. В чём проблема?
  options:
    correct: ["Это захваченная зависимость: {{scoped}} будет жить столько же, сколько синглтон, и разделяться между запросами"]
    wrong:
      - "Ничего: контейнер будет передавать в {{single}} новый {{scoped}} на каждый HTTP-запрос"
      - "{{single}} автоматически станет Scoped"
      - "Ничего: время жизни определяется только интерфейсом, а не регистрацией"
      - "{{scoped}} автоматически станет Transient"
      - "Контейнер создаст отдельный экземпляр {{single}} на каждый запрос"
      - "Проблема только в производительности: {{scoped}} будет создаваться при каждом обращении к {{single}}"

