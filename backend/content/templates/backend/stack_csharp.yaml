- id: be.cs.sync_over_async
  specializations: [backend]
  topic: stack
  stack_module: csharp
  skills: [csharp, dotnet, concurrency]
  kind: single_choice
  irt: {a: 1.2, b: 1.2}
  params:
    method: {choice: [GetUserAsync, LoadPricesAsync, FetchReportAsync, SendEmailAsync, ReadConfigAsync, GetBalanceAsync, SaveOrderAsync, CallPartnerAsync]}
    form: {choice: [".Result", ".GetAwaiter().GetResult()", ".Wait()"]}
  stem_variants:
    - >-
      Синхронный код вызывает асинхронный метод так: {{method}}(){{form}};. Какое утверждение верно?
    - >-
      В библиотеке нет синхронной версии {{method}}, и разработчик пишет {{method}}(){{form}} внутри синхронного метода.
      Что верно про такой вызов?
    - >-
      Ревьюер нашёл строку {{method}}(){{form}} в коде, который вызывается из обработчика запросов. Какое утверждение о ней верно?
  options:
    correct:
      - "Поток блокируется до завершения задачи; при SynchronizationContext (WinForms, WPF, классический ASP.NET) это может дать взаимоблокировку, а в ASP.NET Core под нагрузкой — истощение пула потоков"
    wrong:
      - "Такой вызов не блокирует поток: компилятор превращает его в await"
      - "Взаимоблокировка невозможна ни в каком окружении, потому что Task всегда выполняется в отдельном потоке"
      - "ConfigureAwait(false) в вызывающем коде на этой же строке делает вызов неблокирующим"
      - "Асинхронный метод при таком вызове выполняется в отдельном процессе"
      - "Вызов сразу возвращает значение по умолчанию, не дожидаясь завершения задачи"
      - "Блокировка возможна только в консольных приложениях, а в UI и ASP.NET — нет"

