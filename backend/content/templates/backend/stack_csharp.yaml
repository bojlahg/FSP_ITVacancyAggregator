  kind: single_choice
  irt: {a: 1.0, b: -1.0}
  params:
    res: {choice: [SqlConnection, FileStream, HttpResponseMessage, StreamReader]}
  stem: "Объект {{res}} создаётся в блоке using. Что гарантирует using?"
  options:
    correct: ["Dispose() будет вызван при выходе из блока, в том числе если внутри возникло исключение"]
