# Backend · конкурентность (§10.2). Формат: content/templates/README.md

- id: be.conc.lost_update
  specializations: [backend]
  topic: concurrency
  skills: [concurrency]
  kind: single_choice
  irt: {a: 1.1, b: -0.9}
  params:
    n: {int: [10000, 90000], step: 10000}
    var: {choice: [counter, visits, total, hits]}
  stem: >-
    Два потока без синхронизации по {{n}} раз выполняют {{var}} += 1 над общей переменной (начальное значение 0).
    После завершения обоих потоков (join) итог оказался меньше ожидаемого. Почему?
  options:
    correct:
      - "Инкремент — это чтение, сложение и запись; два потока могут прочитать одно значение, и одно из увеличений потеряется"
    wrong:
      - "Компилятор выбрасывает часть итераций цикла как избыточные"
      - "Переменная переполнилась и начала счёт заново"
      - "Планировщик ОС не дал второму потоку выполнить все итерации до конца"
      - "Сборщик мусора периодически сбрасывает значение общей переменной"

- id: be.conc.semaphore_time
  specializations: [backend]
  topic: concurrency
  skills: [concurrency]
  kind: numeric
  irt: {a: 1.1, b: -0.6}
  params:
    tasks: {int: [12, 60], step: 4}
    k: {int: [3, 8]}
    t: {int: [2, 9]}
  stem: >-
    Нужно выполнить {{tasks|одинаковую независимую задачу|одинаковые независимые задачи|одинаковых независимых задач}} по {{t}} с каждая. Семафор допускает не более {{k}}
    задач одновременно, свободный слот сразу занимает следующая задача, накладных расходов нет. Через сколько
    секунд завершится последняя задача?
  answer:
    # число «волн» = ⌈tasks / k⌉
    expr: "-(-{{tasks}} // {{k}}) * {{t}}"
    tolerance: 0

- id: be.conc.event_loop_blocking
  specializations: [backend]
  topic: concurrency
  skills: [concurrency, nodejs, python]
  kind: single_choice
  irt: {a: 1.2, b: -0.4}
  params:
    runtime: {choice: [Node.js, Python asyncio]}
    s: {int: [2, 8]}
    task: {choice: [подсчёт хеша большого файла, генерация отчёта в цикле, сжатие изображения на чистом коде, разбор огромного JSON]}
  stem: >-
    В однопоточном event loop ({{runtime}}) обработчик запроса синхронно выполняет {{task}} — это занимает
    {{s}} с процессорного времени без единого await. Что происходит с другими запросами в это время?
  options:
    correct: ["Ждут: event loop занят, и остальные обработчики не выполняются, пока операция не закончится"]
    wrong:
      - "Обрабатываются параллельно: event loop сам переносит тяжёлую операцию в фоновый поток"
      - "Операция прерывается по таймауту event loop, и запрос получает ошибку"
      - "Замедляются только запросы того же пользователя"
      - "Обрабатываются нормально, потому что ядро ОС переключает задачи внутри event loop"

- id: be.conc.littles_law
  status: showcase
  specializations: [backend]
  topic: concurrency
  skills: [concurrency, system_design]
  kind: numeric
  irt: {a: 1.2, b: 0.2}
  params:
    rps: {int: [200, 3000], step: 100}
    ms: {choice: [20, 40, 50, 80, 120, 250]}
  stem: >-
    Сервис в установившемся режиме обрабатывает {{rps}} запросов в секунду, среднее время обработки запроса —
    {{ms}} мс. Сколько запросов в среднем находится в обработке одновременно?
  answer:
    # закон Литтла: L = λ · W
    expr: "{{rps}} * {{ms}} / 1000"
    tolerance: 0

- id: be.conc.deadlock_conditions
  specializations: [backend]
  topic: concurrency
  skills: [concurrency]
  kind: multi_choice
  irt: {a: 1.1, b: 0.3}
  n_options: 5
  params:
    res: {choice: [мьютексы, строки в БД, файлы, соединения из пула]}
  stem_variants:
    - "Потоки захватывают ресурсы ({{res}}). Какие условия (условия Коффмана) необходимы, чтобы возникла взаимная блокировка?"
    - "Какие из перечисленных условий входят в необходимые условия взаимной блокировки при работе с ресурсами типа «{{res}}»?"
  options:
    correct:
      - "Взаимное исключение: ресурс может держать только один поток"
      - "Удержание и ожидание: поток держит один ресурс и ждёт другой"
      - "Нет принудительного освобождения: ресурс нельзя отобрать у потока"
      - "Циклическое ожидание: потоки ждут друг друга по кругу"
    wrong:
      - "Потоков больше, чем ядер процессора"
      - "Активное ожидание (spin-wait) хотя бы одного потока"
      - "Голодание потока с низким приоритетом"
      - "Отсутствие volatile у разделяемых переменных"

- id: be.conc.optimistic_locking
  specializations: [backend]
  topic: concurrency
  skills: [concurrency, sql]
  kind: single_choice
  irt: {a: 1.2, b: 0.6}
  params:
    table: {choice: [products, tickets, accounts, documents]}
    id: {int: [10, 999]}
    v: {int: [2, 40]}
  stem: >-
    Оптимистическая блокировка: UPDATE {{table}} SET qty = qty - 1, version = version + 1
    WHERE id = {{id}} AND version = {{v}}. Запрос затронул 0 строк, хотя строка с id = {{id}} существует. Что это
    значит и что делать?
  options:
    correct:
      - "Строку уже изменила другая транзакция; перечитать актуальную версию и повторить операцию или вернуть конфликт"
    wrong:
      - "Транзакция откатилась из-за deadlock; нужно увеличить таймаут блокировки"
      - "Это временная ошибка; повторить тот же UPDATE с тем же version"
      - "Индекс по version повреждён; нужно выполнить REINDEX"
      - "Строка заблокирована SELECT FOR UPDATE; нужно подождать и прочитать её снова без изменения"

- id: be.conc.amdahl
  specializations: [backend]
  topic: concurrency
  skills: [concurrency]
  kind: numeric
  irt: {a: 1.1, b: 1.0}
  time_limit_sec: 150
  params:
    p: {choice: [50, 60, 70, 75, 80, 85, 90, 95, 98]}
    n: {choice: [2, 3, 4, 6, 8, 10, 12, 16, 32, 64]}
    job: {choice: [программы, пакетной обработки, ETL-задачи, рендеринга отчёта]}
  stem_variants:
    - >-
      {{p}}% времени работы {{job}} идеально распараллеливается, остальное выполняется строго последовательно.
      Во сколько раз она ускорится на {{n}} ядрах по закону Амдала? Округлите до сотых.
    - >-
      Профилирование {{job}} показало: {{p}}% времени уходит на части, которые идеально делятся между ядрами,
      остальное время — последовательный код. Какое ускорение даст запуск на {{n}} ядрах по закону Амдала? Округлите до сотых.
    - >-
      По закону Амдала оцените ускорение {{job}} на {{n}} ядрах, если параллелится {{p}}% времени выполнения
      (без накладных расходов), а остальное — последовательно. Округлите до сотых.
  answer:
    # закон Амдала: S = 1 / ((1 − p) + p / n)
    expr: "round(1 / ((1 - {{p}} / 100) + {{p}} / 100 / {{n}}), 2)"
    tolerance: 0.02

- id: be.conc.cas_properties
  specializations: [backend]
  topic: concurrency
  skills: [concurrency]
  kind: multi_choice
  irt: {a: 1.2, b: 1.3}
  n_options: 5
  params:
    what: {choice: [счётчик запросов, lock-free стек, указатель на голову очереди, ссылку на текущую конфигурацию]}
  stem: "Вы реализуете {{what}} на операции compare-and-swap (CAS) в цикле повторов. Какие утверждения верны?"
  options:
    correct:
      - "CAS атомарно сравнивает значение с ожидаемым и записывает новое только при совпадении"
      - "При высокой конкуренции цикл повторов CAS может тратить много процессорного времени"
      - "Возможна проблема ABA: значение вернулось к исходному, и CAS не заметит промежуточное изменение"
    wrong:
      - "Каждая операция CAS захватывает мьютекс операционной системы"
      - "Цикл на CAS гарантирует, что каждый поток завершит операцию за ограниченное число своих шагов (wait-free)"
      - "Алгоритмы на CAS не подвержены гонкам данных по определению, как бы они ни были написаны"
      - "CAS работает только с числами с плавающей точкой"

- id: be.conc.design_seat_booking
  specializations: [backend]
  topic: concurrency
  skills: [concurrency, sql, system_design]
  kind: open_approach
  irt: {a: 1.0, b: 0.7}
  time_limit_sec: 600
  params:
    what: {choice: [места в зале кинотеатра, билеты на концерт, слоты записи к врачу, номера в отеле]}
    peak: {int: [500, 5000], step: 500}
  stem: >-
    Сервис бронирует {{what}}. На старте продаж приходит до {{peak}} запросов в секунду, и одно и то же место
    не должно продаться дважды. Опишите, как обеспечить отсутствие двойных бронирований и что увидит пользователь,
    которому место не досталось.
  rubric:
    - Гарантия на уровне хранилища (уникальное ограничение, условный UPDATE, SELECT FOR UPDATE или оптимистическая блокировка), а не проверка «сначала прочитать, потом записать» без защиты
    - Понимает гонку между проверкой доступности и записью и объясняет, почему выбранный способ её закрывает
    - Временное удержание места с истечением (TTL) до оплаты и освобождение при неоплате
    - Обработка конфликта для пользователя (понятная ошибка, предложение других мест) и идемпотентность повторов
    - Учитывает нагрузку на «горячие» строки (очередь, шардирование по событию, ограничение входящего потока)

- id: be.conc.mutex_purpose
  specializations: [backend]
  topic: concurrency
  skills: [concurrency]
  kind: single_choice
  irt: {a: 1.0, b: -1.5}
  params:
    method: {choice: [addItem, transfer, increment, register, reserve, updateStats]}
    res: {choice: [список заказов, баланс счёта, счётчик посещений, кеш сессий, словарь настроек, очередь задач]}
  stem_variants:
    - "Несколько потоков вызывают метод {{method}}(), который изменяет общий ресурс ({{res}}). Тело метода выполняется под захваченным мьютексом. Что это гарантирует?"
    - "Код, изменяющий общий ресурс ({{res}}), в методе {{method}}() окружён lock/unlock одного мьютекса. Какое свойство это обеспечивает?"
  options:
    correct:
      - "В защищённом участке кода одновременно находится не более одного потока"
      - "Пока один поток выполняет защищённый участок, другие потоки, пытающиеся захватить тот же мьютекс, ждут"
    wrong:
      - "Потоки выполняют участок строго в порядке их создания"
      - "Код внутри участка выполняется быстрее за счёт кеша процессора"
      - "Взаимные блокировки в программе становятся невозможными"
      - "Каждый поток получает собственную копию ресурса"
      - "Исключения внутри участка автоматически перехватываются"

- id: be.conc.false_sharing
  specializations: [backend]
  topic: concurrency
  skills: [concurrency]
  kind: single_choice
  irt: {a: 1.2, b: 1.6}
  time_limit_sec: 120
  params:
    threads: {choice: [8, 16, 32]}
    lang: {choice: [C++, Java, Go, Rust]}
    what: {choice: [обработанных сообщений, прочитанных байт, найденных совпадений, ошибок валидации]}
  stem_variants:
    - >-
      Программа на {{lang}} запускает {{threads|поток|потока|потоков}} на {{threads}} свободных ядрах. Поток i считает число {{what}} в своём
      элементе counters[i] общего массива 64-битных счётчиков и в чужие элементы не пишет; синхронизации нет, и она не нужна.
      Программа работает медленнее, чем однопоточная версия. Какая причина наиболее вероятна?
    - >-
      В сервисе на {{lang}} {{threads|поток|потока|потоков}} увеличивают каждый свой счётчик {{what}}: счётчики лежат подряд в одном массиве,
      поток пишет только в свой элемент. Ядер достаточно, блокировок нет, но масштабирование почти нулевое. В чём причина?
  options:
    correct:
      - "Ложное разделение (false sharing): соседние счётчики попадают в одну кеш-линию, и ядра постоянно отбирают её друг у друга; помогает выравнивание счётчиков по размеру кеш-линии"
    wrong:
      - "Гонка данных: потоки перезаписывают счётчики друг друга, нужна блокировка"
      - "Слишком частые переключения контекста между потоками"
      - "Компилятор вставляет неявный мьютекс на каждую запись в элемент массива"
      - "Процессор выполняет записи в один массив строго последовательно, независимо от адресов элементов"
      - "Сборщик мусора останавливает потоки при каждой записи в массив"

