- id: be.py.gil_cpu_bound
  specializations: [backend]
  topic: stack
  stack_module: python
  skills: [python, concurrency]
  kind: single_choice
  irt: {a: 1.2, b: 0.3}
  params:
    cores: {choice: [4, 8, 16, 32, 64]}
    task: {choice: [пересчёт хешей паролей, обработка изображений на чистом Python, численное моделирование в циклах, разбор и агрегация больших логов, поиск путей в графе, генерация отчётов с расчётами в циклах]}
  stem_variants:
    - >-
      В стандартной сборке CPython (с GIL) нужно ускорить CPU-bound задачу — {{task}} — на сервере с {{cores}} ядрами.
      Код написан на чистом Python. Что даст реальное параллельное ускорение?
    - >-
      Задача «{{task}}» нагружает одно ядро на 100%, а на сервере {{cores}} ядер. Код — чистый Python, интерпретатор —
      обычный CPython с GIL. Какой способ распараллеливания действительно ускорит работу?
  options:
    correct:
      - "Запуск в нескольких процессах: multiprocessing или ProcessPoolExecutor"
      - "ProcessPoolExecutor с max_workers={{cores}}"
    wrong:
      - "ThreadPoolExecutor с max_workers={{cores}}"
      - "asyncio.gather для запуска вычислений одновременно"
      - "threading.Thread на каждый кусок данных"
      - "Уменьшить sys.setswitchinterval, чтобы потоки чаще переключались"
      - "asyncio.to_thread для каждого куска данных"

