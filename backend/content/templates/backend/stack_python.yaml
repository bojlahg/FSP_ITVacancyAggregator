- id: be.py.gather_exception
  specializations: [backend]
  topic: stack
  stack_module: python
  skills: [python, concurrency]
  kind: single_choice
  irt: {a: 1.2, b: 1.3}
  params:
    a: {choice: [fetch_user, load_prices, get_stock]}
    b: {choice: [fetch_orders, load_rates, get_reviews]}
    c: {choice: [send_metrics, warm_cache, sync_profile]}
  stem: >-
    Код выполняет await asyncio.gather({{a}}(), {{b}}(), {{c}}()) с параметрами по умолчанию
    (return_exceptions=False). {{a}}() быстро выбрасывает исключение. Что происходит с {{b}}() и {{c}}()?
  options:
    correct: ["Продолжают выполняться: gather сразу пробрасывает первое исключение, но не отменяет остальные задачи"]
    wrong:
      - "Автоматически отменяются, как в asyncio.TaskGroup"
      - "gather дожидается их завершения и выбрасывает ExceptionGroup со всеми ошибками"
      - "Исключение подавляется, и gather возвращает результаты остальных корутин"
      - "Event loop останавливается, и все корутины прерываются"

