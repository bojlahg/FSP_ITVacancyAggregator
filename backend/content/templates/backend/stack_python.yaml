- id: be.py.sqlalchemy_eager_loading
  specializations: [backend]
  topic: stack
  stack_module: python
  skills: [python, sqlalchemy]
  kind: single_choice
  irt: {a: 1.1, b: 0.5}
  params:
    parent: {choice: [Order, Author, Project, Customer]}
    child: {choice: [items, books, tasks, addresses]}
  stem: >-
    В SQLAlchemy 2 загружается список {{parent}}, затем в цикле читается {{parent}}.{{child}} — связь настроена
    по умолчанию (lazy="select"), и выполняется N+1 запрос. Как загрузить связанные объекты заранее, малым числом запросов?
  options:
    correct:
      - "select({{parent}}).options(selectinload({{parent}}.{{child}}))"
      - "select({{parent}}).options(joinedload({{parent}}.{{child}}))"
    wrong:
      - "Вызвать session.flush() перед циклом"
      - "Вызвать session.expire_all() перед циклом"
      - "Добавить индекс на внешний ключ связи {{child}}"
      - "select({{parent}}).options(lazyload({{parent}}.{{child}}))"

- id: be.py.async_blocking_call
  specializations: [backend]
  topic: stack
  stack_module: python
  skills: [python, fastapi]
  kind: single_choice
  irt: {a: 1.2, b: 0.6}
  params:
    path: {choice: [/report, /sync, /export, /weather]}
    call: {choice: ["time.sleep(2)", "requests.get(UPSTREAM_URL, timeout=5)", "psycopg2.connect(DSN).cursor().execute(SQL)"]}
  stem: "Под нагрузкой этот эндпоинт FastAPI задерживает ответы всем клиентам, а не только своим. В чём причина и как исправить?"
  code: |
    @app.get("{{path}}")
    async def handler():
        {{call}}
        return {"ok": True}
  code_language: python
  options:
    correct:
      - "Блокирующий вызов внутри async def останавливает весь event loop; заменить его асинхронным аналогом или вынести в поток (asyncio.to_thread)"
      - "Блокирующий вызов внутри async def останавливает event loop; объявить обработчик через обычный def — FastAPI выполнит его в пуле потоков"
    wrong:
      - "FastAPI выполняет async-обработчики в пуле потоков, поэтому причина в нехватке потоков — увеличить пул"
      - "Не хватает await перед return — без него ответ не отправляется вовремя"
      - "Добавить @lru_cache на обработчик — блокировка исчезнет"
      - "Uvicorn запускает каждый запрос в отдельном процессе, поэтому причина в медленном старте процессов"

