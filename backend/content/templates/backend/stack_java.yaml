  stem_variants:
    - "Метод {{method}}() может выбросить одно из перечисленных исключений. Какое из них проверяемое (checked) — его нужно объявить в throws или перехватить?"
    - "Какое исключение в Java является проверяемым (checked), то есть компилятор требует обработать его в {{method}}() или объявить в throws?"
