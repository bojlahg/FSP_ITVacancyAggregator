- id: be.algo.doubling_loop_complexity
  specializations: [backend]
  topic: algorithms
  skills: [algorithms]
  kind: single_choice
  irt: {a: 1.2, b: 0.6}
  params:
    k: {choice: [2, 3, 4]}
    fn: {choice: [process, handle, visit]}
  stem: "Какова временная сложность этой функции в зависимости от n (считаем, что {{fn}} работает за O(1))?"
  code: |
    def run(n):
        for i in range(n):
            j = 1
            while j < n:
                {{fn}}(i, j)
                j *= {{k}}
  code_language: python
  options:
    correct: ["O(n log n)"]
    wrong: ["O(n²)", "O(n)", "O(log n)", "O(n·{{k}})", "O(n^{{k}})"]

- id: be.algo.consistent_hashing
  specializations: [backend]
  topic: algorithms
  skills: [algorithms, system_design]
  kind: numeric
  irt: {a: 1.1, b: 1.0}
  time_limit_sec: 150
  params:
    keys: {choice: [120000, 240000, 360000, 1200000]}
    n: {choice: [3, 4, 5, 7, 9]}
  stem: >-
    Кеш распределяет {{keys}} ключей по {{n}} узлам с помощью консистентного хеширования (много виртуальных узлов,
    распределение равномерное). Добавили ещё один узел. Сколько ключей в среднем сменят узел?
  answer:
    # на новый узел переезжает его доля K / (n + 1); остальные ключи остаются на месте
    expr: "{{keys}} / ({{n}} + 1)"
    tolerance: 0

- id: be.algo.bloom_filter
  specializations: [backend]
  topic: algorithms
  skills: [algorithms, data_structures]
  kind: multi_choice
  irt: {a: 1.2, b: 1.2}
  n_options: 5
  params:
    use: {choice: [проверки, встречался ли URL краулеру, отсеивания запросов к несуществующим ключам, проверки занятости логина, фильтрации уже показанных рекомендаций]}
  stem: "Для {{use}} используется классический фильтр Блума. Какие утверждения о нём верны?"
  options:
    correct:
      - "Может ответить «элемент есть», когда его не добавляли (ложноположительный ответ)"
      - "Не даёт ложноотрицательных ответов для добавленных элементов"
      - "Не поддерживает удаление элементов без риска испортить ответы для других"
    wrong:
      - "Может ответить «элемента нет» для добавленного элемента"
      - "Хранит сами элементы, поэтому их можно перечислить"
      - "Вероятность ложного срабатывания не зависит от числа добавленных элементов"
      - "Размер фильтра растёт пропорционально длине добавляемых строк"
