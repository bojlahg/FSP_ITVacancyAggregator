- id: be.algo.nested_loop_count
  specializations: [backend]
  topic: algorithms
  skills: [algorithms]
  kind: numeric
  irt: {a: 1.1, b: -0.4}
  time_limit_sec: 120
  params:
    n: {int: [6, 40]}
    fn: {choice: [compare, check_pair, link, merge_pair]}
    items: {choice: [users, points, tasks, nodes]}
  stem: "Сколько раз будет вызвана функция {{fn}} при выполнении этого кода?"
  code: |
    {{items}} = list(range({{n}}))
    for i in range(len({{items}})):
        for j in range(i + 1, len({{items}})):
            {{fn}}({{items}}[i], {{items}}[j])
  code_language: python
  answer:
    # все неупорядоченные пары: n · (n − 1) / 2
    expr: "{{n}} * ({{n}} - 1) // 2"
    tolerance: 0

- id: be.algo.heap_top_k
  specializations: [backend]
  topic: algorithms
  skills: [algorithms, data_structures]
  kind: single_choice
  irt: {a: 1.1, b: 0.3}
  params:
    k: {choice: [10, 20, 50, 100, 200, 500]}
    what: {choice: [самых дорогих заказов, самых медленных запросов, самых активных пользователей, наибольших транзакций, самых длинных сессий, самых крупных файлов, самых популярных товаров, самых долгих вызовов API]}
  stem_variants:
    - >-
      В сервис идёт бесконечный поток событий, и в любой момент нужно отдавать {{k}} {{what}} из всех полученных.
      Какая структура данных позволяет обрабатывать каждое событие за O(log k) при памяти O(k)?
    - >-
      Нужно непрерывно поддерживать топ-{{k}} {{what}} в потоке событий, который не помещается в память. Что выбрать,
      чтобы обработка одного события занимала O(log k), а память — O(k)?
  options:
    correct: ["Двоичная куча (min-heap) размера k: новый элемент вытесняет минимум, если он больше"]
    wrong:
      - "Отсортированный массив размера k с пересортировкой после каждой вставки"
      - "Хеш-таблица всех полученных событий"
      - "Стек размера k"
      - "Очередь FIFO размера k"
      - "Max-heap из всех полученных событий"
      - "Связный список всех событий, отсортированный при вставке"

