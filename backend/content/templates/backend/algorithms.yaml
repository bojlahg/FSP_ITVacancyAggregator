- id: be.algo.hash_lookup_complexity
  specializations: [backend]
  topic: algorithms
  skills: [algorithms, data_structures]
  kind: multi_choice
  irt: {a: 1.2, b: 0.1}
  params:
    n: {choice: ["10 тысяч", "1 миллион", "100 миллионов", "50 тысяч", "5 миллионов"]}
    what: {choice: [записей, ключей, пользователей, заказов]}
  stem_variants:
    - "Есть {{n}} {{what}}. Какие утверждения о средней сложности операций верны?"
    - "Сервис хранит {{n}} {{what}} в памяти. Какие оценки средней временной сложности операций верны (n — число элементов)?"
  options:
    correct:
      - Поиск по ключу в хеш-таблице — O(1)
      - Поиск в сбалансированном дереве поиска — O(log n)
      - Поиск в несортированном массиве — O(n)
      - Бинарный поиск в отсортированном массиве — O(log n)
      - Доступ к элементу массива по индексу — O(1)
    wrong:
      - Вставка в конец динамического массива — O(n) в среднем
      - Поиск по ключу в хеш-таблице — O(log n)
      - Бинарный поиск в несортированном массиве — O(log n)
      - Поиск в сбалансированном дереве поиска — O(1)
      - Доступ к k-му элементу связного списка — O(1)
      - Поиск в несортированном массиве — O(log n)
  n_options: 5

