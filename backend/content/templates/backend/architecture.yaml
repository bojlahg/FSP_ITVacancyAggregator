# Backend · архитектура (§10.2). Формат: content/templates/README.md

- id: be.arch.srp
  specializations: [backend]
  topic: architecture
  skills: [solid, oop]
  kind: single_choice
  irt: {a: 1.0, b: -1.0}
  params:
    cls: {choice: [OrderService, ReportManager, InvoiceHandler, UserProcessor]}
    calc: {choice: [скидку, налог, итоговую стоимость, комиссию]}
    out: {choice: [формирует PDF-отчёт, отправляет письмо клиенту, пишет запись в журнал аудита, публикует событие в Kafka]}
  stem: >-
    Класс {{cls}} рассчитывает {{calc}}, сохраняет результат в базу данных и {{out}}. Любое изменение в одной из этих
    задач требует правки этого класса. Какой принцип SOLID нарушен в первую очередь?
  options:
    correct: ["Принцип единственной ответственности (SRP)"]
    wrong:
      - "Принцип открытости/закрытости (OCP)"
      - "Принцип подстановки Лисков (LSP)"
      - "Принцип разделения интерфейсов (ISP)"
      - "Принцип инверсии зависимостей (DIP)"

- id: be.arch.horizontal_scaling
  specializations: [backend]
  topic: architecture
  skills: [system_design]
  kind: multi_choice
  irt: {a: 1.1, b: -0.7}
  n_options: 5
  params:
    n: {int: [2, 12]}
    app: {choice: [интернет-магазин, личный кабинет банка, сервис бронирования, CRM]}
  stem: >-
    Бэкенд ({{app}}) нужно запустить в {{n}} экземплярах за балансировщиком без «липких» сессий. Что нужно сделать,
    чтобы он работал корректно?
  options:
    correct:
      - "Хранить сессии во внешнем хранилище (Redis, БД), а не в памяти процесса"
      - "Сохранять загружаемые файлы в общее объектное хранилище, а не на локальный диск экземпляра"
      - "Сделать фоновые задания безопасными при нескольких экземплярах (очередь, распределённая блокировка)"
    wrong:
      - "Кешировать корзину пользователя в глобальной переменной процесса"
      - "Дать каждому экземпляру собственную независимую копию основной базы без репликации"
      - "Увеличить память и число ядер одного сервера"
      - "Генерировать id новых записей счётчиком в памяти каждого экземпляра"

- id: be.arch.dip
  specializations: [backend]
  topic: architecture
  skills: [solid, clean_architecture]
  kind: single_choice
  irt: {a: 1.1, b: -0.4}
  params:
    svc: {choice: [PaymentService, NotificationService, BillingService, SearchService]}
    impl: {choice: [PostgresRepository, SmtpClient, YooKassaGateway, ElasticClient]}
  stem: >-
    {{svc}} сам создаёт внутри себя new {{impl}}(), поэтому в модульном тесте его не подменить. Какой принцип
    предписывает зависеть от абстракции и получать конкретную реализацию извне (например, через конструктор)?
  options:
    correct: ["Принцип инверсии зависимостей (DIP)"]
    wrong:
      - "Принцип единственной ответственности (SRP)"
      - "Принцип подстановки Лисков (LSP)"
      - "Принцип разделения интерфейсов (ISP)"
      - "Принцип YAGNI"

- id: be.arch.cache_aside_order
  specializations: [backend]
  topic: architecture
  skills: [caching, redis]
  kind: ordering
  irt: {a: 1.0, b: -0.2}
  params:
    entity: {choice: [карточку товара, профиль пользователя, курс валют, настройки тарифа]}
    store: {choice: [Redis, Memcached]}
  stem: "Сервис читает {{entity}} по схеме cache-aside с кешем в {{store}}. Расположите шаги чтения при промахе кеша в правильном порядке."
  order_items:
    - "Запросить ключ в {{store}}"
    - "Получить промах: значения в кеше нет"
    - "Прочитать {{entity}} из основной базы данных"
    - "Записать значение в {{store}} с TTL"
    - "Вернуть {{entity}} клиенту"

- id: be.arch.circuit_breaker
  specializations: [backend]
  topic: architecture
  skills: [microservices, system_design]
  kind: single_choice
  irt: {a: 1.2, b: 0.3}
  params:
    dep: {choice: [сервис рекомендаций, платёжный шлюз, сервис геокодинга, внешний API курсов валют]}
  stem: >-
    {{dep}} начал отвечать по таймауту, и потоки вызывающего сервиса копятся в ожидании. Нужно, чтобы после серии
    ошибок вызовы сразу завершались ошибкой, не нагружая зависимость, а через паузу пробные запросы проверяли её
    восстановление. Какой паттерн это описывает?
  options:
    correct: ["Circuit Breaker"]
    wrong: ["Retry с экспоненциальной задержкой", "Saga", "Strangler Fig", "Sidecar", "CQRS"]

- id: be.arch.cap_partition
  specializations: [backend]
  topic: architecture
  skills: [system_design]
  kind: single_choice
  irt: {a: 1.1, b: 0.5}
  params:
    store: {choice: [распределённого хранилища конфигураций, кластера баз данных, распределённого кеша, системы учёта остатков]}
  stem: >-
    Во время сетевого разделения узлы {{store}} перестали видеть друг друга. Система настроена всегда возвращать
    только согласованные (линеаризуемые) данные. Что ей приходится делать согласно теореме CAP?
  options:
    correct: ["Отказывать в части запросов, жертвуя доступностью, пока разделение не устранено"]
    wrong:
      - "Отвечать на все запросы актуальными данными на всех узлах"
      - "Перейти на синхронную репликацию и сохранить и согласованность, и доступность"
      - "Ничего: теорема CAP касается только однонодовых СУБД"
      - "Отвечать на все запросы, жертвуя согласованностью"

- id: be.arch.kafka_ordering
  specializations: [backend]
  topic: architecture
  skills: [kafka, event_driven]
  kind: single_choice
  irt: {a: 1.2, b: 0.7}
  params:
    entity: {choice: [order, account, user, shipment]}
    parts: {choice: [6, 12, 24, 48]}
  stem: >-
    События по каждому {{entity}} (создан → изменён → закрыт) публикуются в топик Kafka с {{parts}} партициями,
    и потребитель должен обрабатывать их в порядке появления для одного {{entity}}. Как этого добиться?
  options:
    correct: ["Использовать {{entity}}_id как ключ сообщения: сообщения с одинаковым ключом попадают в одну партицию"]
    wrong:
      - "Ничего не делать: Kafka гарантирует порядок в пределах всего топика"
      - "Создать отдельную consumer group для каждого {{entity}}"
      - "Увеличить число партиций до числа потребителей"
      - "Отправлять сообщения без ключа, чтобы продюсер распределял их равномерно"

- id: be.arch.saga
  specializations: [backend]
  topic: architecture
  skills: [microservices, ddd]
  kind: single_choice
  irt: {a: 1.2, b: 0.9}
  params:
    a: {choice: [заказов, бронирований, подписок]}
    b: {choice: [платежей, биллинга, лояльности]}
    c: {choice: [склада, доставки, уведомлений]}
  stem: >-
    Бизнес-операция затрагивает сервисы {{a}}, {{b}} и {{c}}, у каждого своя база данных. Нужна согласованность
    без двухфазного коммита и долгих распределённых блокировок. Какой подход используют?
  options:
    correct: ["Сагу: цепочку локальных транзакций, где на сбой шага выполняются компенсирующие действия"]
    wrong:
      - "CQRS: разделить модели чтения и записи"
      - "Circuit Breaker между сервисами"
      - "API Gateway, который объединит вызовы в одну транзакцию"
      - "Шардирование баз данных по идентификатору клиента"

- id: be.arch.transactional_outbox
  specializations: [backend]
  topic: architecture
  skills: [microservices, event_driven, kafka]
  kind: single_choice
  irt: {a: 1.3, b: 1.1}
  params:
    entity: {choice: [заказ, платёж, пользователя, заявку]}
    event: {choice: [OrderCreated, PaymentCaptured, UserRegistered, ApplicationSubmitted]}
    broker: {choice: [Kafka, RabbitMQ]}
  stem: >-
    Сервис сохраняет {{entity}} в PostgreSQL и после COMMIT публикует событие {{event}} в {{broker}}. Иногда процесс
    падает между коммитом и публикацией, и событие теряется. Какой паттерн надёжно решает проблему?
  options:
    correct: ["Transactional Outbox: записать событие в таблицу outbox в той же транзакции и публиковать её отдельным процессом"]
    wrong:
      - "Публиковать событие до COMMIT транзакции"
      - "Повторять публикацию в том же обработчике запроса, пока она не пройдёт"
      - "Circuit Breaker вокруг клиента {{broker}}"
      - "Включить подтверждения (acks) от {{broker}} — этого достаточно"

- id: be.arch.cache_stampede
  specializations: [backend]
  topic: architecture
  skills: [caching, system_design]
  kind: multi_choice
  irt: {a: 1.2, b: 1.3}
  n_options: 5
  params:
    key: {choice: ["главная страница каталога", "курсы валют", "топ-100 товаров", "настройки тарифов"]}
    rps: {int: [2000, 20000], step: 1000}
  stem: >-
    Ключ кеша «{{key}}» читают {{rps}} раз в секунду. Когда у него истекает TTL, все запросы одновременно идут
    в базу данных, и она перегружается (cache stampede). Какие меры помогают?
  options:
    correct:
      - "Single-flight / блокировка на пересчёт: значение пересчитывает один запрос, остальные ждут или получают старое"
      - "Обновлять значение заранее, до истечения TTL (фоновое или вероятностное раннее обновление)"
      - "Отдавать устаревшее значение, пока идёт пересчёт (stale-while-revalidate)"
      - "Случайный разброс TTL (jitter), чтобы связанные ключи не истекали одновременно"
    wrong:
      - "Уменьшить TTL ключа в несколько раз"
      - "Сбрасывать весь кеш при каждом изменении данных"
      - "Добавить экземпляров приложения"
      - "Увеличить объём памяти сервера кеша"

- id: be.arch.design_notifications
  specializations: [backend]
  topic: architecture
  skills: [system_design, microservices, event_driven]
  kind: open_approach
  irt: {a: 1.0, b: 1.3}
  time_limit_sec: 600
  params:
    volume: {choice: ["1 млн", "5 млн", "20 млн"]}
    channels: {choice: ["email и push", "SMS, email и push", "push и Telegram"]}
  stem: >-
    Нужно спроектировать сервис уведомлений: {{volume}} сообщений в сутки по каналам {{channels}}, внешние провайдеры
    иногда недоступны, пользователь не должен получить одно уведомление дважды. Опишите архитектуру и ключевые решения.
  rubric:
    - Асинхронная обработка через очередь или брокер с отделением приёма запросов от отправки
    - Повторы с экспоненциальной задержкой и dead letter queue для недоставляемых сообщений
    - Защита от дублей (ключ идемпотентности или дедупликация) с учётом семантики at-least-once
    - Изоляция каналов и провайдеров (отдельные очереди или воркеры, rate limit провайдера, circuit breaker)
    - Учёт пользовательских настроек и тихих часов, статусы доставки и наблюдаемость (метрики, логи)
