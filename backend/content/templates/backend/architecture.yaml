# Backend · архитектура (§10.2). Формат: content/templates/README.md

- id: be.arch.srp
  specializations: [backend]
  topic: architecture
  skills: [solid, oop]
  kind: single_choice
  irt: {a: 1.0, b: -1.0}
  params:
    cls: {choice: [OrderService, ReportManager, InvoiceHandler, UserProcessor]}
    calc: {choice: [скидку, налог, итоговую стоимость, комиссию]}
    out: {choice: [формирует PDF-отчёт, отправляет письмо клиенту, пишет запись в журнал аудита, публикует событие в Kafka]}
  stem: >-
    Класс {{cls}} рассчитывает {{calc}}, сохраняет результат в базу данных и {{out}}. Любое изменение в одной из этих
    задач требует правки этого класса. Какой принцип SOLID нарушен в первую очередь?
  options:
    correct: ["Принцип единственной ответственности (SRP)"]
    wrong:
      - "Принцип открытости/закрытости (OCP)"
      - "Принцип подстановки Лисков (LSP)"
      - "Принцип разделения интерфейсов (ISP)"
      - "Принцип инверсии зависимостей (DIP)"

- id: be.arch.horizontal_scaling
  specializations: [backend]
  topic: architecture
  skills: [system_design]
  kind: multi_choice
  irt: {a: 1.1, b: -0.7}
  n_options: 5
  params:
    n: {int: [2, 12]}
    app: {choice: [интернет-магазин, личный кабинет банка, сервис бронирования, CRM]}
  stem: >-
    Бэкенд ({{app}}) нужно запустить в {{n}} экземплярах за балансировщиком без «липких» сессий. Что нужно сделать,
    чтобы он работал корректно?
  options:
    correct:
      - "Хранить сессии во внешнем хранилище (Redis, БД), а не в памяти процесса"
      - "Сохранять загружаемые файлы в общее объектное хранилище, а не на локальный диск экземпляра"
      - "Сделать фоновые задания безопасными при нескольких экземплярах (очередь, распределённая блокировка)"
    wrong:
      - "Кешировать корзину пользователя в глобальной переменной процесса"
      - "Дать каждому экземпляру собственную независимую копию основной базы без репликации"
      - "Увеличить память и число ядер одного сервера"
      - "Генерировать id новых записей счётчиком в памяти каждого экземпляра"

- id: be.arch.dip
  specializations: [backend]
  topic: architecture
  skills: [solid, clean_architecture]
  kind: single_choice
  irt: {a: 1.1, b: -0.4}
  params:
    svc: {choice: [PaymentService, NotificationService, BillingService, SearchService]}
    impl: {choice: [PostgresRepository, SmtpClient, YooKassaGateway, ElasticClient]}
  stem: >-
    {{svc}} сам создаёт внутри себя new {{impl}}(), поэтому в модульном тесте его не подменить. Какой принцип
    предписывает зависеть от абстракции и получать конкретную реализацию извне (например, через конструктор)?
  options:
    correct: ["Принцип инверсии зависимостей (DIP)"]
    wrong:
      - "Принцип единственной ответственности (SRP)"
      - "Принцип подстановки Лисков (LSP)"
      - "Принцип разделения интерфейсов (ISP)"
      - "Принцип YAGNI"

- id: be.arch.cache_aside_order
  specializations: [backend]
  topic: architecture
  skills: [caching, redis]
  kind: ordering
  irt: {a: 1.0, b: -0.2}
  params:
    entity: {choice: [карточку товара, профиль пользователя, курс валют, настройки тарифа, расписание рейсов, список категорий, баланс бонусов, прайс-лист поставщика]}
    store: {choice: [Redis, Memcached]}
    ttl: {choice: [60, 300, 600, 3600]}
  stem_variants:
    - "Сервис читает {{entity}} по схеме cache-aside с кешем в {{store}}. Расположите шаги чтения при промахе кеша в правильном порядке."
    - "Приложение читает {{entity}} по паттерну cache-aside ({{store}}, TTL {{ttl}} с). Ключа в кеше нет. В каком порядке выполняются шаги?"
    - "Расположите по порядку шаги, которые выполняет приложение, читающее {{entity}} через cache-aside с {{store}}, когда значения в кеше ещё нет."
  order_items:
    - "Запросить ключ в {{store}}"
    - "Получить промах: значения в кеше нет"
    - "Прочитать {{entity}} из основной базы данных"
    - "Записать значение в {{store}} с TTL {{ttl}} с"
    - "Вернуть {{entity}} клиенту"

- id: be.arch.circuit_breaker
  specializations: [backend]
  topic: architecture
  skills: [microservices, system_design]
  kind: single_choice
  irt: {a: 1.2, b: 0.3}
  params:
    dep: {choice: [сервис рекомендаций, платёжный шлюз, сервис геокодинга, внешний API курсов валют, сервис скоринга, поставщик SMS, сервис расчёта доставки, антифрод-сервис]}
  stem_variants:
    - >-
      {{dep}} начал отвечать по таймауту, и потоки вызывающего сервиса копятся в ожидании. Нужно, чтобы после серии
      ошибок вызовы сразу завершались ошибкой, не нагружая зависимость, а через паузу пробные запросы проверяли её
      восстановление. Какой паттерн это описывает?
    - >-
      Зависимость ({{dep}}) периодически «ложится». Требование: после N ошибок подряд перестать её вызывать и сразу
      возвращать ошибку или запасной ответ, а через некоторое время пропустить пробный запрос и, если он успешен, вернуть
      нормальный режим. Как называется этот паттерн?
  options:
    correct: ["Circuit Breaker"]
    wrong: ["Retry с экспоненциальной задержкой", "Saga", "Strangler Fig", "Sidecar", "CQRS", "Bulkhead", "Rate Limiter"]

- id: be.arch.cap_partition
  specializations: [backend]
  topic: architecture
  skills: [system_design]
  kind: single_choice
  irt: {a: 1.1, b: 0.5}
  params:
    store: {choice: [распределённого хранилища конфигураций, кластера баз данных, распределённого кеша, системы учёта остатков, сервиса блокировок, хранилища балансов, реестра сервисов, кластера etcd]}
  stem_variants:
    - >-
      Во время сетевого разделения узлы {{store}} перестали видеть друг друга. Система настроена всегда возвращать
      только согласованные (линеаризуемые) данные. Что ей приходится делать согласно теореме CAP?
    - >-
      Узлы {{store}} оказались в разных частях разделённой сети. Требование — никогда не отдавать устаревшие данные
      (линеаризуемость). Чем, по теореме CAP, придётся пожертвовать на время разделения?
    - >-
      Для {{store}} выбрана линеаризуемость (CP-система). Произошло сетевое разделение. Как она поведёт себя по теореме CAP?
  options:
    correct:
      - "Отказывать в части запросов, жертвуя доступностью, пока разделение не устранено"
      - "Узлы без связи с большинством перестанут отвечать (или вернут ошибку): доступность приносится в жертву согласованности"
    wrong:
      - "Отвечать на все запросы актуальными данными на всех узлах"
      - "Перейти на синхронную репликацию и сохранить и согласованность, и доступность"
      - "Ничего: теорема CAP касается только однонодовых СУБД"
      - "Отвечать на все запросы, жертвуя согласованностью"
      - "Принимать записи на всех узлах и при этом гарантировать, что любое чтение видит последнюю запись"
      - "Отвечать из локального кеша каждого узла, сохраняя линеаризуемость"

- id: be.arch.kafka_ordering
  specializations: [backend]
  topic: architecture
  skills: [kafka, event_driven]
  kind: single_choice
  irt: {a: 1.2, b: 0.7}
  params:
    entity: {choice: [order, account, user, shipment, invoice, ticket]}
    parts: {choice: [6, 12, 16, 24, 32, 48]}
  stem_variants:
    - >-
      События по каждому {{entity}} (создан → изменён → закрыт) публикуются в топик Kafka с {{parts}} партициями,
      и потребитель должен обрабатывать их в порядке появления для одного {{entity}}. Как этого добиться?
    - >-
      Топик Kafka с {{parts}} партициями, несколько потребителей в одной группе. События одного {{entity}} должны
      обрабатываться строго в том порядке, в каком их опубликовали. Что сделать продюсеру?
  options:
    correct: ["Использовать {{entity}}_id как ключ сообщения: сообщения с одинаковым ключом попадают в одну партицию"]
    wrong:
      - "Ничего не делать: Kafka гарантирует порядок в пределах всего топика"
      - "Создать отдельную consumer group для каждого {{entity}}"
      - "Увеличить число партиций до числа потребителей"
      - "Отправлять сообщения без ключа, чтобы продюсер распределял их равномерно"
      - "Генерировать случайный ключ для каждого сообщения"
      - "Добавить в сообщение время отправки — Kafka упорядочит партиции по нему"

- id: be.arch.saga
  specializations: [backend]
  topic: architecture
  skills: [microservices, ddd]
  kind: single_choice
  irt: {a: 1.2, b: 0.9}
  params:
    a: {choice: [заказов, бронирований, подписок]}
    b: {choice: [платежей, биллинга, лояльности]}
    c: {choice: [склада, доставки, уведомлений]}
  stem: >-
    Бизнес-операция затрагивает сервисы {{a}}, {{b}} и {{c}}, у каждого своя база данных. Нужна согласованность
    без двухфазного коммита и долгих распределённых блокировок. Какой подход используют?
  options:
    correct: ["Сагу: цепочку локальных транзакций, где на сбой шага выполняются компенсирующие действия"]
    wrong:
      - "CQRS: разделить модели чтения и записи"
      - "Circuit Breaker между сервисами"
      - "API Gateway, который объединит вызовы в одну транзакцию"
      - "Шардирование баз данных по идентификатору клиента"

- id: be.arch.transactional_outbox
  specializations: [backend]
  topic: architecture
  skills: [microservices, event_driven, kafka]
  kind: single_choice
  irt: {a: 1.3, b: 1.1}
  params:
    entity: {choice: [заказ, платёж, пользователя, заявку]}
    event: {choice: [OrderCreated, PaymentCaptured, UserRegistered, ApplicationSubmitted]}
    broker: {choice: [Kafka, RabbitMQ]}
  stem: >-
    Сервис сохраняет {{entity}} в PostgreSQL и после COMMIT публикует событие {{event}} в {{broker}}. Иногда процесс
    падает между коммитом и публикацией, и событие теряется. Какой паттерн надёжно решает проблему?
  options:
    correct: ["Transactional Outbox: записать событие в таблицу outbox в той же транзакции и публиковать её отдельным процессом"]
    wrong:
      - "Публиковать событие до COMMIT транзакции"
      - "Повторять публикацию в том же обработчике запроса, пока она не пройдёт"
      - "Circuit Breaker вокруг клиента {{broker}}"
      - "Включить подтверждения (acks) от {{broker}} — этого достаточно"

- id: be.arch.cache_stampede
  specializations: [backend]
  topic: architecture
  skills: [caching, system_design]
  kind: multi_choice
  irt: {a: 1.2, b: 1.3}
  n_options: 5
  params:
    key: {choice: ["главная страница каталога", "курсы валют", "топ-100 товаров", "настройки тарифов"]}
    rps: {int: [2000, 20000], step: 1000}
  stem: >-
    Ключ кеша «{{key}}» читают {{rps}} раз в секунду. Когда у него истекает TTL, все запросы одновременно идут
    в базу данных, и она перегружается (cache stampede). Какие меры помогают?
  options:
    correct:
      - "Single-flight / блокировка на пересчёт: значение пересчитывает один запрос, остальные ждут или получают старое"
      - "Обновлять значение заранее, до истечения TTL (фоновое или вероятностное раннее обновление)"
      - "Отдавать устаревшее значение, пока идёт пересчёт (stale-while-revalidate)"
      - "Случайный разброс TTL (jitter), чтобы связанные ключи не истекали одновременно"
    wrong:
      - "Уменьшить TTL ключа в несколько раз"
      - "Сбрасывать весь кеш при каждом изменении данных"
      - "Добавить экземпляров приложения"
      - "Увеличить объём памяти сервера кеша"

- id: be.arch.design_notifications
  specializations: [backend]
  topic: architecture
  skills: [system_design, microservices, event_driven]
  kind: open_approach
  irt: {a: 1.0, b: 1.3}
  time_limit_sec: 600
  params:
    volume: {choice: ["1 млн", "5 млн", "20 млн"]}
    channels: {choice: ["email и push", "SMS, email и push", "push и Telegram"]}
  stem: >-
    Нужно спроектировать сервис уведомлений: {{volume}} сообщений в сутки по каналам {{channels}}, внешние провайдеры
    иногда недоступны, пользователь не должен получить одно уведомление дважды. Опишите архитектуру и ключевые решения.
  rubric:
    - Асинхронная обработка через очередь или брокер с отделением приёма запросов от отправки
    - Повторы с экспоненциальной задержкой и dead letter queue для недоставляемых сообщений
    - Защита от дублей (ключ идемпотентности или дедупликация) с учётом семантики at-least-once
    - Изоляция каналов и провайдеров (отдельные очереди или воркеры, rate limit провайдера, circuit breaker)
    - Учёт пользовательских настроек и тихих часов, статусы доставки и наблюдаемость (метрики, логи)

- id: be.arch.cache_hit_ratio
  specializations: [backend]
  topic: architecture
  skills: [caching]
  kind: numeric
  irt: {a: 1.0, b: -1.2}
  params:
    hits: {int: [1000, 9500], step: 100}
    misses: {int: [100, 3000], step: 100}
    store: {choice: [Redis, Memcached, локального кеша, CDN]}
  stem_variants:
    - "За час кеш ({{store}}) обслужил {{hits}} обращений из кеша (попаданий) и {{misses}} промахов. Какова доля попаданий (hit ratio) в процентах? Округлите до целого."
    - "Метрики {{store}}: попаданий — {{hits}}, промахов — {{misses}}. Посчитайте hit ratio в процентах, округлив до целого."
  answer:
    # hit ratio = попадания / все обращения
    expr: "round(100 * {{hits}} / ({{hits}} + {{misses}}))"
    tolerance: 1

- id: be.arch.quorum_read
  specializations: [backend]
  topic: architecture
  skills: [system_design]
  kind: numeric
  irt: {a: 1.2, b: 1.5}
  time_limit_sec: 120
  params:
    n: {choice: [3, 5, 6, 7, 9, 11]}
    w: {int: [1, 3]}
    store: {choice: [Cassandra, ScyllaDB, Riak, Voldemort]}
  stem_variants:
    - >-
      В leaderless-хранилище ({{store}}) каждый ключ хранится на N = {{n}} репликах, запись считается успешной после
      подтверждения от W = {{w|реплики|реплик|реплик}}. Какое минимальное число реплик R нужно опрашивать при чтении, чтобы любое чтение
      гарантированно застало хотя бы одну реплику с последней успешной записью?
    - >-
      Коэффициент репликации N = {{n}}, для успешной записи нужно подтверждений: W = {{w}} ({{store}}, без лидера). Сколько
      реплик минимум должно ответить на чтение, чтобы множества реплик чтения и записи всегда пересекались?
  answer:
    # кворумы пересекаются при R + W > N
    expr: "{{n}} - {{w}} + 1"
    tolerance: 0

- id: be.arch.kafka_at_least_once
  specializations: [backend]
  topic: architecture
  skills: [kafka, event_driven, microservices]
  kind: multi_choice
  irt: {a: 1.3, b: 1.5}
  n_options: 5
  params:
    event: {choice: [PaymentCaptured, OrderPlaced, UserRegistered, RefundApproved, ShipmentDelivered]}
    effect: {choice: [отправляет письмо клиенту, начисляет бонусы, вызывает API партнёра, списывает деньги через шлюз]}
  stem_variants:
    - >-
      Потребитель Kafka читает события {{event}}, на каждое {{effect}}, а offset коммитит вручную после обработки
      (enable.auto.commit=false). Какие утверждения верны?
    - >-
      Обработчик событий {{event}} {{effect}} и только затем фиксирует offset в Kafka. Какие утверждения о гарантиях
      доставки и обработке верны?
  options:
    correct:
      - "Если потребитель упадёт после обработки, но до коммита offset, сообщение будет обработано повторно"
      - "Обработчик должен быть идемпотентным или отсеивать дубли по идентификатору события"
      - "Если коммитить offset до обработки, при падении сообщение может остаться необработанным (at-most-once)"
    wrong:
      - "Коммит offset после обработки гарантирует, что побочный эффект во внешней системе выполнится ровно один раз"
      - "Транзакции Kafka гарантируют ровно однократный вызов внешнего API или отправку письма"
      - "Повторная доставка возможна только при отказе брокера, но не при падении потребителя"
      - "Увеличение числа партиций исключает повторную обработку"

# --- Senior: гонки кеша и семантика доставки ---

- id: be.arch.cache_aside_race
  specializations: [backend]
  topic: architecture
  skills: [caching, redis, concurrency]
  kind: ordering
  irt: {a: 1.4, b: 1.6}
  time_limit_sec: 150
  params:
    key: {choice: ["price:42", "user:17", "stock:9001", "product:77", "tariff:3", "profile:512"]}
    old: {int: [100, 499]}
    new: {int: [500, 999]}
  stem_variants:
    - >-
      Cache-aside: читатель при промахе читает значение из БД и кладёт его в кеш без TTL; писатель сначала
      обновляет БД, затем удаляет ключ из кеша. Читатель и писатель работают с ключом {{key}} одновременно.
      Расположите шаги в порядке, при котором в кеше надолго останется старое значение {{old}}, хотя в БД уже
      {{new}}.
    - >-
      Ключ {{key}} кешируется по схеме cache-aside (без TTL): чтение — «промах → SELECT → SET», запись — «UPDATE в
      БД → DELETE из кеша». Упорядочьте шаги параллельных читателя и писателя так, чтобы кеш продолжил отдавать
      {{old}} после того, как в БД записано {{new}}.
  order_items:
    - "Читатель: промах кеша по {{key}}"
    - "Читатель: SELECT из БД — получает {{old}}"
    - "Писатель: UPDATE в БД — теперь {{new}}"
    - "Писатель: DELETE {{key}} из кеша"
    - "Читатель: SET {{key}} = {{old}} в кеш"

- id: be.arch.effectively_once
  specializations: [backend]
  topic: architecture
  skills: [kafka, event_driven, postgresql]
  kind: multi_choice
  irt: {a: 1.4, b: 1.7}
  time_limit_sec: 120
  n_options: 5
  params:
    topic: {choice: [payments, orders, shipments, bonus-accruals, invoices]}
  stem_variants:
    - >-
      Консьюмер Kafka читает топик {{topic}} и записывает результат обработки в PostgreSQL. Консьюмер может
      упасть в любой момент, группа ребалансируется. Какие решения дают эффект «ровно один раз» для результата в
      PostgreSQL?
    - >-
      Сервис потребляет {{topic}} из Kafka и пишет итог в PostgreSQL. Нужно, чтобы при падениях и
      ребалансировках каждое событие отразилось в БД ровно один раз. Что из перечисленного это обеспечивает?
  options:
    correct:
      - "Хранить офсеты в PostgreSQL и фиксировать их в одной транзакции с результатом; после назначения партиции продолжать с сохранённого офсета"
      - "Делать запись идемпотентной (upsert по уникальному event_id) и коммитить офсет в Kafka только после записи"
      - "Вставлять event_id в таблицу обработанных событий с уникальным ограничением в той же транзакции, что и результат"
    wrong:
      - "Включить enable.idempotence=true у продюсера"
      - "Выставить acks=all и min.insync.replicas=2"
      - "Коммитить офсет до обработки сообщения"
      - "Использовать транзакции Kafka (transactional.id): они атомарно охватывают и запись в PostgreSQL"
      - "Включить isolation.level=read_committed у консьюмера"
