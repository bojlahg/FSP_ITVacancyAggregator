      - "Столбец ссылается на строку другой таблицы"
      - "Значения нельзя изменить после вставки"
      - "Значения могут повторяться, но не могут быть NULL"

- id: be.db.foreign_key
  specializations: [backend]
  topic: databases
  skills: [sql]
  kind: single_choice
  irt: {a: 1.0, b: -1.3}
  params:
    parent: {choice: [customer, user, author, project, department, supplier]}
    child: {choice: [orders, payments, tasks, documents, reviews, contracts]}
    id: {int: [100, 9999]}
  stem_variants:
    - >-
      Столбец {{child}}.{{parent}}_id объявлен как FOREIGN KEY REFERENCES {{parent}}s(id). Выполняется INSERT в {{child}}
      с {{parent}}_id = {{id}}, но строки с id = {{id}} в {{parent}}s нет. Что произойдёт?
    - >-
      В таблице {{child}} есть внешний ключ {{parent}}_id → {{parent}}s(id). Приложение вставляет строку в {{child}},
      указывая {{parent}}_id = {{id}}, которого в {{parent}}s не существует. Каков результат?
  options:
    correct: ["INSERT завершится ошибкой нарушения внешнего ключа, строка не будет вставлена"]
    wrong:
      - "Строка вставится, а {{parent}}_id будет заменён на NULL"
      - "СУБД автоматически создаст строку в {{parent}}s с id = {{id}}"
      - "Строка вставится, но не будет видна в SELECT, пока не появится {{parent}}"
      - "Строка вставится, ошибка возникнет только при JOIN с {{parent}}s"
      - "Строка вставится, а в журнал СУБД запишется предупреждение"

- id: be.db.write_skew_serializable
  specializations: [backend]
  topic: databases
  skills: [sql, postgresql, concurrency]
  kind: single_choice
  irt: {a: 1.3, b: 1.6}
  time_limit_sec: 150
  params:
    shift: {choice: [ночную, субботнюю, праздничную, утреннюю]}
    min: {choice: [1, 2]}
    room: {choice: [«Альфа», «Бета», «Гамма», 404, 512]}
    hour: {int: [9, 18]}
  stem_variants:
    - >-
      В PostgreSQL две транзакции на уровне REPEATABLE READ одновременно проверяют, что на {{shift}} смену записано больше
      {{min}} дежурных (SELECT count(*) …), видят достаточное число, и каждая снимает с дежурства своего, другого врача
      (UPDATE разных строк). Обе фиксируются, и дежурных стало меньше {{min}}. Какое утверждение верно?
    - >-
      Две транзакции REPEATABLE READ в PostgreSQL одновременно проверяют, что переговорная {{room}} свободна на {{hour}}:00
      (SELECT … WHERE room = … AND hour = {{hour}} возвращает 0 строк), и каждая вставляет свою бронь. Обе фиксируются —
      получилось двойное бронирование. Какое утверждение верно?
  options:
    correct:
      - "Это аномалия write skew: снимок данных (snapshot isolation) её не предотвращает; на SERIALIZABLE одна из транзакций получит ошибку сериализации (SQLSTATE 40001), и её нужно повторить"
    wrong:
      - "Это грязное чтение; его устраняет переход на READ COMMITTED"
      - "Так быть не может: на REPEATABLE READ PostgreSQL выполняет параллельные транзакции так, будто они шли последовательно"
      - "Это неповторяющееся чтение; достаточно повторить SELECT перед изменением в той же транзакции"
      - "На SERIALIZABLE PostgreSQL заблокирует всю таблицу до конца первой транзакции, поэтому вторая просто подождёт и повтор не нужен"
      - "Это потерянное обновление; его устраняет переход на READ COMMITTED, где UPDATE видит свежие данные"

- id: be.db.skip_locked_queue
  specializations: [backend]
  topic: databases
  skills: [sql, postgresql, concurrency]
  kind: single_choice
  irt: {a: 1.2, b: 1.4}
  params:
    table: {choice: [jobs, tasks, outbox, emails_queue, webhooks, exports]}
    status: {choice: [pending, new, queued]}
    batch: {choice: [1, 10, 50, 100]}
    workers: {int: [4, 32], step: 4}
  stem_variants:
    - >-
      Воркеры ({{workers}} шт.) забирают задачи из таблицы {{table}} PostgreSQL запросом SELECT … WHERE status = '{{status}}'
      ORDER BY id LIMIT {{batch}} FOR UPDATE внутри транзакции. Воркеры фактически ждут друг друга, и пропускная способность
      не растёт с их числом. Что исправит проблему, сохранив гарантию, что задачу обрабатывает только один воркер?
    - >-
      Очередь задач реализована таблицей {{table}}: каждый из {{workers}} воркеров выполняет SELECT … WHERE status = '{{status}}'
      ORDER BY id LIMIT {{batch}} FOR UPDATE. Все воркеры блокируются на одних и тех же первых строках. Как изменить запрос?
  options:
    correct: ["Добавить SKIP LOCKED: воркер пропускает строки, заблокированные другими, и берёт следующие свободные"]
    wrong:
      - "Заменить FOR UPDATE на FOR SHARE"
      - "Добавить NOWAIT: воркер не будет ждать и сразу возьмёт следующие строки"
      - "Убрать FOR UPDATE и полагаться на уровень изоляции READ COMMITTED"
      - "Повысить уровень изоляции до SERIALIZABLE"
      - "Убрать ORDER BY, чтобы каждый воркер получал случайные строки, и оставить FOR UPDATE"
