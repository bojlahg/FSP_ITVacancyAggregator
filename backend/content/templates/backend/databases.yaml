- id: be.db.composite_index
  specializations: [backend]
  topic: databases
  skills: [sql, postgresql]
  kind: single_choice
  irt: {a: 1.3, b: 0.3}
  params:
    table: {choice: [orders, payments, events, shipments]}
    col_a: {choice: [customer_id, account_id, user_id]}
    col_b: {choice: [created_at, updated_at, paid_at]}
  stem_variants:
    - "Частый запрос: SELECT * FROM {{table}} WHERE {{col_a}} = $1 ORDER BY {{col_b}} DESC LIMIT 20. Какой B-tree индекс в PostgreSQL лучше всего его ускорит?"
    - "Нужно быстро получать 20 последних по {{col_b}} записей {{table}} для конкретного {{col_a}}. Какой B-tree индекс создать в PostgreSQL?"
  options:
    correct: ["Составной индекс ({{col_a}}, {{col_b}})"]
    wrong:
      - "Составной индекс ({{col_b}}, {{col_a}})"
      - "Два отдельных индекса: по {{col_a}} и по {{col_b}}"
      - "Индекс только по {{col_b}}"
      - "Индекс только по первичному ключу {{table}}.id"

- id: be.db.index_unusable
  specializations: [backend]
  topic: databases
  skills: [sql, postgresql]
  kind: multi_choice
  irt: {a: 1.2, b: 0.5}
  n_options: 5
  params:
    col: {choice: [email, login, username]}
    table: {choice: [users, accounts, members]}
  stem: >-
    В PostgreSQL на {{table}}.{{col}} (тип text) есть обычный B-tree индекс по самому столбцу. Для каких условий
    WHERE этот индекс не поможет найти строки, и понадобится индекс по выражению или другой тип индекса?
  options:
    correct:
      - "WHERE lower({{col}}) = 'ivan@mail.ru'"
      - "WHERE {{col}} LIKE '%@mail.ru'"
      - "WHERE coalesce({{col}}, '') = 'ivan@mail.ru'"
    wrong:
      - "WHERE {{col}} = 'ivan@mail.ru'"
      - "WHERE {{col}} IN ('ivan@mail.ru', 'olga@mail.ru')"
      - "WHERE {{col}} IS NULL"
      - "WHERE {{col}} > 'm' AND {{col}} < 'n'"

- id: be.db.replica_lag
  specializations: [backend]
  topic: databases
  skills: [sql, postgresql, system_design]
  kind: single_choice
  irt: {a: 1.1, b: 0.6}
  params:
    entity: {choice: [комментарий, заказ, аватар, адрес доставки, настройки профиля, отзыв о товаре, черновик статьи, номер телефона]}
  stem_variants:
    - >-
      Запись идёт в primary, чтение — с асинхронной реплики. Пользователь сохраняет {{entity}}, страница
      перезагружается, и изменения иногда не видны несколько сотен миллисекунд. В чём причина и типичное решение?
    - >-
      Сервис пишет в primary PostgreSQL, а все SELECT отправляет на асинхронную реплику. Сразу после сохранения
      пользователь иногда видит старый {{entity}}, через секунду — новый. Что происходит и как это исправить?
    - >-
      После перехода на чтение с асинхронных реплик пользователи жалуются: «сохранил {{entity}}, а на следующей
      странице всё по-старому». Через мгновение данные появляются. Какое объяснение и решение верны?
  options:
    correct:
      - "Реплика отстаёт от primary; недавно изменённые пользователем данные читать с primary (read-your-writes)"
      - "Асинхронная реплика применяет изменения с задержкой; после записи читать данные этого пользователя с primary (согласованность read-your-writes)"
    wrong:
      - "Транзакция не закоммичена, пока реплика не подтвердит запись; нужно увеличить таймаут коммита"
      - "Уровень изоляции READ COMMITTED на реплике скрывает чужие коммиты; нужно поднять его до SERIALIZABLE"
      - "Реплика применяет только INSERT, а UPDATE — нет; нужно перейти на логическую репликацию"
      - "Реплика кеширует результаты SELECT; нужно отключить кеш запросов на реплике"
      - "Пул соединений возвращает результат предыдущего запроса; нужно уменьшить размер пула"

- id: be.db.isolation_level
  specializations: [backend]
  topic: databases
  skills: [sql, postgresql]
  kind: single_choice
  irt: {a: 1.2, b: 0.7}
  params:
    entity: {choice: [остаток на счёте, цену товара, статус заказа, лимит кредита, количество на складе, рейтинг продавца, курс валюты, тариф клиента]}
  stem_variants:
    - >-
      Транзакция дважды читает {{entity}}, а между этими чтениями другая транзакция изменяет значение и делает COMMIT.
      Какой минимальный уровень изоляции по стандарту SQL гарантирует, что оба чтения вернут одно и то же
      (нет неповторяющегося чтения)?
    - >-
      Отчёт в одной транзакции читает {{entity}} в начале и в конце. Параллельная транзакция успевает изменить
      эту строку и зафиксироваться. Какой самый слабый уровень изоляции стандарта SQL исключает такое
      неповторяющееся чтение?
    - >-
      Нужно, чтобы повторное чтение уже прочитанной строки ({{entity}}) внутри транзакции не видело чужих
      зафиксированных изменений. Какой минимальный уровень изоляции по стандарту SQL это гарантирует?
  options:
    correct: ["REPEATABLE READ"]
    wrong:
      - "READ COMMITTED"
      - "READ UNCOMMITTED"
      - "Любой уровень: внутри одной транзакции повторные чтения всегда согласованы"
      - "SERIALIZABLE — более слабые уровни этого не гарантируют"
      - "Ни один: нужна явная блокировка LOCK TABLE"

- id: be.db.deadlock_fix
  specializations: [backend]
  topic: databases
  skills: [sql, postgresql, concurrency]
  kind: single_choice
  irt: {a: 1.2, b: 1.0}
  params:
    table: {choice: [accounts, wallets, balances]}
    a: {int: [10, 49]}
    b: {int: [50, 99]}
  stem: >-
    Две транзакции переводов: первая делает UPDATE {{table}} для id={{a}}, затем для id={{b}}; вторая —
    сначала для id={{b}}, затем для id={{a}}. Под нагрузкой PostgreSQL периодически сообщает «deadlock
    detected». Какое изменение устраняет причину?
  options:
    correct:
      - "Во всех транзакциях блокировать строки в одном порядке, например по возрастанию id"
    wrong:
      - "Повысить уровень изоляции до SERIALIZABLE"
      - "Увеличить deadlock_timeout, чтобы транзакции дольше ждали друг друга"
      - "Увеличить размер пула соединений к базе"
      - "Делать COMMIT после каждого UPDATE внутри одного перевода"

- id: be.db.mvcc_bloat
  specializations: [backend]
  topic: databases
  skills: [postgresql]
  kind: multi_choice
  irt: {a: 1.3, b: 1.3}
  n_options: 5
  params:
    table: {choice: [sessions, job_queue, counters, carts]}
  stem: "Таблица {{table}} в PostgreSQL часто обновляется и сильно разрослась. Какие утверждения верны?"
  options:
    correct:
      - "UPDATE создаёт новую версию строки, а старая становится «мёртвой» до очистки"
      - "Долго открытая транзакция мешает VACUUM удалить мёртвые версии строк"
      - "Обычный VACUUM (без FULL) не блокирует чтение и запись таблицы"
    wrong:
      - "UPDATE изменяет строку на месте, поэтому от обновлений таблица расти не может"
      - "Мёртвые версии строк удаляются сразу при COMMIT"
      - "VACUUM FULL перестраивает таблицу без блокировки записи"
      - "Обычный VACUUM всегда возвращает освобождённое место операционной системе"

- id: be.db.slow_query_investigation
  specializations: [backend]
  topic: databases
  skills: [sql, postgresql]
  kind: open_approach
  irt: {a: 1.0, b: 0.9}
  time_limit_sec: 600
  params:
    endpoint: {choice: ["/orders", "/reports/daily", "/catalog/search", "/users/{id}/history"]}
    before: {int: [40, 120], step: 20}
    after: {int: [2, 9]}
  stem: >-
    После релиза ответ эндпоинта {{endpoint}} вырос с {{before}} мс до {{after}} с, нагрузка не менялась.
    Подозрение на базу данных PostgreSQL. Опишите по шагам, как найдёте причину и как проверите, что исправление помогло.
  rubric:
    - Находит медленные запросы по данным (pg_stat_statements, лог медленных запросов, трейсинг), а не наугад
    - Смотрит план через EXPLAIN (ANALYZE, BUFFERS) и объясняет, что в нём искать (Seq Scan, неверные оценки строк)
    - Проверяет, что изменилось в релизе (новый запрос, N+1, изменённый фильтр, миграция, удалённый индекс)
    - Предлагает конкретное исправление (индекс, переписать запрос, обновить статистику ANALYZE) с учётом стоимости записи
    - Проверяет эффект измерением до и после на сопоставимых данных и нагрузке

- id: be.db.partial_index
  specializations: [backend]
  topic: databases
  skills: [sql, postgresql]
  kind: single_choice
  status: pilot
  irt: {a: 1.0, b: 0.9}
  params:
    table: {choice: [tasks, jobs, tickets, orders]}
    status: {choice: [pending, new, open]}
    share: {choice: ["0,5", "1", "2"]}
  stem: >-
    В таблице {{table}} 50 млн строк, из них только {{share}}% имеют status = '{{status}}'. Воркеры постоянно
    выполняют SELECT … WHERE status = '{{status}}' ORDER BY created_at LIMIT 100. Какой индекс в PostgreSQL
    подходит лучше всего?
  options:
    correct: ["CREATE INDEX ON {{table}} (created_at) WHERE status = '{{status}}'"]
    wrong:
      - "CREATE INDEX ON {{table}} (status)"
      - "CREATE INDEX ON {{table}} USING hash (status)"
      - "CREATE INDEX ON {{table}} (created_at, status)"
      - "Индекс не нужен: PostgreSQL кеширует результаты частых запросов"

- id: be.db.primary_key
  specializations: [backend]
  topic: databases
  skills: [sql]
  kind: single_choice
  irt: {a: 1.0, b: -1.6}
  params:
    table: {choice: [users, orders, products, invoices, employees, tickets, courses, warehouses]}
    col: {choice: [id, code, uuid]}
  stem_variants:
    - "Столбец {{col}} таблицы {{table}} объявлен как PRIMARY KEY. Что гарантирует это ограничение?"
    - "При создании таблицы {{table}} указано {{col}} PRIMARY KEY. Какое свойство значений {{col}} обеспечивает СУБД?"
    - "Какое утверждение о столбце {{table}}.{{col}}, объявленном первичным ключом (PRIMARY KEY), верно?"
  options:
    correct: ["Значения уникальны в таблице и не могут быть NULL"]
    wrong:
      - "Значения уникальны, но NULL допускается"
