# Backend · базы данных (§10.2). Формат: content/templates/README.md

- id: be.db.atomicity
  specializations: [backend]
  topic: databases
  skills: [sql]
  kind: single_choice
  irt: {a: 1.0, b: -1.4}
  params:
    amount: {int: [500, 50000], step: 500}
    source: {choice: [расчётного счёта, кошелька, бонусного счёта, депозита]}
    target: {choice: [карту, счёт партнёра, счёт поставщика, кошелёк друга]}
  stem_variants:
    - "Перевод {{amount}} ₽ с {{source}} на {{target}}: списание и зачисление должны выполниться вместе или не выполниться вовсе. Какое свойство ACID это гарантирует?"
    - "Если сервер упадёт между списанием {{amount}} ₽ с {{source}} и зачислением на {{target}}, не должно остаться «половины» перевода. Какое свойство транзакций ACID за это отвечает?"
  options:
    correct: ["Атомарность (Atomicity)"]
    wrong: ["Согласованность (Consistency)", "Изолированность (Isolation)", "Долговечность (Durability)"]

- id: be.db.where_vs_having
  specializations: [backend]
  topic: databases
  skills: [sql]
  kind: single_choice
  irt: {a: 1.1, b: -0.9}
  params:
    table: {choice: [orders, payments, invoices, shipments]}
    key: {choice: [customer_id, region_id, manager_id, store_id]}
    total: {int: [10000, 90000], step: 5000}
  stem: >-
    Нужно вывести {{key}}, у которых сумма amount в таблице {{table}} больше {{total}}:
    SELECT {{key}}, SUM(amount) FROM {{table}} GROUP BY {{key}} … Где правильно разместить условие
    SUM(amount) > {{total}}?
  options:
    correct: ["В HAVING после GROUP BY"]
    wrong:
      - "В WHERE перед GROUP BY"
      - "В ORDER BY"
      - "В условии ON соединения"
      - "В LIMIT"

- id: be.db.n_plus_one
  specializations: [backend]
  topic: databases
  skills: [sql, sqlalchemy, hibernate]
  kind: numeric
  irt: {a: 1.2, b: -0.7}
  params:
    n: {int: [15, 120], step: 5}
    parent: {choice: [заказов, статей, пользователей, проектов]}
    child: {choice: [позиции, комментарии, адреса, задачи]}
  stem: >-
    ORM загружает список из {{n}} {{parent}} одним запросом, а затем в цикле обращается к связанному
    полю «{{child}}» каждого элемента. Связь ленивая (lazy loading), кеша нет, у каждого элемента есть связанные
    записи. Сколько SQL-запросов будет выполнено всего?
  answer:
    # проблема N+1: один запрос списка + по одному на каждый элемент
    expr: "{{n}} + 1"
    tolerance: 0

