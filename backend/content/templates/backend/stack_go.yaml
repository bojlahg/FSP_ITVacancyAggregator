- id: be.go.nil_map_write
  specializations: [backend]
  topic: stack
  stack_module: go
  skills: [go]
  kind: single_choice
  irt: {a: 1.2, b: -0.3}
  params:
    m: {choice: [counts, cache, index, seen]}
    k: {choice: [alpha, user42, total, ru]}
    v: {int: [1, 99]}
  stem: "Что произойдёт при запуске программы?"
  code: |
    package main

    import "fmt"

    func main() {
    	var {{m}} map[string]int
    	fmt.Println({{m}}["{{k}}"])
    	{{m}}["{{k}}"] = {{v}}
    	fmt.Println({{m}}["{{k}}"])
    }
  code_language: go
  options:
    correct: ["Выведет 0, затем panic: assignment to entry in nil map"]
    wrong:
      - "Выведет 0, затем {{v}}"
      - "panic уже при первом чтении из nil map"
      - "Ошибка компиляции: map не инициализирована"
      - "Выведет <nil>, затем panic: assignment to entry in nil map"

