- id: be.go.context_cancel
  specializations: [backend]
  topic: stack
  stack_module: go
  skills: [go, concurrency]
  kind: single_choice
  irt: {a: 1.2, b: 1.0}
  params:
    ms: {choice: [100, 200, 250, 500, 800, 1000]}
    work: {choice: [запрос к базе, вызов внешнего API, обработку пачки сообщений, расчёт отчёта, чтение файла из S3, сжатие архива]}
  stem_variants:
    - >-
      Обработчик создаёт ctx, cancel := context.WithTimeout(parent, {{ms}}*time.Millisecond) и запускает горутину,
      которая выполняет {{work}}. Какое утверждение о таймауте верно?
    - >-
      Горутина выполняет {{work}} с контекстом, полученным через context.WithTimeout(parent, {{ms}}*time.Millisecond).
      Что произойдёт, когда таймаут истечёт?
  options:
    correct:
      - "По таймауту закрывается ctx.Done(), но горутина не останавливается сама: код должен проверять ctx.Done() или передавать ctx в вызовы"
      - "Контекст лишь сигнализирует об отмене через ctx.Done() и ctx.Err(); горутина завершится, только если её код (или вызываемые функции) учитывает ctx"
    wrong:
      - "По таймауту среда выполнения Go принудительно завершает горутину"
      - "Отмена дочернего контекста отменяет и родительский parent"
      - "Дочерний контекст может продлить дедлайн родителя, если его таймаут больше"
      - "После истечения таймаута ctx.Err() возвращает nil"
      - "По таймауту в горутине возникает panic, которую нужно перехватить через recover"
      - "После таймаута ctx.Done() так и остаётся открытым, а ctx.Err() сообщает об ошибке только при следующем вызове cancel()"

