- id: ds.py.scaler_on_test
  specializations: [data]
  topic: stack
  stack_module: python_ml
  skills: [scikit_learn, python]
  kind: single_choice
  irt: {a: 1.2, b: -0.6}
  params:
    scaler: {choice: [StandardScaler, MinMaxScaler, RobustScaler, MaxAbsScaler]}
    var: {choice: [scaler, prep, norm, sc, transformer]}
    model: {choice: [model, clf, reg, estimator]}
  stem_variants:
    - "Как правильно преобразовать тестовую выборку после такого кода?"
    - "Модель обучена на отмасштабированных данных. Какая строка корректно готовит X_test для предсказания?"
  code: |-
    {{var}} = {{scaler}}()
    X_train_s = {{var}}.fit_transform(X_train)
    {{model}}.fit(X_train_s, y_train)
  code_language: python
  options:
    correct: ["X_test_s = {{var}}.transform(X_test)"]
    wrong:
      - "X_test_s = {{var}}.fit_transform(X_test)"
      - "X_test_s = {{scaler}}().fit_transform(X_test)"
      - "X_test_s = {{var}}.fit(X_test).transform(X_train)"
      - "X_test_s = X_test: модель {{model}} уже обучена"
      - "X_test_s = {{var}}.fit(X_test).transform(X_test)"
      - "X_test_s = {{var}}.inverse_transform(X_test)"

