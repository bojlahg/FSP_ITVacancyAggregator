- id: ds.py.scaler_on_test
  specializations: [data]
  topic: stack
  stack_module: python_ml
  skills: [scikit_learn, python]
  kind: single_choice
  irt: {a: 1.2, b: -0.6}
  params:
    scaler: {choice: [StandardScaler, MinMaxScaler, RobustScaler]}
    var: {choice: [scaler, prep, norm]}
  stem: "Как правильно преобразовать тестовую выборку после такого кода?"
  code: |-
    {{var}} = {{scaler}}()
    X_train_s = {{var}}.fit_transform(X_train)
    model.fit(X_train_s, y_train)
  code_language: python
  options:
    correct: ["X_test_s = {{var}}.transform(X_test)"]
    wrong:
      - "X_test_s = {{var}}.fit_transform(X_test)"
      - "X_test_s = {{scaler}}().fit_transform(X_test)"
      - "X_test_s = {{var}}.fit(X_test).transform(X_train)"
      - "X_test_s = X_test: модель уже обучена"

