- id: ds.stat.skewed_center
  specializations: [data]
  topic: statistics
  skills: [statistics]
  kind: single_choice
  irt: {a: 1.0, b: -1.0}
  params:
    staff: {int: [50, 400], step: 10}
    what: {choice: [зарплат сотрудников, доходов клиентов банка, стоимости квартир в районе]}
  stem: "Распределение {{what}} ({{staff}} наблюдений) сильно скошено вправо: единичные значения в десятки раз превышают остальные. Какая мера лучше описывает типичное значение?"
  options:
    correct: ["Медиана"]
    wrong: ["Среднее арифметическое", "Размах", "Стандартное отклонение", "Максимум"]

- id: ds.stat.expected_value
  specializations: [data]
  topic: statistics
  skills: [statistics]
  kind: numeric
  irt: {a: 1.1, b: -0.8}
  params:
    p: {choice: [10, 20, 25, 40]}
    win: {int: [200, 2000], step: 100}
    loss: {int: [50, 500], step: 50}
  stem: >-
    Промоакция: с вероятностью {{p}}% клиент приносит компании {{win}} ₽ прибыли, иначе компания теряет {{loss}} ₽.
    Каково математическое ожидание прибыли на одного клиента в рублях? Отрицательное значение указывайте со
    знаком минус, округлите до сотых.
  answer:
    expr: "round({{p}} / 100 * {{win}} - (100 - {{p}}) / 100 * {{loss}}, 2)"
    tolerance: 0.01

