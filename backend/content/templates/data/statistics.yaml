- id: ds.stat.mean_shift
  specializations: [data]
  topic: statistics
  skills: [statistics]
  kind: single_choice
  irt: {a: 1.0, b: -1.4}
  params:
    what: {choice: [времени ответа сервиса, чека покупки, возраста клиентов, длительности звонка, оценки за тест, веса посылки]}
    m: {int: [20, 90]}
    s: {int: [3, 15]}
    c: {int: [5, 50], step: 5}
  stem_variants:
    - "Среднее {{what}} в выборке — {{m}}, стандартное отклонение — {{s}}. Ко всем значениям прибавили {{c}}. Как изменятся среднее и стандартное отклонение?"
    - "У выборки {{what}} среднее {{m}} и стандартное отклонение {{s}}. Каждое значение увеличили на одну и ту же величину {{c}}. Что произойдёт со средним и стандартным отклонением?"
  options:
    correct:
      - "Среднее увеличится на {{c}}, стандартное отклонение не изменится и останется {{s}}"
      - "Среднее станет на {{c}} больше, а стандартное отклонение останется равным {{s}}"
    wrong:
      - "Среднее и стандартное отклонение увеличатся на {{c}}"
      - "Среднее увеличится на {{c}}, стандартное отклонение — в {{c}} раз"
      - "Среднее не изменится, стандартное отклонение увеличится на {{c}}"
      - "Среднее увеличится на {{c}}, а стандартное отклонение уменьшится"
      - "Среднее и стандартное отклонение не изменятся"

