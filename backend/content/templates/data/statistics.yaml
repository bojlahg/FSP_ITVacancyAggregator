# --- Senior: ловушки экспериментов (b 1.4–1.8) ---

- id: ds.stat.peeking
  specializations: [data]
  topic: statistics
  skills: [ab_testing, statistics]
  kind: single_choice
  irt: {a: 1.4, b: 1.6}
  params:
    days: {int: [7, 21]}
    metric: {choice: [конверсию в покупку, средний чек, удержание на 7-й день, CTR баннера]}
  stem_variants:
    - "A/B-тест на {{metric}} запланирован с уровнем значимости 5%. Аналитик каждый из {{days}} дней смотрит p-value и останавливает тест в первый день, когда p < 0,05. Что происходит с вероятностью ложноположительного вывода, если на самом деле эффекта нет?"
    - "Команда проверяет {{metric}} в A/B-тесте при α = 0,05, но заглядывает в результат ежедневно {{days}} дней подряд и объявляет победу при первом p < 0,05. Как это влияет на долю ложных «побед» при отсутствии эффекта?"
  options:
    correct:
      - "Она становится заметно больше 5%: каждый промежуточный просмотр — ещё один шанс случайно получить p < 0,05"
      - "Растёт выше номинальных 5%, потому что остановка по первому значимому результату — это множественная проверка"
    wrong:
      - "Остаётся ровно 5%: уровень значимости фиксирован заранее"
      - "Уменьшается, потому что со временем данных становится больше"
      - "Становится 5% / {{days}}, так как проверок {{days}}"
      - "Не меняется, если в каждой группе больше тысячи пользователей"

- id: ds.stat.srm_chi2
  specializations: [data]
  topic: statistics
  skills: [ab_testing, statistics]
  kind: numeric
  irt: {a: 1.3, b: 1.7}
  time_limit_sec: 180
  params:
    a: {int: [9800, 10300], step: 10}
    b: {int: [9000, 9500], step: 10}
  stem_variants:
    - "В A/B-тесте трафик делился 50/50, но в контроль попало {{a}} пользователей, а в тест — {{b}}. Посчитайте статистику χ² для проверки sample ratio mismatch (без поправки Йейтса). Ответ округлите до десятых."
    - "Ожидалось равное деление пользователей между группами, фактически: контроль — {{a}}, тест — {{b}}. Чему равна статистика χ² критерия согласия с ожидаемым 50/50? Округлите до десятых."
  answer:
    expr: "round((({{a}} - ({{a}} + {{b}}) / 2) ** 2 + ({{b}} - ({{a}} + {{b}}) / 2) ** 2) / (({{a}} + {{b}}) / 2), 1)"
    tolerance: 0.1

- id: ds.stat.familywise
  specializations: [data]
  topic: statistics
  skills: [ab_testing, statistics]
  kind: numeric
  irt: {a: 1.3, b: 1.5}
  time_limit_sec: 150
  params:
    k: {int: [5, 30]}
    alpha: {choice: [5, 1]}
  stem_variants:
    - "В эксперименте проверяют {{k}} независимых метрик, каждую на уровне значимости {{alpha}}%. Эффекта нет ни по одной. С какой вероятностью хотя бы одна метрика окажется «значимой»? Ответ в процентах, округлите до целого."
    - "Аналитик смотрит {{k}} независимых срезов A/B-теста с уровнем значимости {{alpha}}% в каждом, при этом истинного эффекта нет. Какова вероятность получить хотя бы один ложноположительный срез? В процентах, до целого."
  answer:
    expr: "round((1 - (1 - {{alpha}} / 100) ** {{k}}) * 100)"
    tolerance: 1
