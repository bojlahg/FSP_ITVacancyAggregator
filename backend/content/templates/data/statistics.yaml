- id: ds.stat.standard_error
  specializations: [data]
  topic: statistics
  skills: [statistics]
  kind: numeric
  irt: {a: 1.2, b: -0.2}
  params:
    sigma: {int: [6, 60], step: 6}
    n: {choice: [16, 25, 36, 49, 64, 100, 144, 225, 400]}
    what: {choice: [времени сессии, суммы заказа, числа кликов, времени доставки]}
  stem_variants:
    - >-
      Стандартное отклонение {{what}} в генеральной совокупности σ = {{sigma}}. По случайной выборке из {{n}}
      наблюдений считают выборочное среднее. Чему равна его стандартная ошибка? Округлите до сотых.
    - >-
      Известно, что σ {{what}} равно {{sigma}}. Чему равна стандартная ошибка среднего, посчитанного по
      случайной выборке объёма {{n}}? Округлите до сотых.
  answer:
    expr: "round({{sigma}} / {{n}} ** 0.5, 2)"
    tolerance: 0.01

- id: ds.stat.p_value_meaning
  specializations: [data]
  topic: statistics
  skills: [statistics, ab_testing]
  kind: single_choice
  irt: {a: 1.3, b: 0.0}
  params:
    p: {choice: ["0.003", "0.01", "0.02", "0.03", "0.04", "0.012", "0.027", "0.045"]}
    test: {choice: [A/B-тест новой формы оплаты, сравнение среднего чека двух регионов, тест новой рекомендательной модели, A/B-тест нового онбординга, сравнение времени доставки двух складов, тест новой цены подписки]}
  stem_variants:
    - "{{test}} дал p-value = {{p}}. Какая интерпретация верна?"
    - "Результат: {{test}}, p-value = {{p}}. Что означает это число?"
  options:
    correct:
      - "Если нулевая гипотеза верна, результат такой же или более экстремальный получался бы с вероятностью {{p}}"
      - "Это вероятность получить такое же или более сильное отличие при условии, что на самом деле эффекта нет"
    wrong:
      - "Вероятность того, что нулевая гипотеза верна, равна {{p}}"
      - "С вероятностью 1 − {{p}} альтернативная гипотеза верна"
      - "Вероятность того, что наблюдаемый эффект возник случайно, равна {{p}}"
      - "Мощность теста равна 1 − {{p}}"
      - "Вероятность повторить этот результат в новом эксперименте равна 1 − {{p}}"
      - "Размер эффекта составляет {{p}} от среднего значения метрики"

- id: ds.stat.power_meaning
  specializations: [data]
  topic: statistics
  skills: [statistics, ab_testing]
  kind: single_choice
  irt: {a: 1.2, b: 0.2}
  params:
    power: {choice: [70, 75, 80, 85, 90, 95]}
    mde: {choice: [1, 2, 3, 5]}
    metric: {choice: [конверсию в покупку, средний чек, удержание на 7-й день, долю повторных заказов, выручку на пользователя]}
  stem_variants:
    - "A/B-тест на {{metric}} спланирован с мощностью {{power}}% для относительного эффекта {{mde}}% при α = 0.05. Что означает мощность {{power}}%?"
    - "Размер выборки теста на {{metric}} рассчитали так, чтобы мощность была {{power}}% для эффекта {{mde}}%. Как понимать эту мощность?"
  options:
    correct:
      - "Если истинный эффект равен {{mde}}%, тест отвергнет нулевую гипотезу с вероятностью {{power}}%"
      - "Вероятность обнаружить эффект размером {{mde}}%, если он действительно есть, равна {{power}}%"
    wrong:
      - "Если эффекта нет, тест ошибочно найдёт его с вероятностью {{power}}%"
      - "С вероятностью {{power}}% эффект размером {{mde}}% существует"
      - "Вероятность ошибки I рода равна {{power}}%"
      - "Тест обнаружит эффект с вероятностью {{power}}% при любом его размере"
      - "{{power}}% пользователей увидят эффект размером не меньше {{mde}}%"

- id: ds.stat.zero_correlation
  specializations: [data]
  topic: statistics
  skills: [statistics]
  kind: single_choice
  irt: {a: 1.2, b: 0.4}
  params:
    x: {choice: [температура воздуха, время суток, возраст клиента, скорость ветра]}
    y: {choice: [нагрузка на сервис, число заказов, расход энергии]}
    n: {int: [500, 5000], step: 500}
  stem: "По {{n}} наблюдениям коэффициент корреляции Пирсона между признаками «{{x}}» и «{{y}}» практически равен 0. Что можно утверждать?"
  options:
    correct:
      - "Линейной связи нет, но возможна сильная нелинейная зависимость (например, вида Y = X²)"
    wrong:
      - "Признаки статистически независимы"
      - "Признак «{{y}}» нельзя предсказать по признаку «{{x}}» никакой моделью"
      - "Коэффициент корреляции Спирмена тоже обязательно равен 0"
      - "Выборка слишком мала, чтобы оценить корреляцию"

- id: ds.stat.ci_sample_size
  specializations: [data]
  topic: statistics
  skills: [statistics, ab_testing]
  kind: numeric
  irt: {a: 1.2, b: 0.5}
  params:
    n0: {int: [100, 1200], step: 50}
    k: {choice: [2, 3, 4]}
    level: {choice: ["90", "95", "99"]}
    what: {choice: [среднего чека, времени сессии, времени ответа API, суммы платежа]}
  stem_variants:
    - >-
      {{level}}%-й доверительный интервал для {{what}}, построенный по {{n0}} наблюдениям, слишком широкий.
      Сколько наблюдений понадобится, чтобы ширина интервала стала равна 1/{{k}} от текущей при той же
      дисперсии? Отличием t- и z-квантилей пренебрегите.
    - >-
      По выборке из {{n0}} наблюдений построен {{level}}%-й доверительный интервал для {{what}}. Нужно сузить
      интервал в {{k}} раза при том же уровне доверия и той же дисперсии. Какой объём выборки нужен? Отличием
      t- и z-квантилей пренебрегите.
  answer:
    # ширина интервала ∝ 1/√n
    expr: "{{n0}} * {{k}} ** 2"
    tolerance: 0

- id: ds.stat.fwer
  specializations: [data]
  topic: statistics
  skills: [statistics, ab_testing]
  kind: numeric
  irt: {a: 1.2, b: 0.9}
  time_limit_sec: 150
  params:
    m: {int: [3, 20]}
    alpha: {choice: [0.05, 0.01, 0.1]}
    what: {choice: [метрик, сегментов пользователей, вариантов кнопки против контроля]}
  stem_variants:
    - >-
      В эксперименте независимо проверяется несколько {{what}} (всего {{m}}), каждая проверка на уровне
      значимости {{alpha}} без поправок. На самом деле эффекта нет нигде. С какой вероятностью хотя бы одна
      проверка окажется «значимой»? Ответ в процентах, округлите до десятых.
    - >-
      Аналитик проверяет {{m}} независимых гипотез (по числу {{what}}) на уровне α = {{alpha}} без поправки на
      множественные сравнения. Все нулевые гипотезы верны. Какова вероятность получить хотя бы один ложноположительный
      результат? Ответ в процентах, округлите до десятых.
  answer:
    expr: "round(100 * (1 - (1 - {{alpha}}) ** {{m}}), 1)"
    tolerance: 0.2

- id: ds.stat.bayes_test
  specializations: [data]
  topic: statistics
  skills: [statistics]
  kind: numeric
  irt: {a: 1.3, b: 1.1}
  time_limit_sec: 180
  params:
    prev: {choice: [0.5, 1, 2, 3, 5]}
    sens: {choice: [80, 90, 95, 99]}
    fpr: {choice: [1, 2, 5, 10]}
  stem_variants:
    - >-
      Заболеванием страдает {{prev}}% обследуемых. Тест выявляет болезнь у {{sens}}% больных и даёт
      ложноположительный результат у {{fpr}}% здоровых. Какова вероятность, что человек с положительным тестом
      действительно болен? Ответ в процентах, округлите до десятых.
    - >-
      Мошеннические операции составляют {{prev}}% всех платежей. Антифрод-правило срабатывает на {{sens}}%
      мошеннических операций и на {{fpr}}% честных. Какова вероятность, что операция, на которой правило
      сработало, действительно мошенническая? Ответ в процентах, округлите до десятых.
    - >-
      Брак составляет {{prev}}% деталей. Система контроля помечает {{sens}}% бракованных деталей и по ошибке
      {{fpr}}% годных. Какова вероятность, что помеченная деталь действительно бракованная? Ответ в процентах,
      округлите до десятых.
  answer:
    # формула Байеса: P(Б|+) = P(+|Б)P(Б) / (P(+|Б)P(Б) + P(+|З)P(З))
    expr: "round(100 * {{prev}} * {{sens}} / ({{prev}} * {{sens}} + (100 - {{prev}}) * {{fpr}}), 1)"
    tolerance: 0.2

