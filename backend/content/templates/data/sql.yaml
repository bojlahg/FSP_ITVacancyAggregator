- id: ds.sql.running_total_ties
  specializations: [data]
  topic: sql
  skills: [sql, sql_analytics, postgresql]
  kind: single_choice
  irt: {a: 1.2, b: 1.3}
  params:
    table: {choice: [payments, sales, deposits, orders, refunds]}
    day: {choice: [day, paid_on, sale_date, created_on, op_date]}
    amount: {choice: [amount, total, sum_rub]}
  stem_variants:
    - "Нарастающий итог считают так. У двух строк с одинаковым {{day}} в столбце running получилось одинаковое значение. Почему?"
    - "В результате этого запроса строки с равным {{day}} получают одно и то же значение running, хотя {{amount}} у них разный. В чём причина?"
  code: |-
    SELECT {{day}}, {{amount}},
           SUM({{amount}}) OVER (ORDER BY {{day}}) AS running
    FROM {{table}};
  code_language: sql
  options:
    correct:
      - "При ORDER BY без явной рамки используется RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW, и строки с равным {{day}} входят в рамку вместе"
      - "Рамка по умолчанию — RANGE, а не ROWS: все строки-«соседи» с тем же {{day}} считаются текущими и суммируются вместе"
    wrong:
      - "Оконная функция сначала схлопывает строки с равным {{day}}, как GROUP BY"
      - "По умолчанию рамка — ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW, а равные {{day}} сортируются случайно"
      - "Без PARTITION BY оконная SUM возвращает сумму по всей таблице {{table}}"
      - "Это ошибка данных: оконная функция не может вернуть одинаковые значения в разных строках"
      - "SUM в окне пропускает дубликаты {{day}}, как SUM(DISTINCT {{amount}})"

