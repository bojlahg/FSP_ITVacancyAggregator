- id: ds.sql.join_all_customers
  specializations: [data]
  topic: sql
  skills: [sql]
  kind: single_choice
  irt: {a: 1.0, b: -1.2}
  params:
    left: {choice: [customers, users, stores, drivers]}
    right: {choice: [orders, payments, deliveries]}
  stem: "Нужен отчёт по всем строкам {{left}} с числом связанных {{right}}, включая тех, у кого {{right}} нет совсем. Какое соединение использовать?"
  options:
    correct: ["{{left}} LEFT JOIN {{right}}"]
    wrong: ["{{left}} INNER JOIN {{right}}", "{{left}} RIGHT JOIN {{right}}", "{{left}} CROSS JOIN {{right}}", "{{right}} LEFT JOIN {{left}}"]

