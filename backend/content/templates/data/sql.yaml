- id: ds.sql.join_all_customers
  specializations: [data]
  topic: sql
  skills: [sql]
  kind: single_choice
  irt: {a: 1.0, b: -1.2}
  params:
    left: {choice: [customers, users, stores, drivers, couriers, sellers]}
    right: {choice: [orders, payments, deliveries, reviews, tickets]}
  stem_variants:
    - "Нужен отчёт по всем строкам {{left}} с числом связанных {{right}}, включая тех, у кого {{right}} нет совсем. Какое соединение использовать?"
    - "Отчёт должен вывести каждую запись из {{left}} и количество её {{right}}; записи без {{right}} должны попасть в отчёт с нулём. Какой JOIN нужен?"
    - "Аналитик соединил {{left}} и {{right}}, и из отчёта пропали {{left}} без {{right}}. Каким соединением сохранить все строки {{left}}?"
  options:
    correct: ["{{left}} LEFT JOIN {{right}}"]
    wrong:
      - "{{left}} INNER JOIN {{right}}"
      - "{{left}} RIGHT JOIN {{right}}"
      - "{{left}} CROSS JOIN {{right}}"
      - "{{right}} LEFT JOIN {{left}}"
      - "{{right}} INNER JOIN {{left}}"

