- id: ds.sql.running_total_ties
  specializations: [data]
  topic: sql
  skills: [sql, sql_analytics, postgresql]
  kind: single_choice
  irt: {a: 1.2, b: 1.3}
  params:
    table: {choice: [payments, sales, deposits]}
    day: {choice: [day, paid_on, sale_date]}
  stem: "Нарастающий итог считают так. У двух строк с одинаковым {{day}} в столбце running получилось одинаковое значение. Почему?"
  code: |-
    SELECT {{day}}, amount,
           SUM(amount) OVER (ORDER BY {{day}}) AS running
    FROM {{table}};
  code_language: sql
  options:
    correct:
      - "При ORDER BY без явной рамки используется RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW, и строки с равным {{day}} входят в рамку вместе"
    wrong:
      - "Оконная функция сначала схлопывает строки с равным {{day}}, как GROUP BY"
      - "По умолчанию рамка — ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW, а равные {{day}} сортируются случайно"
      - "Без PARTITION BY оконная SUM возвращает сумму по всей таблице"
      - "Это ошибка данных: оконная функция не может вернуть одинаковые значения в разных строках"
