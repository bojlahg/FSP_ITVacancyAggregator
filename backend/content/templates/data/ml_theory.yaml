- id: ds.ml.attention_quadratic
  specializations: [data]
  topic: ml_theory
  skills: [deep_learning, llm]
  kind: numeric
  irt: {a: 1.1, b: 0.9}
  params:
    n: {choice: [512, 1024, 2048, 4096, 8192, 16384]}
    k: {choice: [2, 3, 4, 6, 8]}
    heads: {choice: [8, 12, 16, 32]}
  stem_variants:
    - >-
      В стандартном (полном) self-attention трансформера длину входной последовательности увеличили в {{k|раз|раза|раз}}
      (исходная длина: {{n|токен|токена|токенов}}, {{heads|голова|головы|голов}}). Во сколько раз вырастет число попарных оценок внимания
      (элементов матрицы QKᵀ) в одной голове одного слоя?
    - >-
      Модель с полным self-attention ({{heads|голова|головы|голов}} в слое) обрабатывала контекст из {{n|токена|токенов|токенов}}. Контекст
      увеличили в {{k|раз|раза|раз}}. Во сколько раз вырастет размер матрицы весов внимания в одной голове?
  answer:
    expr: "{{k}} ** 2"
    tolerance: 0

