- id: ds.ml.preprocessing_leakage
  specializations: [data]
  topic: ml_theory
  skills: [machine_learning, scikit_learn]
  kind: single_choice
  irt: {a: 1.3, b: 0.4}
  params:
    prep: {choice: [StandardScaler, MinMaxScaler, RobustScaler, SimpleImputer, PCA, QuantileTransformer]}
    test: {choice: ["0.2", "0.25", "0.3", "0.15"]}
    seed: {choice: [0, 1, 7, 42, 2024]}
    x: {choice: [X, features, X_raw]}
  stem_variants:
    - "Что не так с этой схемой оценки модели?"
    - "Какая ошибка допущена в этом коде оценки качества?"
  code: |-
    X_prep = {{prep}}().fit_transform({{x}})
    X_train, X_test, y_train, y_test = train_test_split(X_prep, y, test_size={{test}}, random_state={{seed}})
    model.fit(X_train, y_train)
    print(model.score(X_test, y_test))
  code_language: python
  options:
    correct:
      - "Утечка данных: {{prep}} обучен на всей выборке, включая тест; fit нужно делать только на train, а к test применять transform"
      - "Статистики {{prep}} посчитаны с участием тестовых строк, поэтому оценка завышена; сначала split, потом fit на train (удобно через Pipeline)"
    wrong:
      - "Ошибки нет: {{prep}} не использует целевую переменную, поэтому утечки быть не может"
      - "fit_transform нужно вызывать отдельно на train и отдельно на test"
      - "train_test_split нужно вызывать с shuffle=False"
      - "Ошибка только в random_state: его нельзя фиксировать при оценке"
      - "Ошибка в test_size={{test}}: тестовая выборка должна быть не меньше половины данных"
      - "model.score нужно вызывать на X_train, иначе оценка нестабильна"

