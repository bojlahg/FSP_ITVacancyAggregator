# Data Science · машинное обучение (§10.2). Формат: content/templates/README.md

- id: ds.ml.task_type
  specializations: [data]
  topic: ml_theory
  skills: [machine_learning]
  kind: single_choice
  irt: {a: 1.0, b: -1.4}
  generator: data.task_type

- id: ds.ml.overfitting
  specializations: [data]
  topic: ml_theory
  skills: [machine_learning]
  kind: single_choice
  irt: {a: 1.2, b: -0.9}
  params:
    tr: {int: [96, 99]}
    va: {int: [66, 78]}
    model: {choice: [градиентный бустинг, нейросеть, решающее дерево без ограничения глубины]}
  stem: "Модель ({{model}}) показывает accuracy {{tr}}% на обучающей выборке и {{va}}% на валидационной. Что происходит и что делать?"
  options:
    correct:
      - "Переобучение: упростить модель, усилить регуляризацию или добавить данных"
    wrong:
      - "Недообучение: усложнить модель и добавить признаков"
      - "Это нормально: на валидации точность всегда на 20–30 п.п. ниже"
      - "Увеличить learning rate и обучать дольше"
      - "Убрать валидационную выборку и обучаться на всех данных"

- id: ds.ml.l1_sparsity
  specializations: [data]
  topic: ml_theory
  skills: [machine_learning, scikit_learn]
  kind: single_choice
  irt: {a: 1.2, b: -0.3}
  params:
    n: {int: [200, 2000], step: 100}
    model: {choice: [линейная регрессия, логистическая регрессия]}
  stem: "У модели ({{model}}) {{n}} признаков, и многие из них бесполезны. Какая регуляризация склонна обнулять веса бесполезных признаков, отбирая признаки?"
  options:
    correct: ["L1 (Lasso)"]
    wrong: ["L2 (Ridge)", "Dropout", "Batch normalization", "Ранняя остановка (early stopping)"]

