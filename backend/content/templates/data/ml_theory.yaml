  stem_variants:
    - "{{net}} на PyTorch: на инференсе предсказание для одного и того же объекта отличается, если подавать его в батче из {{a}} или из {{b}} объектов. Какая причина наиболее вероятна?"
    - "После обучения ({{net}}, PyTorch) прогноз для фиксированной картинки или строки зависит от того, с какими объектами она попала в батч (размер батча — {{a}} или {{b}}). Почему?"
  options:
    correct:
      - "Не вызван model.eval(): BatchNorm нормирует по статистикам текущего батча вместо накопленных running mean/var (и Dropout остаётся включённым)"
    wrong:
      - "Не вызван torch.no_grad(): из-за вычисления градиентов меняются веса модели"
      - "Это нормально: свёрточные слои всегда зависят от размера батча"
      - "Веса модели сохранены в float16, и ошибка округления зависит от размера батча"
      - "Нужно вызвать model.train(), чтобы зафиксировать статистики BatchNorm"
      - "Оптимизатор продолжает шаги на инференсе, пока не вызван optimizer.zero_grad()"

- id: ds.ml.dropout_scale
  specializations: [data]
  topic: ml_theory
  skills: [deep_learning, pytorch]
  kind: numeric
  irt: {a: 1.1, b: 1.4}
  time_limit_sec: 120
  params:
    p: {choice: [0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.5, 0.6]}
    h: {choice: [64, 128, 256, 512, 768, 1024, 2048]}
  stem_variants:
    - >-
      Скрытый слой из {{h}} нейронов, после него nn.Dropout(p={{p}}) в PyTorch. Модель в режиме train(). На какое
      число умножаются активации, которые dropout не обнулил? Округлите до сотых.
    - >-
      В PyTorch используется «inverted dropout». Слой nn.Dropout(p={{p}}) стоит после слоя из {{h}} нейронов. Во
      время обучения сохранённые активации масштабируются. На какой множитель? Округлите до сотых.
    - >-
      Модель на PyTorch: Linear(…, {{h}}) → ReLU → nn.Dropout(p={{p}}). Во время обучения часть активаций
      обнуляется. Во сколько раз увеличиваются оставшиеся активации? Округлите до сотых.
  answer:
    # inverted dropout: при обучении активации делятся на (1 − p), на инференсе слой ничего не делает
    expr: "round(1 / (1 - {{p}}), 2)"
    tolerance: 0.01

