# Data Science · машинное обучение (§10.2). Формат: content/templates/README.md

- id: ds.ml.train_test_purpose
  specializations: [data]
  topic: ml_theory
  skills: [machine_learning]
  kind: single_choice
  irt: {a: 1.0, b: -1.8}
  params:
    model: {choice: [логистической регрессии, градиентного бустинга, случайного леса, нейросети, линейной регрессии]}
    task: {choice: [прогноза оттока, скоринга заявок, классификации отзывов, прогноза спроса, распознавания брака]}
    share: {choice: [10, 15, 20, 25, 30]}
  stem_variants:
    - "Для {{task}} обучают модель {{model}} и откладывают {{share}}% данных в тестовую выборку, на которой модель не обучается. Зачем?"
    - "Задача — {{task}}, модель — {{model}}. Зачем перед обучением отделяют тестовую выборку ({{share}}% данных) и не используют её при обучении?"
  options:
    correct:
      - "Чтобы честно оценить качество модели на новых, не виденных ею данных"
      - "Чтобы проверить, как модель обобщается на данные, которых не было при обучении"
    wrong:
      - "Чтобы модель быстрее обучалась на меньшем объёме данных"
      - "Чтобы многократно подбирать на ней гиперпараметры"
      - "Чтобы удалить из обучения выбросы"
      - "Чтобы повысить accuracy на обучающей выборке"
      - "Чтобы сбалансировать классы в обучающей выборке"

- id: ds.ml.linear_predict
  specializations: [data]
  topic: ml_theory
  skills: [machine_learning]
  kind: numeric
  irt: {a: 1.0, b: -1.6}
  params:
    w0: {int: [-20, 30]}
    w1: {int: [2, 9]}
    w2: {int: [-6, -1]}
    x1: {int: [1, 12]}
    x2: {int: [1, 10]}
  stem_variants:
    - "Обученная линейная регрессия: ŷ = {{w0}} + {{w1}}·x₁ + ({{w2}})·x₂. Какой прогноз она даст для объекта с x₁ = {{x1}}, x₂ = {{x2}}?"
    - "Веса линейной модели: свободный член {{w0}}, вес признака x₁ равен {{w1}}, вес признака x₂ равен {{w2}}. Чему равен прогноз для x₁ = {{x1}} и x₂ = {{x2}}?"
  answer:
    expr: "{{w0}} + {{w1}} * {{x1}} + {{w2}} * {{x2}}"
    tolerance: 0

