- id: ds.ml.scaling_sensitive
  specializations: [data]
  topic: ml_theory
  skills: [machine_learning, scikit_learn]
  kind: multi_choice
  irt: {a: 1.2, b: 0.3}
  n_options: 5
  params:
    a: {choice: [доход в рублях, сумма покупок за год, площадь участка в м²]}
    b: {choice: [доля возвратов от 0 до 1, рейтинг от 0 до 5, число детей]}
  stem: "Признаки: «{{a}}» (значения до миллионов) и «{{b}}». Результат каких методов существенно зависит от того, приведены ли признаки к одному масштабу? Отметьте все верные."
  options:
    correct:
      - "kNN"
      - "SVM с RBF-ядром"
      - "k-means"
      - "PCA"
      - "Логистическая регрессия с L2-регуляризацией"
    wrong:
      - "Решающее дерево"
      - "Случайный лес"
      - "Градиентный бустинг над деревьями"

- id: ds.ml.preprocessing_leakage
  specializations: [data]
  topic: ml_theory
  skills: [machine_learning, scikit_learn]
  kind: single_choice
  irt: {a: 1.3, b: 0.4}
  params:
    prep: {choice: [StandardScaler, MinMaxScaler, SimpleImputer, PCA]}
    test: {choice: ["0.2", "0.25", "0.3"]}
  stem: "Что не так с этой схемой оценки модели?"
  code: |-
    X_prep = {{prep}}().fit_transform(X)
    X_train, X_test, y_train, y_test = train_test_split(X_prep, y, test_size={{test}}, random_state=42)
    model.fit(X_train, y_train)
    print(model.score(X_test, y_test))
  code_language: python
  options:
    correct:
      - "Утечка данных: {{prep}} обучен на всей выборке, включая тест; fit нужно делать только на train, а к test применять transform"
    wrong:
      - "Ошибки нет: {{prep}} не использует целевую переменную, поэтому утечки быть не может"
      - "fit_transform нужно вызывать отдельно на train и отдельно на test"
      - "train_test_split нужно вызывать с shuffle=False"
      - "Ошибка только в random_state: его нельзя фиксировать при оценке"

- id: ds.ml.gradient_boosting_target
  specializations: [data]
  topic: ml_theory
  skills: [machine_learning, catboost]
  kind: single_choice
  irt: {a: 1.2, b: 0.8}
  params:
    trees: {int: [200, 2000], step: 100}
    lr: {choice: ["0.03", "0.05", "0.1"]}
  stem: "Градиентный бустинг над деревьями для регрессии с функцией потерь MSE: {{trees}} деревьев, learning rate {{lr}}. На что обучается каждое следующее дерево?"
  options:
    correct:
      - "На антиградиент функции потерь по предсказаниям текущего ансамбля — для MSE это остатки y − F(x)"
    wrong:
      - "На исходную целевую переменную y по бутстрэп-выборке, независимо от предыдущих деревьев"
      - "На исходную целевую переменную y по признакам, не использованным предыдущими деревьями"
      - "На среднее предсказаний всех предыдущих деревьев"
      - "На целевую переменную y, умноженную на learning rate"

- id: ds.ml.attention_quadratic
  specializations: [data]
  topic: ml_theory
  skills: [deep_learning, llm]
  kind: numeric
  irt: {a: 1.1, b: 0.9}
  params:
    n: {choice: [1024, 2048, 4096, 8192]}
    k: {choice: [2, 3, 4, 8]}
  stem: >-
    В стандартном (полном) self-attention трансформера длину входной последовательности увеличили в {{k}} раз
    (исходная длина: {{n}}). Во сколько раз вырастет число попарных оценок внимания (элементов матрицы QKᵀ) в
    одной голове одного слоя?
  answer:
    expr: "{{k}} ** 2"
    tolerance: 0

- id: ds.ml.rf_vs_boosting
  specializations: [data]
  topic: ml_theory
  skills: [machine_learning]
  kind: single_choice
  irt: {a: 1.2, b: 1.2}
  params:
    a: {int: [100, 300], step: 50}
    b: {int: [3000, 10000], step: 1000}
  stem: "Почему при росте числа деревьев с {{a}} до {{b}} качество случайного леса на валидации обычно выходит на плато, а у градиентного бустинга без ранней остановки может начать ухудшаться?"
  options:
    correct:
      - "Деревья леса обучаются независимо и усредняются, их рост лишь снижает дисперсию; в бустинге каждое дерево подгоняется под ошибки ансамбля на обучающих данных, и со временем модель подгоняется под шум"
    wrong:
      - "Деревья случайного леса всегда неглубокие, поэтому лес не может переобучиться"
      - "Бустинг обучает деревья на бутстрэп-выборках, а случайный лес — на всех данных"
      - "Случайный лес автоматически применяет раннюю остановку по валидации"
      - "Бустинг не переобучается при learning rate меньше 0.1, проблема в шуме валидации"

- id: ds.ml.dbscan_no_k
  specializations: [data]
  topic: ml_theory
  skills: [machine_learning, scikit_learn]
  kind: single_choice
  status: pilot
  irt: {a: 1.0, b: -0.2}
  params:
    what: {choice: [GPS-точки курьеров, точки продаж на карте, логи событий в пространстве признаков]}
  stem: "Нужно кластеризовать {{what}}. Число кластеров заранее неизвестно, кластеры произвольной формы, есть выбросы. Какой алгоритм не требует задавать число кластеров и помечает выбросы как шум?"
  options:
    correct: ["DBSCAN"]
    wrong: ["k-means", "k-medoids", "Gaussian Mixture Model", "Mini-batch k-means"]
