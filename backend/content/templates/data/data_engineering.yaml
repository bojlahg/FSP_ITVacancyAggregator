# Data Science · инженерия данных (§10.2). Формат: content/templates/README.md

- id: ds.de.dag_meaning
  specializations: [data]
  topic: data_engineering
  skills: [airflow, etl]
  kind: single_choice
  irt: {a: 1.0, b: -1.6}
  params:
    pipe: {choice: [выгрузки заказов, расчёта витрины продаж, обновления фичей для модели, загрузки логов, сборки отчёта по оттоку, синхронизации справочников]}
    n: {int: [3, 15]}
  stem_variants:
    - "Пайплайн {{pipe}} из {{n}} задач описан в Airflow как DAG. Что это означает?"
    - "В Airflow {{n|задача|задачи|задач}} {{pipe}} объединены в DAG. Какое утверждение о DAG верно?"
  options:
    correct:
      - "Задачи и зависимости между ними образуют направленный граф без циклов: задача запускается после тех, от которых зависит"
      - "Это направленный ациклический граф: зависимости задают порядок выполнения, и циклические зависимости запрещены"
    wrong:
      - "Задачи выполняются строго последовательно в порядке объявления в файле"
      - "Задачи могут зависеть друг от друга по кругу, Airflow сам разрешит цикл"
      - "DAG — это только расписание запуска, задачи внутри никак не связаны"
      - "Каждая задача DAG обязательно выполняется на отдельном сервере"
      - "DAG гарантирует, что все {{n|задача|задачи|задач}} выполнятся в одной транзакции"

- id: ds.de.elt_meaning
  specializations: [data]
  topic: data_engineering
  skills: [etl, dbt]
  kind: single_choice
  irt: {a: 1.0, b: -1.0}
  params:
    dwh: {choice: [ClickHouse, Greenplum, BigQuery, Snowflake, Vertica, PostgreSQL-хранилище]}
    src: {choice: [CRM на PostgreSQL, топики Kafka, 1С, MongoDB с заказами, API платёжного сервиса]}
    tool: {choice: [SQL-моделями dbt, SQL-скриптами в хранилище]}
  stem_variants:
    - "Команда переходит от ETL к ELT: источник — {{src}}, хранилище — {{dwh}}. Что это означает?"
    - "Данные из источника «{{src}}» решили грузить в {{dwh}} по схеме ELT вместо ETL. Что изменится?"
    - "Чем ELT-процесс для источника «{{src}}» и хранилища {{dwh}} отличается от ETL?"
  options:
    correct:
      - "Сырые данные сначала загружаются в {{dwh}}, а трансформации выполняются уже внутри хранилища (например, {{tool}})"
      - "Трансформация переносится после загрузки: данные из «{{src}}» кладутся в {{dwh}} как есть и преобразуются там {{tool}}"
    wrong:
      - "Данные трансформируются на отдельном сервере до загрузки в {{dwh}}"
      - "Данные загружаются в {{dwh}} без каких-либо трансформаций, витрины не строятся"
      - "Трансформации выполняются в системе-источнике ({{src}}) до извлечения"
      - "Из процесса убирается шаг извлечения: {{dwh}} сам читает источники в реальном времени"
      - "ELT означает загрузку только инкрементов, а ETL — только полных выгрузок"
      - "Порядок шагов не меняется, ELT — просто другое название ETL для облачных хранилищ"

- id: ds.de.columnar_format
  specializations: [data]
  topic: data_engineering
  skills: [etl, spark]
  kind: single_choice
  irt: {a: 1.1, b: -0.8}
  params:
    k: {int: [3, 6]}
    n: {int: [80, 300], step: 20}
  stem: "Аналитические запросы читают {{k}} из {{n}} колонок широкой таблицы событий за большой период. Какой формат хранения файлов в озере данных подойдёт лучше всего?"
  options:
    correct: ["Parquet"]
    wrong: ["CSV", "JSON Lines", "Avro", "XML"]

- id: ds.de.idempotent_reload
  specializations: [data]
  topic: data_engineering
  skills: [etl, airflow]
  kind: single_choice
  irt: {a: 1.2, b: 0.0}
  params:
    date: {choice: ["2026-03-14", "2026-07-01", "2026-09-30", "2026-11-11", "2026-02-28", "2026-05-09"]}
    table: {choice: [events, payments, sessions, clicks, orders, deliveries]}
  stem_variants:
    - "Ежедневная задача Airflow загружает {{table}} за {{date}} в таблицу, партиционированную по дате. Задачу иногда перезапускают за ту же дату, и в таблице появляются дубли. Как сделать загрузку идемпотентной?"
    - "После ручного перезапуска загрузки {{table}} за {{date}} в таблице, партиционированной по дате, данные за этот день задвоились. Как устроить загрузку, чтобы повторный запуск давал тот же результат?"
  options:
    correct:
      - "Перезаписывать партицию за обрабатываемую дату целиком (overwrite или DELETE + INSERT в одной транзакции)"
      - "Заменять данные за {{date}} атомарно: удалить партицию этой даты и вставить заново в одной транзакции (или INSERT OVERWRITE)"
    wrong:
      - "Добавлять данные через INSERT, а дубли раз в месяц чистить отдельной задачей"
      - "Отключить retries у задачи"
      - "Определять дату партиции через datetime.now() внутри задачи"
      - "Увеличить execution_timeout, чтобы задача не перезапускалась"
      - "Добавить в {{table}} столбец с временем загрузки и всегда делать INSERT"
      - "Запретить параллельный запуск DAG (max_active_runs=1) — этого достаточно"

- id: ds.de.partition_key
  status: showcase
  specializations: [data]
  topic: data_engineering
  skills: [etl, spark]
  kind: single_choice
  irt: {a: 1.1, b: 0.2}
  params:
    table: {choice: [events, clicks, transactions, page_views, app_logs]}
    rows: {int: [2, 40]}
    days: {choice: [1, 7, 14, 30]}
  stem_variants:
    - "Таблица {{table}} в озере данных — около {{rows}} млрд строк за несколько лет. Почти все запросы фильтруют по дате события за последние {{days}} дн. По какому полю лучше партиционировать таблицу?"
    - "Запросы к {{table}} ({{rows}} млрд строк) почти всегда содержат условие event_date за последние {{days}} дн. Какой ключ партиционирования выбрать?"
  options:
    correct:
      - "По дате события (event_date): запрос прочитает только нужные партиции"
    wrong:
      - "По user_id: у него миллионы уникальных значений, партиции будут маленькими"
      - "По event_id, потому что это уникальный ключ"
      - "По случайному числу, чтобы партиции были одного размера"
      - "Не партиционировать: партиции всегда замедляют чтение"
      - "По типу устройства: у него всего несколько значений"

- id: ds.de.spark_actions
  specializations: [data]
  topic: data_engineering
  skills: [spark]
  kind: multi_choice
  irt: {a: 1.2, b: 0.4}
  n_options: 5
  params:
    df: {choice: [events, orders, clicks, sessions]}
  stem: "Spark вычисляет лениво. Какие вызовы над DataFrame {{df}} в PySpark являются действиями (actions) и запускают фактическое вычисление? Отметьте все."
  options:
    correct:
      - "{{df}}.count()"
      - "{{df}}.collect()"
      - "{{df}}.show()"
      - "{{df}}.write.parquet(path)"
    wrong:
      - "{{df}}.filter(...)"
      - "{{df}}.select(...)"
      - "{{df}}.withColumn(...)"
      - "{{df}}.groupBy(...).agg(...)"

- id: ds.de.scd_type2
  specializations: [data]
  topic: data_engineering
  skills: [etl, sql_analytics]
  kind: single_choice
  irt: {a: 1.1, b: 0.5}
  params:
    attr: {choice: [адрес клиента, тарифный план абонента, регион магазина, должность сотрудника, категория товара, менеджер клиента, сегмент клиента, отделение банка]}
    fact: {choice: [продаж, платежей, звонков, заказов]}
  stem_variants:
    - "В хранилище есть измерение, где меняется атрибут «{{attr}}». Отчёты по фактам {{fact}} должны показывать значение, действовавшее на дату факта. Какой тип медленно меняющегося измерения (SCD) выбрать?"
    - "Атрибут «{{attr}}» в измерении иногда меняется, а аналитикам нужна полная история: к каждому факту {{fact}} — значение на момент факта. Как хранить измерение?"
  options:
    correct:
      - "SCD Type 2: новая строка на каждую версию с периодом действия (valid_from / valid_to) или флагом актуальности"
      - "SCD Type 2: при изменении «{{attr}}» старая строка закрывается датой окончания, добавляется новая версия со своим суррогатным ключом"
    wrong:
      - "SCD Type 1: перезаписывать значение в существующей строке"
      - "SCD Type 0: запретить изменение атрибута"
      - "SCD Type 3: отдельный столбец под каждое прошлое значение, хранится вся история"
      - "Хранить историю только в логах ETL-процесса"
      - "Перезаписывать «{{attr}}» и пересчитывать все прошлые факты {{fact}} под новое значение"
      - "Удалять факты {{fact}}, относящиеся к старому значению атрибута"

- id: ds.de.spark_shuffle
  specializations: [data]
  topic: data_engineering
  skills: [spark]
  kind: multi_choice
  irt: {a: 1.2, b: 1.0}
  n_options: 5
  params:
    df: {choice: [events, orders, clicks, sessions]}
    n: {choice: [200, 400, 800]}
  stem: "Какие операции над большим DataFrame {{df}} в Spark вызывают shuffle — перераспределение данных между партициями по сети? Отметьте все."
  options:
    correct:
      - "{{df}}.groupBy(\"user_id\").agg(...)"
      - "{{df}}.repartition({{n}})"
      - "{{df}}.distinct()"
      - "Join {{df}} с другой большой таблицей через sort-merge join"
    wrong:
      - "{{df}}.filter(...)"
      - "{{df}}.withColumn(...)"
      - "{{df}}.coalesce(10) для уменьшения числа партиций"
      - "{{df}}.select(...)"

- id: ds.de.kafka_at_least_once
  specializations: [data]
  topic: data_engineering
  skills: [kafka, etl]
  kind: single_choice
  irt: {a: 1.2, b: 1.2}
  params:
    sink: {choice: [PostgreSQL, ClickHouse, S3, Elasticsearch, Redis, Greenplum]}
    topic: {choice: [payments, clicks, orders, events, deliveries, signups]}
  stem_variants:
    - "Консьюмер читает сообщение из топика {{topic}}, пишет результат в {{sink}} и только после этого коммитит offset. Процесс упал после записи в {{sink}}, но до коммита. Что произойдёт после перезапуска?"
    - "Сервис обрабатывает топик {{topic}}: запись в {{sink}}, затем commit offset. Между записью и коммитом под был убит. Что увидим после рестарта консьюмера?"
  options:
    correct:
      - "Сообщение будет обработано повторно (at-least-once), поэтому запись в {{sink}} должна быть идемпотентной"
      - "Консьюмер продолжит с последнего закоммиченного offset и снова запишет это сообщение в {{sink}}: нужна дедупликация или идемпотентная запись"
    wrong:
      - "Сообщение будет потеряно (at-most-once)"
      - "Повтора не будет: Kafka по умолчанию гарантирует exactly-once для любых консьюмеров"
      - "Повтор невозможен: Kafka удаляет сообщение из топика сразу после чтения"
      - "Консьюмер начнёт читать топик {{topic}} с самого начала"
      - "Брокер сам откатит запись в {{sink}}, так как offset не был закоммичен"
      - "Сообщение уйдёт в dead letter queue автоматически, повторной записи не будет"

- id: ds.de.small_files
  specializations: [data]
  topic: data_engineering
  skills: [spark, etl]
  kind: single_choice
  irt: {a: 1.1, b: 1.4}
  params:
    table: {choice: [events, clicks, app_logs, transactions]}
    parts: {choice: [200, 400, 1000]}
    files: {int: [100, 900], step: 50}
  stem_variants:
    - "Ежечасная Spark-задача пишет {{table}} в Parquet после shuffle на {{parts}} партиций. За месяц в каталоге {{files}} тыс. файлов по несколько КБ, чтение таблицы стало очень медленным. Что делать?"
    - "Таблица {{table}} в озере состоит из {{files}} тыс. мелких Parquet-файлов: каждая запись Spark создаёт {{parts}} файлов по несколько КБ. Запросы тормозят на листинге и открытии файлов. Как исправить?"
  options:
    correct:
      - "Уменьшить число выходных файлов (coalesce или repartition перед записью) и периодически компактировать мелкие файлы в крупные — порядка сотен МБ"
    wrong:
      - "Увеличить spark.sql.shuffle.partitions, чтобы каждый файл был ещё меньше и читался быстрее"
      - "Перейти с Parquet на CSV: текстовые файлы открываются быстрее"
      - "Увеличить память драйвера — проблема только в нехватке памяти"
      - "Писать каждую строку отдельным файлом, чтобы чтение лучше распараллеливалось"
      - "Отключить сжатие Parquet, чтобы файлы читались без распаковки"

- id: ds.de.daily_partitions
  specializations: [data]
  topic: data_engineering
  skills: [etl]
  kind: numeric
  irt: {a: 1.0, b: -1.9}
  params:
    first: {int: [1, 9]}
    last: {int: [15, 28]}
    month: {choice: [марта, апреля, мая, июня, сентября, октября]}
    table: {choice: [events, orders, clicks, payments]}
  stem_variants:
    - "Таблица {{table}} разбита на партиции по дню: одна партиция на каждую дату. Загрузили данные с {{first}} по {{last}} {{month}} включительно, без пропусков. Сколько партиций заполнено?"
    - "DAG в Airflow запускается раз в сутки и пишет в таблицу {{table}} одну партицию за день. Его прогнали за период с {{first}} по {{last}} {{month}} включительно. Сколько партиций появилось?"
  answer:
    # обе границы входят в период
    expr: "{{last}} - {{first}} + 1"
    tolerance: 0

- id: ds.de.idempotent_load
  specializations: [data]
  topic: data_engineering
  skills: [etl]
  kind: single_choice
  irt: {a: 1.3, b: 1.5}
  params:
    table: {choice: [events, orders, payments]}
    tool: {choice: [Airflow, Dagster, Prefect]}
  stem: "Ежедневная задача в {{tool}} делает INSERT в {{table}} данных за прошедший день. После падения и автоматического перезапуска в таблице появились дубли. Как правильно сделать загрузку?"
  options:
    correct:
      - "Сделать её идемпотентной: перезаписывать партицию за день целиком (delete + insert в одной транзакции или overwrite партиции) либо делать upsert по ключу"
    wrong:
      - "Отключить повторные запуски задачи в {{tool}}"
      - "Раз в неделю удалять дубли через SELECT DISTINCT в новую таблицу"
      - "Увеличить таймаут задачи, чтобы она не падала"
      - "Добавить в таблицу автоинкрементный id — дубли станут уникальными строками"

- id: ds.de.late_events
  specializations: [data]
  topic: data_engineering
  skills: [etl, kafka]
  kind: single_choice
  irt: {a: 1.3, b: 1.7}
  params:
    late: {choice: [2, 3, 6]}
  stem: "Агрегаты по часам считаются по времени обработки событий в стриминге. Часть событий с мобильных устройств приходит с опозданием до {{late}} часов, и сумма за час не сходится с сырыми данными. Что нужно сделать?"
  options:
    correct:
      - "Агрегировать по времени события (event time) с watermark не меньше {{late}} ч или пересчитывать закрытые окна при поздних событиях"
    wrong:
      - "Отбрасывать все события старше 5 минут — так агрегаты станут стабильными"
      - "Увеличить число партиций в топике, чтобы события приходили быстрее"
      - "Считать по времени обработки, но умножать итог на поправочный коэффициент"
      - "Перейти с Kafka на очередь RabbitMQ"
