# Data Science · метрики и эксперименты (§10.2). Формат: content/templates/README.md

- id: ds.eval.split_sizes
  specializations: [data]
  topic: evaluation
  skills: [machine_learning]
  kind: numeric
  irt: {a: 1.0, b: -1.6}
  params:
    n: {int: [2000, 60000], step: 1000}
    va: {choice: [10, 15, 20]}
    te: {choice: [10, 15, 20, 25]}
    task: {choice: [прогноза оттока, классификации обращений, скоринга заявок, прогноза спроса]}
  stem_variants:
    - "Датасет для {{task}} из {{n}} объектов делят случайно: {{va}}% — валидация, {{te}}% — тест, остальное — обучение. Сколько объектов попадёт в обучающую выборку?"
    - "Для {{task}} есть {{n}} размеченных объектов. В тест откладывают {{te}}%, в валидацию — {{va}}%, остальное идёт в train. Каков размер train?"
  answer:
    expr: "{{n}} * (100 - {{va}} - {{te}}) / 100"
    tolerance: 0

