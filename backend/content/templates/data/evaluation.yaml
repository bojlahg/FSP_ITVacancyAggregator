    what: {choice: [мошеннических транзакций, писем со спамом, бракованных деталей, ушедших в отток клиентов, дефолтов по кредитам, кликов по баннеру]}
    n: {int: [2000, 50000], step: 1000}
  stem_variants:
    - "Доля {{what}} в тестовой выборке из {{n}} объектов — {{p}}%. «Модель» всегда предсказывает отрицательный класс. Чему равна её accuracy в процентах?"
    - "В выборке {{p}}% {{what}} (всего {{n}} объектов). Классификатор, который никогда не находит положительный класс, получает какую accuracy (в процентах)?"
    - "Бейзлайн для поиска {{what}} всегда отвечает «нет». Положительных в тесте ({{n}} объектов) {{p}}%. Какова accuracy бейзлайна в процентах?"
