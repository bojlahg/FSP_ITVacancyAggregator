      - "Нужна стратификация по целевой переменной"
      - "Валидация верная, просто в проде данные шумнее"
      - "Нужно перемешать данные ещё раз перед делением"

- id: ds.eval.calibration
  specializations: [data]
  topic: evaluation
  skills: [machine_learning, scikit_learn]
  kind: single_choice
  irt: {a: 1.4, b: 1.8}
  params:
    pred: {choice: ["0,8", "0,7", "0,9"]}
    real: {choice: ["50%", "55%", "60%"]}
  stem: "Среди объектов, которым модель дала вероятность около {{pred}}, положительных оказалось {{real}}. ROC-AUC при этом высокая. Как называется проблема и что обычно делают?"
  options:
    correct:
      - "Плохая калибровка: ранжирование хорошее, а вероятности завышены; калибруют на отложенной выборке (Platt scaling или изотоническая регрессия)"
    wrong:
      - "Переобучение: нужно уменьшить глубину модели, вероятности при этом станут точными"
      - "Дисбаланс классов: нужно сделать oversampling положительного класса"
      - "Проблемы нет: при высокой ROC-AUC вероятности всегда корректны"
      - "Утечка таргета: нужно удалить самый важный признак"
