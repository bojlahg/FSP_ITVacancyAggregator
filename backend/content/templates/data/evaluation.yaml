- id: ds.eval.roc_auc_meaning
  specializations: [data]
  topic: evaluation
  skills: [machine_learning]
  kind: single_choice
  irt: {a: 1.3, b: 0.5}
  params:
    auc: {choice: ["0.68", "0.72", "0.75", "0.78", "0.81", "0.84", "0.86", "0.93"]}
    model: {choice: [Модель оттока, Скоринговая модель, Антифрод-модель, Модель отклика на рассылку, Детектор спама, Модель предсказания брака]}
  stem_variants:
    - "{{model}} получила ROC AUC = {{auc}} на тесте. Как интерпретировать это число?"
    - "На отложенной выборке у модели «{{model}}» ROC AUC = {{auc}}. Что означает это значение?"
  options:
    correct:
      - "Случайно выбранный объект положительного класса получит score выше, чем случайный объект отрицательного класса, с вероятностью {{auc}}"
      - "Это вероятность того, что модель упорядочит случайную пару «положительный — отрицательный» правильно: {{auc}}"
    wrong:
      - "Модель верно классифицирует долю {{auc}} объектов при пороге 0.5"
      - "Площадь под кривой precision–recall равна {{auc}}"
      - "Модель находит долю {{auc}} объектов положительного класса при оптимальном пороге"
      - "Предсказанные вероятности откалиброваны с точностью {{auc}}"
      - "Precision модели при пороге 0.5 равна {{auc}}"
      - "Доля объектов, для которых модель уверена в ответе, равна {{auc}}"

- id: ds.eval.timeseries_cv
  specializations: [data]
  topic: evaluation
  skills: [machine_learning, scikit_learn]
  kind: single_choice
  irt: {a: 1.2, b: 0.6}
  params:
    what: {choice: [продаж магазина, нагрузки на колл-центр, потребления электроэнергии, числа заказов такси, трафика сайта, выдачи наличных в банкоматах, спроса на доставку]}
    years: {choice: [два года, три года, четыре года, пять лет]}
    horizon: {choice: [7, 14, 28, 30]}
  stem_variants:
    - "Есть дневная история {{what}} за {{years}}, модель будет прогнозировать на {{horizon}} дней вперёд. Как устроить валидацию?"
    - "Модель прогнозирует динамику {{what}} на следующие {{horizon}} дней по дневной истории за {{years}}. Какая схема валидации корректна?"
  options:
    correct:
      - "Делить по времени: обучать на прошлом, проверять на следующем за ним периоде (TimeSeriesSplit, расширяющееся окно)"
      - "Валидация «вперёд по времени»: каждый фолд обучается на данных до даты отсечки и проверяется на следующих {{horizon}} днях"
    wrong:
      - "KFold с shuffle=True, чтобы все периоды были представлены в каждом фолде"
      - "Стратифицированный KFold по целевой переменной"
      - "Случайные 20% дней отправить в валидацию"
      - "Leave-one-out по отдельным дням в случайном порядке"
      - "Обучать на последнем годе, а проверять на самом раннем периоде"
      - "Оценивать качество на обучающей выборке: на временных рядах переобучения не бывает"

- id: ds.eval.ab_peeking
  specializations: [data]
  topic: evaluation
  skills: [ab_testing, statistics]
  kind: single_choice
  irt: {a: 1.2, b: 1.0}
  params:
    days: {int: [3, 9]}
    plan: {choice: [две недели, три недели, четыре недели]}
    metric: {choice: [конверсию в покупку, средний чек, удержание на 7-й день]}
  stem: >-
    A/B-тест на {{metric}} планировали на {{plan}}. Аналитик каждый день пересчитывал p-value и остановил
    тест на {{days}}-й день, как только p < 0.05. В чём проблема?
  options:
    correct:
      - "Многократные проверки без поправки завышают вероятность ложноположительного результата выше 5%; нужен фиксированный размер выборки или последовательный тест"
    wrong:
      - "Проблемы нет: p < 0.05 означает, что эффект реален с вероятностью 95%"
      - "Ранняя остановка снижает вероятность ложноположительного результата, это только плюс"
      - "Растёт только ошибка II рода, а ошибка I рода остаётся равной 5%"
      - "Проблема лишь в том, что p-value надо пересчитывать раз в неделю, а не каждый день"

- id: ds.eval.srm
  specializations: [data]
  topic: evaluation
  skills: [ab_testing, statistics]
  kind: single_choice
  irt: {a: 1.3, b: 1.2}
  params:
    a: {int: [50200, 50800], step: 50}
    b: {int: [48200, 48800], step: 50}
  stem: "A/B-тест с плановым разбиением 50/50: в группе A {{a}} пользователей, в группе B — {{b}}. Конверсия в B выше. Что делать с результатами?"
  options:
    correct:
      - "Это похоже на SRM: при таком объёме расхождение с 50/50 статистически значимо (χ²-тест), результатам нельзя доверять, пока не найдена причина в сплите или логировании"
    wrong:
      - "Расхождение в пределах случайности для такой выборки, можно сравнивать конверсии"
      - "Случайно удалить лишних пользователей из A, чтобы выровнять группы, и сравнить"
      - "Размер групп не важен, если сравнивать конверсии в долях"
      - "Повысить уровень значимости до 0.1, чтобы компенсировать неравные группы"

- id: ds.eval.pr_auc_imbalance
  specializations: [data]
  topic: evaluation
  skills: [machine_learning]
  kind: single_choice
  irt: {a: 1.2, b: 1.5}
  params:
    p: {choice: ["0.05", "0.1", "0.2", "0.3", "0.5"]}
    auc: {choice: ["0.95", "0.96", "0.97", "0.98"]}
    what: {choice: [мошеннических платежей, дефектных деталей, редких отказов оборудования, взломанных аккаунтов]}
  stem_variants:
    - "Доля {{what}} — {{p}}%. У модели ROC AUC = {{auc}}, но при любом разумном пороге большинство помеченных объектов оказываются ложными срабатываниями. Как это объяснить и на что смотреть?"
    - "Модель поиска {{what}} (их {{p}}% в данных) имеет ROC AUC {{auc}}, однако операторы жалуются, что почти все алерты ложные. Почему высокий ROC AUC этому не противоречит?"
  options:
    correct:
      - "FPR считается по огромному числу отрицательных, поэтому даже малый FPR даёт много ложных срабатываний по сравнению с числом редких положительных; нужно смотреть PR-кривую, PR AUC (average precision) и precision при рабочем пороге"
    wrong:
      - "ROC AUC при дисбалансе считается с ошибкой; его нужно умножить на долю положительных"
      - "Нужно смотреть accuracy: она учитывает дисбаланс классов"
      - "Дело в калибровке: после калибровки вероятностей precision вырастет при том же ранжировании"
      - "ROC AUC не зависит от порога, поэтому precision при любом пороге равна ROC AUC"
      - "Высокий ROC AUC при таком дисбалансе означает переобучение, нужна регуляризация"

- id: ds.eval.cuped
  specializations: [data]
  topic: evaluation
  skills: [ab_testing, statistics]
  kind: single_choice
  irt: {a: 1.2, b: 1.7}
  params:
    metric: {choice: [выручку на пользователя, число заказов, время в приложении, средний чек]}
    weeks: {choice: [2, 3, 4, 8]}
  stem_variants:
    - "Для A/B-теста на {{metric}} есть значение той же метрики у каждого пользователя за {{weeks}} нед. до эксперимента. Как CUPED использует эти данные?"
    - "Команда хочет применить CUPED в тесте на {{metric}}, используя метрику за {{weeks}} нед. до старта как ковариату. Что он делает?"
  options:
    correct:
      - "Вычитает из метрики линейную поправку θ·(X − среднее X) по доэкспериментальной ковариате X: оценка эффекта остаётся несмещённой, а дисперсия падает примерно в (1 − ρ²) раз, поэтому нужна меньшая выборка"
    wrong:
      - "Исключает пользователей, у которых метрика до эксперимента была ниже среднего"
      - "Сравнивает метрику до и после эксперимента только в группе B вместо сравнения с контролем"
      - "Повышает уровень значимости, чтобы учесть доэкспериментальный период"
      - "Сдвигает оценку эффекта к нулю, зато уменьшает ошибку I рода"
      - "Позволяет не рандомизировать: группы подбираются по значению метрики до эксперимента"

- id: ds.eval.model_degradation
  specializations: [data]
  topic: evaluation
  skills: [machine_learning, mlops]
  kind: open_approach
  irt: {a: 1.0, b: 1.0}
  time_limit_sec: 600
  params:
    model: {choice: [Модель оттока, Скоринговая модель, Модель рекомендаций, Антифрод-модель]}
    before: {choice: ["0.86", "0.89", "0.91"]}
    after: {choice: ["0.71", "0.74", "0.77"]}
  stem: >-
    {{model}} год стабильно работала в production с ROC AUC около {{before}} по свежей разметке, а за последний
    месяц метрика упала до {{after}}. Опишите, как вы будете искать причину и что предпримете.
  rubric:
    - Проверяет данные и пайплайн на технические поломки (изменение схемы, пропуски, сломанный источник, сдвиг в признаках из-за бага)
    - Сравнивает распределения признаков и предсказаний с обучающими (data drift, например PSI или тесты распределений)
    - Рассматривает изменение связи признаков с целевой переменной (concept drift) и корректность свежей разметки
    - Анализирует качество по сегментам, чтобы локализовать деградацию
    - Предлагает меры (переобучение на свежих данных с валидацией по времени, откат или запасная модель, мониторинг и алерты на дрейф)

