# Data Science · метрики и эксперименты (§10.2). Формат: content/templates/README.md

- id: ds.eval.constant_accuracy
  specializations: [data]
  topic: evaluation
  skills: [machine_learning]
  kind: numeric
  irt: {a: 1.1, b: -1.2}
  params:
    p: {choice: [0.5, 1, 2, 3, 5, 8]}
    what: {choice: [мошеннических транзакций, писем со спамом, бракованных деталей, клиентов, ушедших в отток]}
  stem_variants:
    - "Доля {{what}} в тестовой выборке — {{p}}%. «Модель» всегда предсказывает отрицательный класс. Чему равна её accuracy в процентах?"
    - "В выборке {{p}}% {{what}}. Классификатор, который никогда не находит положительный класс, получает какую accuracy (в процентах)?"
  answer:
    expr: "100 - {{p}}"
    tolerance: 0.01

- id: ds.eval.ml_project_order
  specializations: [data]
  topic: evaluation
  skills: [machine_learning, mlops]
  kind: ordering
  irt: {a: 1.0, b: -0.9}
  time_limit_sec: 120
  params:
    task: {choice: [прогноз оттока клиентов, скоринг заявок на кредит, прогноз спроса на товары, классификация обращений в поддержку]}
  stem: "Проект: {{task}}. Расположите этапы работы над моделью в правильном порядке."
  order_items:
    - "Сформулировать задачу и выбрать метрику качества"
    - "Собрать данные и проверить их качество"
    - "Отложить тестовую выборку"
    - "Обучить простой бейзлайн"
    - "Подобрать модель и гиперпараметры на валидации или кросс-валидации"
    - "Один раз оценить итоговую модель на тестовой выборке"
    - "Выкатить модель и настроить мониторинг качества"

