# Frontend · HTTP и API (§10.2). Формат: content/templates/README.md

- id: fe.http.status_scenario
  specializations: [frontend]
  topic: http_api
  skills: [http, rest]
  kind: single_choice
  irt: {a: 1.0, b: -1.0}
  generator: frontend.http_status_scenario

- id: fe.http.fetch_http_error
  specializations: [frontend]
  topic: http_api
  skills: [javascript, http]
  kind: single_choice
  irt: {a: 1.2, b: -0.6}
  params:
    code: {choice: ["400", "404", "500", "503"]}
    path: {choice: [/api/orders, /api/profile, /api/search, /api/cart]}
  stem_variants:
    - "Код вызывает fetch('{{path}}'), сервер отвечает статусом {{code}}. Что произойдёт с промисом, который вернул fetch?"
    - "await fetch('{{path}}') получил ответ с кодом {{code}}. Как поведёт себя промис fetch?"
  options:
    correct:
      - "Промис выполнится (fulfilled), а response.ok будет false"
    wrong:
      - "Промис отклонится с TypeError"
      - "Промис отклонится с ошибкой, в которой есть статус {{code}}"
      - "Промис выполнится, и response.ok будет true, раз ответ получен"
      - "Промис не завершится, пока не истечёт таймаут"

