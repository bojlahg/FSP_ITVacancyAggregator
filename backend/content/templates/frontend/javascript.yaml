- id: fe.js.ts_type_system
  specializations: [frontend]
  topic: javascript
  skills: [typescript]
  kind: multi_choice
  irt: {a: 1.2, b: 0.9}
  n_options: 5
  params:
    type: {choice: [User, Order, Invoice, Session]}
  stem_variants:
    - "Команда описывает тип {{type}} в TypeScript. Какие утверждения о системе типов TypeScript верны?"
    - "На ревью обсуждают, как TypeScript проверяет значения типа {{type}}. Какие утверждения верны?"
  options:
    correct:
      - "Типы стираются при компиляции и недоступны во время выполнения"
      - "Совместимость структурная: объект с нужными полями подходит под {{type}} без явного implements"
      - "Значение типа unknown нельзя использовать без сужения типа (проверки или утверждения)"
      - "Если в switch обработаны все варианты объединения, в ветке default значение имеет тип never"
    wrong:
      - "any и unknown эквивалентны: оба отключают проверку типов"
      - "Проверку x instanceof {{type}} можно применить, если {{type}} объявлен как interface"
      - "readonly-свойство защищено и во время выполнения: компилятор замораживает объект"
      - "Объектный литерал с лишним свойством всегда принимается, если обязательные поля на месте"

