- id: fe.js.promise_combinators
  specializations: [frontend]
  topic: javascript
  skills: [javascript, concurrency]
  kind: multi_choice
  irt: {a: 1.2, b: 0.6}
  n_options: 5
  params:
    n: {int: [3, 6]}
    what: {choice: [загрузка виджетов дашборда, запросы к нескольким зеркалам API, загрузка файлов, проверка нескольких сервисов]}
  stem: >-
    Приложение параллельно запускает промисы ({{what}}, всего {{n}}), и один из них отклоняется. Какие
    утверждения о комбинаторах промисов верны?
  options:
    correct:
      - "Promise.all отклоняется с причиной первого отклонённого промиса"
      - "Promise.allSettled выполняется массивом объектов { status, value } или { status, reason }"
      - "Promise.race завершается так же, как первый завершившийся промис — успехом или ошибкой"
      - "Promise.any отклоняется с AggregateError, только если отклонены все промисы"
    wrong:
      - "Promise.all дожидается всех промисов и возвращает массив, где на месте отклонённого — объект ошибки"
      - "Promise.allSettled отклоняется, если хотя бы один промис отклонён"
      - "Promise.any возвращает первый завершившийся промис, даже если он отклонён"
      - "Promise.race игнорирует отклонённые промисы и ждёт первый успешный"

