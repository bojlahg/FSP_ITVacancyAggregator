- id: fe.web.stacking_context
  specializations: [frontend]
  topic: web_platform
  skills: [css]
  kind: multi_choice
  irt: {a: 1.2, b: 1.2}
  n_options: 5
  params:
    op: {choice: ["0.5", "0.9", "0.99"]}
    tr: {choice: ["translateZ(0)", "scale(1)", "rotate(0deg)"]}
    z: {choice: ["0", "1", "10"]}
  stem_variants:
    - "Какие объявления сами по себе создают новый контекст наложения (stacking context) у элемента?"
    - "Выпадающее меню с большим z-index оказывается под соседним блоком. Какие свойства родителя меню создают новый stacking context?"
  options:
    correct:
      - "opacity: {{op}}"
      - "transform: {{tr}}"
      - "position: fixed"
      - "isolation: isolate"
      - "position: relative; z-index: {{z}}"
    wrong:
      - "position: relative без z-index"
      - "display: flex (элемент не является flex-элементом)"
      - "overflow: hidden"
      - "float: left"
      - "margin: 0 auto"

