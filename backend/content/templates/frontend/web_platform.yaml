# Frontend · веб-платформа: HTML, CSS, браузер (§10.2). Формат: content/templates/README.md

- id: fe.web.semantic_button
  specializations: [frontend]
  topic: web_platform
  skills: [html]
  kind: single_choice
  irt: {a: 1.0, b: -1.4}
  params:
    label: {choice: ["Добавить в корзину", "Сохранить черновик", "Открыть фильтры", "Показать пароль", "Удалить комментарий", "Скопировать ссылку", "Развернуть описание", "Обновить список", "Закрыть уведомление", "Применить промокод"]}
    handler: {choice: [handle(), onAction(), toggle(), save(), run()]}
  stem_variants:
    - "Нужен элемент «{{label}}», который выполняет действие на странице (без перехода по адресу). Какая разметка корректна с точки зрения семантики и доступности?"
    - "Кнопка «{{label}}» запускает JavaScript-обработчик и никуда не ведёт. Какую разметку выбрать, чтобы она работала с клавиатуры и скринридеров без доработок?"
    - "Элемент «{{label}}» вызывает {{handler}} и не меняет адрес страницы. Какая разметка правильная?"
  options:
    correct:
      - "<button type=\"button\">{{label}}</button>"
    wrong:
      - "<div class=\"btn\" onclick=\"{{handler}}\">{{label}}</div>"
      - "<a href=\"#\">{{label}}</a>"
      - "<span role=\"button\">{{label}}</span> без tabindex и обработки клавиш"
      - "<p class=\"button\">{{label}}</p> с обработчиком click"
      - "<a onclick=\"{{handler}}\">{{label}}</a> без атрибута href"
      - "<div tabindex=\"0\" onclick=\"{{handler}}\">{{label}}</div> без role и обработки клавиш"

