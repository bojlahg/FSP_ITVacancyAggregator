- id: fe.web.container_queries
  specializations: [frontend]
  topic: web_platform
  skills: [css]
  kind: single_choice
  status: pilot
  irt: {a: 1.0, b: 0.6}
  params:
    width: {choice: [400, 480, 600, 720]}
    card: {choice: [product-card, user-card, news-card]}
  stem: >-
    Есть правило @container (min-width: {{width}}px) { .{{card}} { display: grid; } }. От чего зависит,
    применится ли оно к .{{card}}?
  options:
    correct:
      - "От ширины ближайшего предка с container-type: inline-size (или size)"
    wrong:
      - "От ширины окна браузера, как у @media (min-width: {{width}}px)"
      - "От ширины самого элемента .{{card}}"
      - "От ширины ближайшего предка с position: relative"
      - "От ширины родительского элемента, даже если container-type ни у кого не задан"

- id: fe.web.label_for_input
  specializations: [frontend]
  topic: web_platform
  skills: [html]
  kind: single_choice
  irt: {a: 1.0, b: -1.6}
  params:
    id: {choice: [field-1, main-input, user-field, form-field, entry, input-a, f-value]}
    label: {choice: [Почта, Телефон, Логин, Город, Промокод, Дата рождения, Компания, Пароль]}
  stem_variants:
    - "Нужно связать подпись «{{label}}» с полем ввода, чтобы клик по подписи ставил фокус в поле, а скринридер её зачитывал. Какая разметка это делает?"
    - "Какая разметка правильно связывает текст «{{label}}» с текстовым полем ввода?"
  options:
    correct:
      - "<label for=\"{{id}}\">{{label}}</label> <input id=\"{{id}}\" type=\"text\">"
    wrong:
      - "<label for=\"{{id}}\">{{label}}</label> <input name=\"{{id}}\" type=\"text\">"
      - "<label name=\"{{id}}\">{{label}}</label> <input name=\"{{id}}\" type=\"text\">"
      - "<span>{{label}}</span> <input id=\"{{id}}\" type=\"text\">"
      - "<input type=\"text\" placeholder=\"{{label}}\"> без label"
      - "<label id=\"{{id}}\">{{label}}</label> <input id=\"{{id}}\" type=\"text\">"

