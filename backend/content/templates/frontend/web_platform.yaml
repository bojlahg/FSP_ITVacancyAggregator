- id: fe.web.storage_properties
  specializations: [frontend]
  topic: web_platform
  skills: [javascript, html]
  kind: multi_choice
  irt: {a: 1.1, b: 0.0}
  n_options: 5
  params:
    data: {choice: [тему оформления, содержимое корзины, черновик комментария, выбранный язык интерфейса]}
  stem_variants:
    - "Команда выбирает, где хранить {{data}} в браузере. Какие утверждения о хранилищах верны?"
    - "Нужно сохранять {{data}} на стороне клиента. Какие утверждения о localStorage, sessionStorage и cookie верны?"
  options:
    correct:
      - "Значения в localStorage хранятся как строки, объекты нужно сериализовать"
      - "sessionStorage изолирован по вкладке: другая вкладка того же сайта видит своё хранилище"
      - "Cookie с флагом HttpOnly недоступна через document.cookie"
      - "localStorage доступен только страницам с тем же origin (схема, хост и порт)"
    wrong:
      - "Содержимое localStorage автоматически отправляется на сервер с каждым запросом"
      - "sessionStorage общий для всех вкладок одного сайта"
      - "Cookie с флагом Secure нельзя прочитать из JavaScript"
      - "localStorage очищается при закрытии вкладки"
      - "Объём localStorage не ограничен браузером"

- id: fe.web.event_propagation_order
  specializations: [frontend]
  topic: web_platform
  skills: [javascript, html]
  kind: ordering
  irt: {a: 1.2, b: 0.3}
  time_limit_sec: 120
  params:
    event: {choice: [click, pointerdown, mouseup, dblclick]}
    outer: {choice: ["form#checkout", "ul.menu", "div.modal", "nav#sidebar"]}
    target: {choice: ["button.submit", "a.link", "span.icon", "button#save"]}
  stem: >-
    Пользователь вызвал событие {{event}} на элементе {{target}}, который вложен в {{outer}}. На document,
    {{outer}} и {{target}} навешаны обработчики через addEventListener, на {{target}} — один обработчик.
    Расположите вызовы обработчиков в порядке срабатывания.
  order_items:
    - "document — обработчик с { capture: true }"
    - "{{outer}} — обработчик с { capture: true }"
    - "{{target}} — обработчик на целевом элементе"
    - "{{outer}} — обработчик без capture"
    - "document — обработчик без capture"

- id: fe.web.cascade_priority
  specializations: [frontend]
  topic: web_platform
  skills: [css]
  kind: ordering
  irt: {a: 1.2, b: 0.4}
  params:
    prop: {choice: [color, font-size, margin-top, background-color]}
    cls: {choice: [title, note, price, badge]}
    id: {choice: [hero, total, promo, header]}
  stem: >-
    На элемент <p id="{{id}}" class="{{cls}}"> действуют несколько объявлений свойства {{prop}}. Расположите
    источники по возрастанию приоритета в каскаде (последний побеждает).
  order_items:
    - "Стиль браузера по умолчанию (user-agent)"
    - "Правило .{{cls}} { {{prop}}: … } в CSS-файле автора"
    - "Правило #{{id}} { {{prop}}: … } в CSS-файле автора"
    - "Атрибут style=\"{{prop}}: …\" на самом элементе"
    - "Правило .{{cls}} { {{prop}}: … !important } в CSS-файле автора"

