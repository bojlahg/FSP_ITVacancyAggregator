- id: fe.web.render_pipeline_order
  specializations: [frontend]
  topic: web_platform
  skills: [html, css]
  kind: ordering
  irt: {a: 1.0, b: -0.8}
  params:
    page: {choice: [главной страницы, карточки товара, страницы статьи, личного кабинета, страницы оформления заказа, страницы поиска, ленты новостей, страницы входа]}
    kb: {int: [20, 240], step: 10}
  stem_variants:
    - "Расположите этапы первой отрисовки {{page}} (HTML — {{kb}} КБ) браузером в правильном порядке."
    - "Браузер получил HTML {{page}} размером {{kb}} КБ. В каком порядке выполняются этапы, пока пиксели не появятся на экране?"
    - "Пользователь открыл {{page}}, сервер отдал {{kb}} КБ HTML и CSS. Упорядочьте этапы конвейера рендеринга браузера."
  order_items:
    - "Разбор HTML и CSS: построение DOM и CSSOM"
    - "Построение дерева рендеринга (render tree)"
    - "Layout: расчёт размеров и положения элементов"
    - "Paint: отрисовка пикселей в слоях"
    - "Composite: сборка слоёв в итоговый кадр"

