- id: fe.ng.onpush_triggers
  specializations: [frontend]
  topic: stack
  stack_module: angular
  skills: [angular]
  kind: multi_choice
  irt: {a: 1.2, b: 1.2}
  n_options: 5
  params:
    comp: {choice: [PriceTagComponent, UserBadgeComponent, OrderRowComponent]}
    input: {choice: [product, user, order]}
  stem: >-
    Компонент {{comp}} использует ChangeDetectionStrategy.OnPush и получает @Input() {{input}} (объект).
    Сигналы не используются, приложение работает с Zone.js. В каких случаях Angular проверит его шаблон
    при ближайшем цикле обнаружения изменений?
  options:
    correct:
      - "Родитель передал в {{input}} новый объект (изменилась ссылка)"
      - "В шаблоне {{comp}} сработал обработчик DOM-события, например (click)"
      - "Через async pipe в шаблоне пришло новое значение"
      - "Код компонента вызвал ChangeDetectorRef.markForCheck()"
    wrong:
      - "Родитель изменил поле внутри объекта {{input}}, не меняя ссылку"
      - "Сработал setTimeout в стороннем сервисе, не связанном с компонентом"
      - "Изменилось обычное поле сервиса-синглтона, который внедрён в компонент"

- id: fe.ng.pure_pipe
  specializations: [frontend]
  topic: stack
  stack_module: angular
  skills: [angular]
  kind: multi_choice
  irt: {a: 1.1, b: 0.7}
  n_options: 5
  params:
    pipe: {choice: [sortBy, activeOnly, groupBy, topN, filterBy]}
    items: {choice: [orders, users, tasks, products, invoices]}
    arg: {choice: [field, status, limit, key]}
  stem_variants:
    - >-
      В шаблоне используется {{ {{items}} | {{pipe}}: {{arg}} }}, где {{pipe}} — собственный pipe с
      настройками по умолчанию (pure). {{items}} — массив, {{arg}} — строка. В каких случаях Angular
      заново вызовет transform?
    - >-
      Собственный pipe {{pipe}} объявлен без pure: false и применяется как {{items}} | {{pipe}}: {{arg}}
      ({{items}} — массив объектов, {{arg}} — строка). Какие изменения приведут к повторному вызову transform?
  options:
    correct:
      - "this.{{items}} = [...this.{{items}}, newItem] — присвоен новый массив"
      - "this.{{arg}} изменил значение на другую строку"
      - "this.{{items}} = this.{{items}}.filter(x => x.visible) — присвоен новый массив"
    wrong:
      - "this.{{items}}.push(newItem) — массив изменён на месте"
      - "Изменено поле одного из объектов внутри {{items}}"
      - "Сработал любой цикл обнаружения изменений, например клик в другом компоненте"
      - "this.{{items}}.sort() — массив отсортирован на месте"
