- id: fe.perf.initial_bundle
  specializations: [frontend]
  topic: performance
  skills: [javascript, vite, webpack]
  kind: multi_choice
  irt: {a: 1.1, b: -0.1}
  n_options: 5
  params:
    app: {choice: [интернет-магазин, админка, личный кабинет банка, сервис бронирования]}
    size: {choice: ["900 КБ", "1,4 МБ", "2 МБ"]}
  stem: >-
    Приложение ({{app}}) загружает {{size}} JavaScript при первом открытии страницы. Какие техники уменьшат объём
    JavaScript, загружаемого на старте?
  options:
    correct:
      - "Разделить код по маршрутам через динамический import()"
      - "Использовать ES-модули, чтобы сборщик выполнил tree shaking неиспользуемых экспортов"
      - "Собирать под современные браузеры без лишних полифилов"
      - "Лениво загружать тяжёлые компоненты (React.lazy, defineAsyncComponent)"
    wrong:
      - "Объединить все чанки в один файл"
      - "Заменить import на require() во всех модулях"
      - "Подключить тот же бандл с атрибутом defer"
      - "Перенести тег script из <head> в конец <body>"

- id: fe.perf.layout_triggers
  specializations: [frontend]
  topic: performance
  skills: [css, javascript]
  kind: multi_choice
  irt: {a: 1.2, b: 0.4}
  n_options: 5
  params:
    el: {choice: [карточки, модального окна, строки таблицы, баннера]}
    w: {int: [200, 600], step: 50}
    x: {int: [10, 200], step: 10}
  stem_variants:
    - "Анимация {{el}} подтормаживает. Какие изменения заставят браузер заново выполнить layout (reflow)?"
    - "Какие операции с элементом {{el}} требуют пересчёта геометрии (layout), а не только перерисовки или композиции?"
  options:
    correct:
      - "Изменение width на {{w}}px"
      - "Изменение font-size"
      - "Добавление нового элемента в DOM рядом с ним"
      - "Чтение offsetHeight сразу после изменения стилей, влияющих на размеры (принудительный layout)"
    wrong:
      - "Изменение transform: translateX({{x}}px)"
      - "Изменение opacity"
      - "Изменение color"
      - "Изменение background-color"

