- id: fe.perf.memory_leaks
  specializations: [frontend]
  topic: performance
  skills: [javascript, react]
  kind: multi_choice
  irt: {a: 1.2, b: 1.0}
  n_options: 5
  params:
    comp: {choice: [ChatWidget, LiveChart, Notifications, MapView]}
    event: {choice: [resize, scroll, online, message]}
  stem: >-
    В SPA память растёт при каждом открытии и закрытии компонента {{comp}}. Какие причины утечки
    возможны?
  options:
    correct:
      - "window.addEventListener('{{event}}', …) без removeEventListener при размонтировании"
      - "setInterval без clearInterval при размонтировании"
      - "Глобальный кэш Map, который только растёт и хранит ссылки на объекты"
      - "Ссылки на удалённые из DOM узлы в замыканиях или массивах (detached DOM)"
    wrong:
      - "Хранение данных в WeakMap с DOM-узлами в качестве ключей"
      - "Стрелочные функции в обработчиках событий"
      - "Большое количество CSS-классов на элементах"
      - "Объявление переменных через let вместо const"

- id: fe.perf.lcp_image
  specializations: [frontend]
  topic: performance
  skills: [html]
  kind: multi_choice
  irt: {a: 1.2, b: 1.3}
  n_options: 5
  params:
    img: {choice: [hero.jpg, banner.jpg, cover.png, promo.jpg]}
    page: {choice: [лендинга, карточки товара, главной страницы]}
  stem: >-
    LCP-элемент {{page}} — изображение {{img}} в первом экране, подключённое тегом <img loading="lazy">.
    LCP равен 4,1 с. Какие изменения ускорят LCP?
  options:
    correct:
      - "Убрать loading=\"lazy\" с этого изображения"
      - "Добавить fetchpriority=\"high\""
      - "Отдавать изображение подходящего размера в AVIF или WebP через srcset"
      - "Предзагрузить изображение через <link rel=\"preload\" as=\"image\">"
    wrong:
      - "Вставлять изображение из JavaScript после события load"
      - "Задать изображение фоном в CSS-файле, подключённом в конце <body>"
      - "Перенести изображение на отдельный домен без preconnect"
      - "Заменить <img> на элемент, который показывается после гидрации приложения"

- id: fe.perf.diagnose_slow_input
  specializations: [frontend]
  topic: performance
  skills: [react, javascript]
  kind: open_approach
  irt: {a: 1.0, b: 0.8}
  time_limit_sec: 600
  params:
    n: {choice: ["2 000", "5 000", "10 000"]}
    entity: {choice: [товаров, заказов, сотрудников]}
  stem: >-
    На странице со списком из {{n}} {{entity}} есть поле фильтра. При вводе каждый символ появляется с
    заметной задержкой, особенно на слабых ноутбуках. Опишите, как найдёте причину и какие решения
    рассмотрите.
  rubric:
    - "Сначала измеряет: Performance в DevTools или React Profiler, ищет долгие задачи и лишние рендеры"
    - Проверяет причину лишних перерисовок (состояние поднято слишком высоко, нестабильные props, отсутствие мемоизации)
    - Предлагает виртуализацию длинного списка
    - Предлагает отложить тяжёлую работу (debounce фильтрации, useDeferredValue или startTransition, Web Worker)
    - Подтверждает эффект повторным измерением после изменений

- id: fe.perf.lazy_images
  specializations: [frontend]
  topic: performance
  skills: [html]
  kind: single_choice
  irt: {a: 1.0, b: -1.2}
  params:
    page: {choice: [каталога, ленты новостей, галереи, страницы отзывов, блога]}
    n: {int: [30, 120], step: 10}
    img: {choice: [photo.webp, preview.jpg, thumb.avif, card.png]}
  stem_variants:
    - >-
      На странице {{page}} {{n}} изображений, большая часть ниже первого экрана. Какой атрибут тега
      <img src="{{img}}"> позволит браузеру не загружать их, пока пользователь не прокрутит страницу к ним?
    - >-
      Страница {{page}} при открытии сразу скачивает все {{n}} картинок вида {{img}}, хотя видны только первые.
      Что добавить к <img>, чтобы картинки вне экрана загружались отложенно?
  options:
    correct:
      - "loading=\"lazy\""
    wrong:
      - "defer"
      - "async"
      - "decoding=\"async\""
      - "fetchpriority=\"high\""
      - "preload=\"none\""

- id: fe.perf.yield_main_thread
  specializations: [frontend]
  topic: performance
  skills: [javascript]
  kind: multi_choice
  irt: {a: 1.2, b: 1.5}
  n_options: 5
  time_limit_sec: 120
  params:
    ms: {choice: [300, 400, 600, 800]}
    work: {choice: [пересчёт отчёта, разбор большого JSON, построение индекса поиска, сортировку таблицы]}
    n: {choice: ["50 000", "100 000", "200 000"]}
  stem_variants:
    - >-
      По клику выполняется {{work}} по {{n}} записям — одна синхронная задача на {{ms}} мс, интерфейс
      замирает, INP плохой. Какие изменения позволят браузеру обрабатывать ввод и отрисовывать кадры во время
      работы?
    - >-
      Задача «{{work}}» ({{n}} записей) занимает главный поток на {{ms}} мс одной задачей. Какие подходы реально
      дадут браузеру отрисовать кадр и обработать клики посреди этой работы?
  options:
    correct:
      - "Разбить работу на части и между ними уступать поток через макрозадачу (например, await new Promise(r => setTimeout(r, 0)))"
      - "Перенести вычисление в Web Worker и передавать результат через postMessage"
      - "Сначала отрисовать отклик на клик (индикатор), а тяжёлую работу запустить в следующей задаче"
    wrong:
      - "Разбить работу на части и запускать каждую через Promise.resolve().then(...)"
      - "Разбить работу на части и запускать каждую через queueMicrotask"
      - "Объявить функцию async без других изменений: она станет выполняться в фоне"
      - "Обернуть вычисление в requestAnimationFrame: тогда оно не блокирует отрисовку"
