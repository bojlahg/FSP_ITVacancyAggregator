# Frontend · стек-модуль react (§10.2). Формат: content/templates/README.md

- id: fe.react.index_as_key
  specializations: [frontend]
  topic: stack
  stack_module: react
  skills: [react]
  kind: single_choice
  irt: {a: 1.1, b: -0.9}
  params:
    items: {choice: [задач, комментариев, позиций заказа, участников, товаров, вложений, получателей]}
    op: {choice: [удаляет первый элемент, добавляет элемент в начало, сортирует список по дате, удаляет элемент из середины, перемещает элемент перетаскиванием, фильтрует список]}
  stem_variants:
    - >-
      Список {{items}} рендерится через map с key={index}, в каждой строке есть поле ввода со своим
      состоянием. Пользователь {{op}}. Что может пойти не так?
    - >-
      Строки списка {{items}} — компоненты с собственным useState, ключ — индекс в массиве. Что произойдёт,
      когда пользователь {{op}}?
  options:
    correct:
      - "Состояние и DOM полей привяжутся не к тем элементам: ключи сместятся вместе с индексами"
    wrong:
      - "React выбросит ошибку о повторяющихся ключах"
      - "Список перестанет обновляться до перезагрузки страницы"
      - "Ничего: индекс — рекомендуемый key для изменяемых списков"
      - "React при каждом рендере размонтирует и смонтирует заново весь список"
      - "Состояние всех строк сбросится к начальным значениям"
      - "React автоматически заменит индексы на стабильные id элементов"

