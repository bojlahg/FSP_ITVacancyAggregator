- id: fe.react.effects_commit_order
  specializations: [frontend]
  topic: stack
  stack_module: react
  skills: [react]
  kind: ordering
  irt: {a: 1.2, b: 1.4}
  time_limit_sec: 150
  params:
    parent: {choice: [App, Dashboard, CheckoutPage, ProfilePage, Layout, SettingsPage, OrdersPage, Inbox]}
    child: {choice: [Chart, Avatar, PriceTag, Sidebar, Tooltip, OrderList, SearchBox, Toolbar]}
  stem_variants:
    - >-
      Родитель {{parent}} рендерит дочерний {{child}}. Оба используют useLayoutEffect и useEffect (по одному
      вызову). Production-сборка, без StrictMode. Расположите вызовы при первом монтировании в правильном порядке.
    - >-
      В {{parent}} и в его дочернем {{child}} есть по одному useLayoutEffect и useEffect. Упорядочьте, что
      выполнит React при первом монтировании дерева (production, без StrictMode).
  order_items:
    - "{{parent}}: вызов функции компонента (render)"
    - "{{child}}: вызов функции компонента (render)"
    - "{{child}}: useLayoutEffect"
    - "{{parent}}: useLayoutEffect"
    - "{{child}}: useEffect"
    - "{{parent}}: useEffect"

- id: fe.react.transition_semantics
  specializations: [frontend]
  topic: stack
  stack_module: react
  skills: [react]
  kind: multi_choice
  irt: {a: 1.2, b: 1.6}
  n_options: 5
  time_limit_sec: 120
  params:
    list: {choice: [товаров, сотрудников, заказов, писем, вакансий]}
    n: {choice: ["5 000", "10 000", "20 000"]}
  stem_variants:
    - >-
      Поле фильтра управляет списком из {{n}} {{list}}. Обновление фильтрованного списка обёрнуто в
      startTransition (useTransition), значение самого поля — обычный setState. Какие утверждения верны?
    - >-
      Чтобы ввод не тормозил при фильтрации {{n}} {{list}}, пересчёт результатов перенесли в
      startTransition. Какие утверждения о переходах (transitions) в React верны?
  options:
    correct:
      - "Срочное обновление (ввод в поле) может прервать незавершённый рендер перехода, и React начнёт его заново"
      - "isPending из useTransition равен true, пока обновление перехода не применено"
      - "Колбэк, переданный в startTransition, вызывается сразу и синхронно; откладывается рендер с его обновлениями"
      - "Пока переход не завершён, на экране остаётся предыдущий результат, а не промежуточные состояния"
    wrong:
      - "startTransition откладывает вызов колбэка, как setTimeout с нулевой задержкой"
      - "Обновления внутри startTransition рендерятся в Web Worker и не занимают главный поток"
      - "Значение контролируемого поля ввода тоже следует обновлять внутри startTransition"
      - "startTransition делает рендер списка быстрее за счёт кэширования результатов"
      - "Переход гарантирует, что каждое промежуточное значение фильтра будет отрисовано"

