- id: fe.react.controlled_input
  specializations: [frontend]
  topic: stack
  stack_module: react
  skills: [react]
  kind: single_choice
  irt: {a: 1.0, b: -0.7}
  params:
    state: {choice: [query, email, title, city]}
  stem: >-
    В компоненте написано <input value={{{state}}} /> без onChange и без readOnly, {{state}} хранится в
    useState. Что произойдёт, когда пользователь попытается ввести текст?
  options:
    correct:
      - "Значение поля не изменится, а React предупредит в консоли о value без onChange"
    wrong:
      - "Поле будет меняться, а {{state}} обновится автоматически"
      - "Поле будет меняться, но {{state}} останется прежним"
      - "React выбросит исключение и размонтирует компонент"
      - "Поле станет неконтролируемым, и React перестанет управлять его значением"

- id: fe.react.hooks_rules
  specializations: [frontend]
  topic: stack
  stack_module: react
  skills: [react]
  kind: multi_choice
  irt: {a: 1.1, b: -0.6}
  n_options: 5
  params:
    comp: {choice: [ProductCard, UserMenu, OrderForm, Dashboard]}
  stem: "Какие вызовы хуков в компоненте {{comp}} нарушают правила хуков React?"
  options:
    correct:
      - "useState внутри if (isOpen) { … }"
      - "useEffect внутри цикла for по элементам списка"
      - "useContext внутри обработчика onClick"
      - "useMemo после раннего return null"
    wrong:
      - "useState на верхнем уровне {{comp}}"
      - "useEffect внутри собственного хука useFetch, вызванного на верхнем уровне"
      - "Несколько вызовов useState подряд на верхнем уровне"
      - "useRef в компоненте, обёрнутом в React.memo"

