- id: fe.react.effect_cleanup_order
  specializations: [frontend]
  topic: stack
  stack_module: react
  skills: [react]
  kind: ordering
  irt: {a: 1.2, b: 0.5}
  params:
    dep: {choice: [roomId, userId, channel, symbol]}
    comp: {choice: [ChatRoom, Profile, Ticker, Feed]}
  stem: >-
    Компонент {{comp}} подписывается в useEffect(() => { subscribe({{dep}}); return () => unsubscribe({{dep}}); },
    [{{dep}}]). Родитель передал новое значение {{dep}}. Расположите события в порядке выполнения.
  order_items:
    - "React вызывает функцию {{comp}} с новым {{dep}} (render)"
    - "React применяет изменения к DOM (commit)"
    - "Выполняется cleanup предыдущего эффекта: unsubscribe со старым {{dep}}"
    - "Выполняется эффект: subscribe с новым {{dep}}"

- id: fe.react.memo_rerender
  specializations: [frontend]
  topic: stack
  stack_module: react
  skills: [react]
  kind: multi_choice
  irt: {a: 1.2, b: 1.0}
  n_options: 5
  params:
    comp: {choice: [PriceTable, UserList, ChartPanel, OrderRow]}
  stem: >-
    Компонент {{comp}} обёрнут в React.memo, но перерисовывается при каждом рендере родителя. Какие
    причины возможны?
  options:
    correct:
      - "Родитель передаёт объект или массив, созданный литералом прямо в JSX"
      - "Родитель передаёт функцию, которая создаётся заново без useCallback"
      - "{{comp}} читает контекст через useContext, а value провайдера — новый объект на каждом рендере"
    wrong:
      - "React.memo сравнивает props глубоко, и сравнение всегда находит различия"
      - "React.memo действует только в development-сборке"
      - "React.memo несовместим с компонентами, у которых есть useState"
      - "Функции в props сравниваются по исходному коду, а он формируется заново"

