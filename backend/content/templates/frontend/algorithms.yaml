# Frontend · алгоритмы и структуры данных (§10.2). Формат: content/templates/README.md

- id: fe.algo.collection_complexity
  specializations: [frontend]
  topic: algorithms
  skills: [algorithms, data_structures, javascript]
  kind: multi_choice
  irt: {a: 1.1, b: -0.9}
  n_options: 5
  params:
    n: {choice: ["10 тысяч", "100 тысяч", "1 миллион"]}
    arr: {choice: [ids, users, tags, prices]}
  stem: >-
    Массив {{arr}} и Set с теми же значениями содержат {{n}} элементов. Какие оценки средней сложности
    операций верны?
  options:
    correct:
      - "{{arr}}.includes(x) — O(n)"
      - "set.has(x) — O(1) в среднем"
      - "Доступ по индексу {{arr}}[i] — O(1)"
      - "Вложенный цикл по двум массивам длиной n и m — O(n·m)"
    wrong:
      - "{{arr}}.includes(x) — O(log n)"
      - "set.has(x) — O(n)"
      - "{{arr}}.push(x) — O(n) в среднем"
      - "{{arr}}.sort() — O(n)"

