- id: fe.algo.dedupe_complexity
  specializations: [frontend]
  topic: algorithms
  skills: [algorithms, javascript]
  kind: multi_choice
  irt: {a: 1.1, b: 0.2}
  n_options: 5
  params:
    n: {choice: ["50 тысяч", "200 тысяч", "1 миллион"]}
    what: {choice: [идентификаторов, email-адресов, тегов]}
  stem: "Нужно удалить дубликаты из массива {{what}} длиной {{n}}. Какие оценки сложности верны?"
  options:
    correct:
      - "[...new Set(arr)] — O(n) в среднем"
      - "arr.filter((x, i) => arr.indexOf(x) === i) — O(n²)"
      - "Сортировка и один проход по соседним элементам — O(n log n)"
    wrong:
      - "arr.filter((x, i) => arr.indexOf(x) === i) — O(n)"
      - "Сортировка и один проход по соседним элементам — O(n)"
      - "[...new Set(arr)] — O(n²)"
      - "arr.reduce с проверкой acc.includes(x) — O(n)"

