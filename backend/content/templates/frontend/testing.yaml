- id: fe.test.debounced_search
  specializations: [frontend]
  topic: testing
  skills: [jest, unit_testing]
  kind: multi_choice
  irt: {a: 1.1, b: 0.5}
  n_options: 5
  params:
    ms: {choice: [300, 400, 500]}
    comp: {choice: [SearchBox, CitySelect, ProductFilter]}
  stem: >-
    Компонент {{comp}} отправляет запрос к API через debounce {{ms}} мс после ввода. В тесте включены
    фейковые таймеры (vi.useFakeTimers() или jest.useFakeTimers()). Какие действия делают тест
    корректным и быстрым?
  options:
    correct:
      - "Продвинуть время на {{ms}} мс через vi.advanceTimersByTime или jest.advanceTimersByTime"
      - "Подменить сетевой слой (MSW или мок fetch), чтобы не ходить в реальный API"
      - "Проверять отправку запроса после продвижения таймеров, а не сразу после ввода"
    wrong:
      - "Сразу после ввода синхронно проверить, что запрос уже отправлен"
      - "Ждать реальные {{ms}} мс через await new Promise(r => setTimeout(r, {{ms}})) при включённых фейковых таймерах"
      - "Увеличить таймаут теста до 30 секунд"
      - "Убрать debounce из кода компонента, чтобы тест проходил"

- id: fe.test.flaky_e2e
  specializations: [frontend]
  topic: testing
  skills: [playwright, test_automation]
  kind: multi_choice
  irt: {a: 1.2, b: 1.0}
  n_options: 5
  params:
    flow: {choice: [оформления заказа, регистрации, оплаты подписки, загрузки аватара]}
    pct: {choice: ["5%", "10%", "15%"]}
  stem: >-
    E2E-тест сценария {{flow}} на Playwright падает примерно в {{pct}} запусков без изменений кода.
    Какие причины нестабильности типичны?
  options:
    correct:
      - "Фиксированные паузы (waitForTimeout, sleep) вместо ожидания нужного состояния"
      - "Тесты зависят от общего состояния и порядка выполнения"
      - "Тест обращается к реальному внешнему API с нестабильными ответами"
      - "Селекторы привязаны к сгенерированным CSS-классам, которые меняются между сборками"
    wrong:
      - "Поиск элементов через getByRole и доступное имя"
      - "Проверки через expect(locator).toBeVisible() с автоматическим ожиданием"
      - "Запуск каждого теста в отдельном browser context"
      - "Подготовка тестовых данных через API перед тестом"

- id: fe.test.tobe_vs_toequal
  specializations: [frontend]
  topic: testing
  skills: [jest, unit_testing]
  kind: single_choice
  irt: {a: 1.0, b: -1.4}
  params:
    fn: {choice: [createUser, buildOrder, parseQuery, toDto, mapAddress, makeCartItem]}
    field: {choice: [id, count, page, qty, total]}
    n: {int: [1, 50]}
    lib: {choice: [Jest, Vitest]}
  stem_variants:
    - >-
      Функция {{fn}}() каждый раз возвращает новый объект. В тесте на {{lib}} нужно проверить, что результат
      равен { {{field}}: {{n}}, active: true } по содержимому. Какая проверка подходит?
    - >-
      {{fn}}() создаёт и возвращает объект { {{field}}: {{n}}, active: true }. Какой матчер {{lib}} корректно
      сравнит результат с ожидаемым объектом?
  options:
    correct:
      - "expect({{fn}}()).toEqual({ {{field}}: {{n}}, active: true })"
    wrong:
      - "expect({{fn}}()).toBe({ {{field}}: {{n}}, active: true })"
      - "expect({{fn}}() === { {{field}}: {{n}}, active: true }).toBe(true)"
      - "expect({{fn}}()).toBeTruthy()"
      - "expect({{fn}}()).toHaveLength(2)"
      - "expect({{fn}}()).toBe('[object Object]')"

- id: fe.test.snapshot_tests
  specializations: [frontend]
  topic: testing
  skills: [jest, unit_testing, react]
  kind: multi_choice
  irt: {a: 1.1, b: 0.4}
  n_options: 5
  params:
    comp: {choice: [ProductCard, UserMenu, OrderTable, Header, PriceBadge, Pagination]}
    lib: {choice: [Jest, Vitest]}
  stem_variants:
    - "Команда покрывает компонент {{comp}} snapshot-тестами в {{lib}} (toMatchSnapshot). Какие утверждения верны?"
    - "Для {{comp}} добавили expect(container).toMatchSnapshot() в {{lib}}. Какие утверждения о snapshot-тестах верны?"
  options:
    correct:
      - "Тест падает при любом изменении разметки {{comp}}, в том числе намеренном, и снимок приходится обновлять"
      - "Снимок фиксирует результат рендера, но сам по себе не проверяет поведение (клики, ввод, запросы)"
      - "Изменения в файле снимка нужно просматривать на ревью, иначе ошибка попадёт в эталон"
      - "Большие снимки редко читают внимательно, поэтому их ценность падает"
    wrong:
      - "Snapshot-тест сравнивает скриншоты {{comp}} попиксельно в реальном браузере"
      - "Снимки обновляются автоматически при каждом прогоне в CI"
      - "Snapshot-тест проверяет, что {{comp}} корректно обрабатывает клики"
      - "Если снимок не совпал, тест пропускается с предупреждением"
