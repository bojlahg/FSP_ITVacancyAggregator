# Frontend · тестирование (§10.2). Формат: content/templates/README.md

- id: fe.test.mock_called_times
  specializations: [frontend]
  topic: testing
  skills: [jest, unit_testing]
  kind: single_choice
  irt: {a: 1.0, b: -1.2}
  params:
    fn: {choice: [onSave, onSubmit, onSelect, onClose, trackEvent]}
    n: {int: [2, 4]}
    lib: {choice: [Jest, Vitest]}
  stem: >-
    В тесте на {{lib}} колбэк {{fn}} — мок-функция (jest.fn() или vi.fn()). Нужно проверить, что он был
    вызван ровно {{n}} раза. Какая проверка это делает?
  options:
    correct:
      - "expect({{fn}}).toHaveBeenCalledTimes({{n}})"
    wrong:
      - "expect({{fn}}).toBe({{n}})"
      - "expect({{fn}}).toHaveLength({{n}})"
      - "expect({{fn}}).toHaveBeenCalledWith({{n}})"
      - "expect({{fn}}()).toEqual({{n}})"

