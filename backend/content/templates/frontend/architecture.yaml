# Frontend · архитектура (§10.2). Формат: content/templates/README.md

- id: fe.arch.prop_drilling
  specializations: [frontend]
  topic: architecture
  skills: [react, design_patterns]
  kind: single_choice
  irt: {a: 1.0, b: -1.0}
  params:
    prop: {choice: [currentUser, theme, locale, permissions]}
    n: {choice: [3 уровня, 4 уровня, 5 уровней, 6 уровней]}
  stem: >-
    Значение {{prop}} передаётся через props на {{n}} вниз, и промежуточные компоненты сами его не
    используют. Как называется проблема и что обычно применяют?
  options:
    correct:
      - "Prop drilling; применяют контекст (Context, provide/inject) или композицию компонентов"
    wrong:
      - "Tree shaking; применяют динамический import()"
      - "Гидрация; применяют серверный рендеринг"
      - "Мемоизация; применяют useMemo в каждом промежуточном компоненте"
      - "Race condition; применяют AbortController"

