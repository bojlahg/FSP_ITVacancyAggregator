- id: ops.linux.uncatchable_signal
  specializations: [devops]
  topic: linux
  skills: [linux]
  kind: single_choice
  irt: {a: 1.1, b: -0.9}
  params:
    proc: {choice: [nginx, postgres, java, python3, node, gunicorn]}
  stem_variants:
    - "Какой сигнал процесс {{proc}} не может ни перехватить, ни проигнорировать?"
    - "Процесс {{proc}} установил обработчики для всех сигналов, какие смог. Какой из перечисленных сигналов он всё равно не сможет перехватить или проигнорировать?"
  options:
    correct: [SIGKILL, SIGSTOP]
    wrong: [SIGTERM, SIGINT, SIGHUP, SIGQUIT, SIGUSR1, SIGTSTP]

