- id: ops.linux.inode_exhaustion
  specializations: [devops]
  topic: linux
  skills: [linux]
  kind: single_choice
  irt: {a: 1.3, b: 0.2}
  params:
    free: {int: [25, 60], step: 5}
    mount: {choice: [/var, /data, /srv, /home]}
    app: {choice: [кэш сессий PHP, очередь писем, генератор миниатюр, сборщик логов]}
  stem_variants:
    - "Запись в {{mount}} падает с ошибкой «No space left on device», хотя df -h показывает {{free}}% свободного места. В каталоге работает {{app}}, создающий множество мелких файлов. Какая причина наиболее вероятна?"
    - "Процесс «{{app}}» не может создать файл в {{mount}}: «No space left on device». При этом df -h сообщает, что свободно {{free}}% объёма. Что проверить в первую очередь?"
  options:
    correct:
      - "Закончились inode: проверить df -i"
    wrong:
      - "Файловая система смонтирована только для чтения"
      - "У процесса нет прав на запись в каталог"
      - "Превышен лимит открытых файлов (ulimit -n)"
      - "Удалённый файл всё ещё открыт процессом и занимает место"
      - "df -h показывает устаревшие данные: нужно выполнить sync"

