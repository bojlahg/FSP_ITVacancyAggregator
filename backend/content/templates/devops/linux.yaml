  stem_variants:
    - "Какой сигнал процесс {{proc}} не может ни перехватить, ни проигнорировать?"
    - "Процесс {{proc}} установил обработчики для всех сигналов, какие смог. Какой из перечисленных сигналов он всё равно не сможет перехватить или проигнорировать?"
