- id: ops.iac.ansible_handlers
  specializations: [devops]
  topic: cloud_iac
  skills: [ansible]
  kind: single_choice
  irt: {a: 1.1, b: 0.3}
  params:
    svc: {choice: [nginx, haproxy, postgresql, redis, chrony, filebeat]}
    k: {choice: [две, три, четыре]}
    group: {choice: [web, lb, db, app, monitoring]}
  stem_variants:
    - "В плейбуке для группы {{group}} {{k}} задачи меняют разные конфиги {{svc}}, и каждая содержит notify: restart {{svc}}. При запуске все они изменили файлы (changed). Сколько раз и когда выполнится handler restart {{svc}}?"
    - "Задачи плейбука ({{k}} шт., хосты {{group}}) правят шаблоны {{svc}} и уведомляют один и тот же handler restart {{svc}}. Все они вернули changed. Как поведёт себя handler?"
  options:
    correct:
      - "Один раз, в конце play (после всех задач), если его не вызвали раньше через meta: flush_handlers"
    wrong:
      - "Сразу после каждой задачи, вызвавшей notify, — столько раз, сколько было уведомлений"
      - "Один раз, сразу после первой задачи, вызвавшей notify"
      - "Ни разу: handler выполняется только с флагом --handlers"
      - "Один раз, но только при следующем запуске плейбука"
      - "По одному разу на каждый изменённый файл, в конце play"

- id: ops.iac.moved_block
  specializations: [devops]
  topic: cloud_iac
  skills: [terraform]
  kind: single_choice
  irt: {a: 1.2, b: 0.7}
  params:
    type: {choice: [yandex_compute_instance, aws_instance, yandex_vpc_network, aws_s3_bucket, yandex_mdb_postgresql_cluster]}
    old: {choice: [main, this, default, server]}
    new: {choice: [primary, app, backend, core]}
  stem_variants:
    - "В конфигурации ресурс {{type}}.{{old}} переименовали в {{type}}.{{new}}, больше ничего не меняли. terraform plan показывает уничтожение старого и создание нового ресурса. Как переименовать без пересоздания?"
    - "После рефакторинга адрес ресурса сменился с {{type}}.{{old}} на {{type}}.{{new}}, и plan хочет удалить и заново создать реальный объект в облаке. Что сделать?"
  options:
    correct:
      - "Добавить блок moved { from = {{type}}.{{old}}, to = {{type}}.{{new}} } (или выполнить terraform state mv), чтобы перенести объект в state на новый адрес"
    wrong:
      - "Добавить lifecycle { create_before_destroy = true }: тогда ресурс не пересоздастся"
      - "Выполнить terraform import {{type}}.{{new}} без удаления старой записи из state"
      - "Выполнить terraform refresh: Terraform сопоставит ресурсы по атрибутам"
      - "Добавить lifecycle { prevent_destroy = true }: plan станет пустым"
      - "Ничего: при apply Terraform поймёт, что это тот же ресурс, и только обновит state"
