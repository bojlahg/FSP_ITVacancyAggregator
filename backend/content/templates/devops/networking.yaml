# DevOps · сети (§10.2). Формат: content/templates/README.md

- id: ops.net.service_port
  specializations: [devops]
  topic: networking
  skills: [networking]
  kind: single_choice
  irt: {a: 0.9, b: -1.5}
  generator: devops.service_port

- id: ops.net.request_lifecycle
  specializations: [devops]
  topic: networking
  skills: [networking, http]
  kind: ordering
  irt: {a: 1.0, b: -0.9}
  params:
    host: {choice: [api.shop.example, itscout.test, status.corp.example, cdn.media.example, pay.bank.example, docs.service.example]}
    path: {choice: [health, api/v1/orders, login, metrics, api/v2/users, static/app.js]}
    method: {choice: [GET, POST, HEAD]}
    tool: {choice: [curl, wget, "клиент на Python (requests)", "сервис на Go (net/http)"]}
  stem_variants:
    - "{{tool}} выполняет запрос {{method}} https://{{host}}/{{path}} (без прокси, DNS-кэш пуст, новое соединение, HTTP/1.1 или HTTP/2). Расположите этапы в порядке их выполнения."
    - "Что происходит, когда {{tool}} делает {{method}} https://{{host}}/{{path}}? Прокси нет, в кэше DNS ничего нет, соединение новое. Расположите этапы по порядку."
  order_items:
    - "Разрешение имени {{host}} в IP-адрес через DNS"
    - "TCP-рукопожатие (SYN, SYN-ACK, ACK) с портом 443"
    - "TLS-рукопожатие и проверка сертификата {{host}}"
    - "Отправка HTTP-запроса {{method}} /{{path}}"
    - "Получение HTTP-ответа от сервера"

- id: ops.net.cidr_hosts
  specializations: [devops]
  topic: networking
  skills: [networking]
  kind: numeric
  irt: {a: 1.2, b: -0.8}
  params:
    p: {int: [20, 29]}
    a: {int: [0, 255]}
  stem_variants:
    - "Сколько адресов можно назначить хостам в сети 10.{{a}}.0.0/{{p}}? Сетевой и широковещательный адреса не считаются."
    - "Для сегмента выделена подсеть 10.{{a}}.0.0/{{p}}. Сколько в ней адресов, пригодных для хостов (без адреса сети и broadcast)?"
  answer:
    expr: "2 ** (32 - {{p}}) - 2"
    tolerance: 0

