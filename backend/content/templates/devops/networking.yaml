- id: ops.net.time_wait
  specializations: [devops]
  topic: networking
  skills: [networking]
  kind: single_choice
  irt: {a: 1.2, b: 1.0}
  params:
    app: {choice: [nginx, HAProxy, сервис заказов, API-шлюз]}
    count: {int: [8, 40], step: 4}
  stem_variants:
    - "На хосте ({{app}}) netstat показывает около {{count}} 000 TCP-соединений в состоянии TIME_WAIT. Какая сторона TCP-соединения попадает в TIME_WAIT?"
    - "Мониторинг хоста ({{app}}) показывает около {{count}} 000 сокетов в TIME_WAIT. Для какой стороны соединения характерно это состояние?"
  options:
    correct:
      - "Для стороны, которая первой закрыла соединение (активное закрытие, первой отправила FIN)"
    wrong:
      - "Для стороны, которая первой получила FIN"
      - "Всегда для сервера, принимающего соединения"
      - "Всегда для клиента, открывшего соединение"
      - "Для стороны, которая отправила RST"

- id: ops.net.cname_apex
  specializations: [devops]
  topic: networking
  skills: [networking]
  kind: single_choice
  irt: {a: 1.1, b: 1.1}
  params:
    domain: {choice: [shop.example, itscout.test, media.example, corp.example, travel.example, bank.example]}
    lb: {choice: [lb-1234.cloud.example, edge.cdn.example, ingress.k8s.example, d1x2.cloudfront.example, site.pages.example]}
  stem_variants:
    - "Почему для вершины зоны {{domain}} нельзя создать запись CNAME на {{lb}}, а для www.{{domain}} — можно?"
    - "DNS-провайдер отказывается создать CNAME {{domain}} → {{lb}}, но спокойно создаёт CNAME www.{{domain}} → {{lb}}. В чём причина?"
  options:
    correct:
      - "CNAME не может сосуществовать с другими записями того же имени, а у вершины зоны обязательно есть записи SOA и NS"
    wrong:
      - "CNAME может указывать только на IP-адрес, а не на имя"
      - "CNAME запрещён для доменов второго уровня регистратором"
      - "Для вершины зоны допустимы только записи A и AAAA"
      - "CNAME на вершине зоны создаёт цикл при разрешении имени"
      - "CNAME не может указывать на имя в другой зоне, а {{lb}} — чужая зона"
      - "Для вершины зоны CNAME возможен, но только с TTL не меньше суток"

- id: ops.net.close_wait
  specializations: [devops]
  topic: networking
  skills: [networking, linux]
  kind: single_choice
  irt: {a: 1.2, b: 1.4}
  params:
    app: {choice: [сервис заказов, воркер отчётов, API-шлюз, сервис уведомлений, сервис платежей, агрегатор цен]}
    dep: {choice: [PostgreSQL, Redis, внешнему API банка, Elasticsearch, Kafka, сервису авторизации]}
    count: {int: [2, 30]}
  stem_variants:
    - "У процесса «{{app}}» копится около {{count}} 000 соединений к {{dep}} в состоянии CLOSE_WAIT, и со временем заканчиваются файловые дескрипторы. Что это означает?"
    - "ss -tan показывает у «{{app}}» тысячи сокетов CLOSE_WAIT к {{dep}} (около {{count}} 000), число растёт до перезапуска процесса. В чём причина?"
  options:
    correct:
      - "Удалённая сторона закрыла соединение (прислала FIN), а приложение не закрывает свой сокет — утечка соединений в коде"
    wrong:
      - "Это нормальное ожидание 2×MSL после активного закрытия соединения"
      - "Нужно уменьшить net.ipv4.tcp_fin_timeout, и ядро само закроет эти сокеты"
      - "Удалённая сторона не отвечает на SYN, и ядро повторяет попытки"
      - "Пакеты теряются, и соединения ждут повторной передачи данных"
      - "Это соединения, которые приложение закрыло первым, а {{dep}} ещё не подтвердил FIN"
      - "Переполнена очередь accept: ядро держит соединения до вызова accept()"

