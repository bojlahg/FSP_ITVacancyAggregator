- id: ops.net.mtu_blackhole
  specializations: [devops]
  topic: networking
  skills: [networking]
  kind: single_choice
  irt: {a: 1.1, b: 1.6}
  params:
    host: {choice: [api.partner.example, git.corp.example, registry.internal, db.dc2.internal]}
    tunnel: {choice: [IPsec-туннель, WireGuard-VPN, GRE-туннель, VXLAN-оверлей]}
    size: {choice: [1400, 1420, 1450, 1380]}
  stem_variants:
    - "Через {{tunnel}} до {{host}}: ping и TCP-рукопожатие проходят, мелкие запросы работают, но TLS-рукопожатие и крупные ответы зависают. ping -M do -s {{size}} {{host}} не проходит, а ping с маленьким размером проходит. Какая причина наиболее вероятна?"
    - "Трафик к {{host}} пошёл через {{tunnel}}. Соединения устанавливаются, curl получает заголовки маленьких ответов, но большие передачи и TLS-рукопожатие с длинной цепочкой сертификатов висят до таймаута. Что проверить в первую очередь?"
  options:
    correct:
      - "MTU в туннеле меньше 1500, а ICMP «fragmentation needed» где-то отбрасывается, и Path MTU Discovery не работает; нужно уменьшить MTU или MSS (MSS clamping)"
    wrong:
      - "Сервер {{host}} ограничивает размер TLS-записей; нужно включить TLS 1.3"
      - "Переполнена таблица ARP на шлюзе туннеля"
      - "DNS отдаёт разные адреса для маленьких и больших запросов"
      - "TCP window scaling отключён, поэтому большие ответы не помещаются в окно"
      - "Включён Nagle, и большие пакеты задерживаются до таймаута"
