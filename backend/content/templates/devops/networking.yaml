- id: ops.net.localhost_bind
  specializations: [devops]
  topic: networking
  skills: [networking, linux]
  kind: single_choice
  irt: {a: 1.1, b: -1.0}
  params:
    app: {choice: [billing, orders, gateway, admin-panel, metrics-exporter, docs]}
    port: {choice: [8000, 8080, 3000, 5000, 9100, 8443]}
    ip: {choice: [10.0.1.15, 10.2.0.7, 192.168.10.21, 172.16.4.30]}
  stem_variants:
    - "Сервис {{app}} на сервере {{ip}} запущен, curl http://127.0.0.1:{{port}} на самом сервере работает, а с соседней машины curl http://{{ip}}:{{port}} получает Connection refused. ss -ltn показывает LISTEN 127.0.0.1:{{port}}. Что исправить?"
    - "ss -ltn на сервере {{ip}} показывает для {{app}} строку LISTEN 127.0.0.1:{{port}}. С других хостов сервис недоступен (Connection refused), локально — доступен. В чём причина?"
  options:
    correct:
      - "Сервис слушает только loopback; нужно настроить его слушать 0.0.0.0:{{port}} (или адрес {{ip}})"
    wrong:
      - "Нужно открыть порт {{port}} в файрволе: Connection refused всегда означает блокировку файрволом"
      - "Нужно добавить {{ip}} в /etc/hosts на клиенте"
      - "Порт {{port}} привилегированный, сервис надо запускать от root"
      - "Нужно включить net.ipv4.ip_forward=1 на сервере"
      - "Нужно перезапустить сервис: ss показывает устаревший адрес"

- id: ops.net.dns_ttl
  specializations: [devops]
  topic: networking
  skills: [networking]
  kind: single_choice
  irt: {a: 1.1, b: -0.4}
  params:
    host: {choice: [api.shop.example, app.corp.example, pay.media.example, lk.itscout.test, status.example]}
    ttl: {choice: [3600, 7200, 14400, 86400]}
    minutes: {int: [5, 30], step: 5}
  stem_variants:
    - "A-запись {{host}} (TTL {{ttl}}) перевели на новый IP {{minutes}} минут назад. Авторитетные серверы уже отдают новый адрес, но часть клиентов всё ещё ходит на старый. Почему?"
    - "После смены IP-адреса в A-записи {{host}} с TTL {{ttl}} прошло {{minutes}} минут, а трафик на старый сервер не прекратился. Что объясняет ситуацию и как заранее её избежать?"
  options:
    correct:
      - "Рекурсивные резолверы и клиенты закэшировали старый ответ на время TTL ({{ttl}} с); перед миграцией TTL нужно заранее снизить"
    wrong:
      - "Изменения DNS распространяются ровно 72 часа независимо от TTL"
      - "У записи нужно было поднять TTL, чтобы изменения быстрее разошлись"
      - "Клиенты кэшируют A-записи до перезагрузки ОС, TTL на это не влияет"
      - "Нужно было изменить NS-записи домена, A-запись менять недостаточно"
      - "Старый IP остался в PTR-записи, и клиенты берут адрес из неё"

