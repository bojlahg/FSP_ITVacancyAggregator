- id: ops.sec.tls_chain_incomplete
  specializations: [devops]
  topic: security
  skills: [cryptography, nginx]
  kind: multi_choice
  irt: {a: 1.4, b: 1.5}
  time_limit_sec: 120
  n_options: 5
  params:
    host: {choice: [api.shop.ru, pay.bank.ru, lk.clinic.ru, gw.travel.ru]}
  stem_variants:
    - >-
      После замены сертификата на {{host}} браузеры открывают сайт без ошибок, а curl и Java-клиенты падают с
      «unable to get local issuer certificate» и «PKIX path building failed». Что верно?
    - >-
      Новый сертификат на {{host}}: в Chrome всё зелёное, а интеграции на curl и Java не могут установить
      соединение (ошибка построения цепочки). Какие утверждения верны?
  options:
    correct:
      - "Вероятно, сервер не отдаёт промежуточный сертификат: в конфигурации указан только листовой"
      - "Браузеры умеют достраивать цепочку сами (AIA fetching, кеш промежуточных), поэтому проблема видна не везде"
      - "openssl s_client -connect {{host}}:443 -showcerts покажет, какие сертификаты отдаёт сервер"
    wrong:
      - "Нужно добавить в цепочку на сервере корневой сертификат УЦ: без него клиенты не доверяют серверу"
      - "Сертификат выпущен на другое имя, а браузеры это игнорируют"
      - "curl не поддерживает сертификаты с ключами ECDSA"
      - "Цепочка восстановится сама после первого успешного соединения клиента"

- id: ops.sec.secret_in_layer
  specializations: [devops]
  topic: security
  skills: [docker, devsecops]
  kind: multi_choice
  irt: {a: 1.3, b: 1.4}
  time_limit_sec: 120
  n_options: 5
  params:
    file: {choice: [.npmrc, id_rsa, credentials.json, pip.conf, .netrc]}
  stem_variants:
    - >-
      В Dockerfile: COPY {{file}} /tmp/{{file}}, затем RUN с установкой зависимостей и отдельной строкой
      RUN rm /tmp/{{file}}. Образ уже опубликован в реестре. Какие утверждения верны?
    - >-
      Для сборки нужен секрет {{file}}: его копируют COPY в образ и удаляют следующей инструкцией RUN rm. Образ
      собран и выложен в реестр. Что верно?
  options:
    correct:
      - "Файл остаётся в слое, созданном COPY, и извлекается из опубликованного образа"
      - "Секрет надо считать скомпрометированным и перевыпустить, даже после исправления Dockerfile"
      - "Безопасный вариант — RUN --mount=type=secret (BuildKit): секрет не попадает в слои"
    wrong:
      - "RUN rm удаляет файл из всех предыдущих слоёв образа"
      - "Пересборка с --squash делает безопасным и уже опубликованный образ"
      - "Передать секрет через ARG безопасно: аргументы сборки не сохраняются в образе"
      - "Достаточно сделать репозиторий в реестре приватным, перевыпускать секрет не нужно"
