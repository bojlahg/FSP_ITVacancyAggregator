- id: ops.k8s.configmap_env
  specializations: [devops]
  topic: containers
  skills: [kubernetes]
  kind: single_choice
  irt: {a: 1.2, b: 0.5}
  params:
    app: {choice: [billing, orders, gateway, catalog, notifier, search]}
    key: {choice: [LOG_LEVEL, FEATURE_NEW_CHECKOUT, CACHE_TTL, DB_POOL_SIZE, RATE_LIMIT]}
    replicas: {int: [2, 8]}
  stem_variants:
    - "Deployment {{app}} ({{replicas}} реплик) получает {{key}} из ConfigMap через env (configMapKeyRef). Вы изменили значение в ConfigMap через kubectl apply, но приложение продолжает работать со старым. Почему и что сделать?"
    - "После kubectl edit configmap {{app}}-config значение {{key}} в подах {{app}} не изменилось: переменная окружения {{key}} задана через valueFrom.configMapKeyRef. Как применить новое значение?"
  options:
    correct:
      - "Переменные окружения задаются при старте контейнера и не обновляются; нужно пересоздать поды, например kubectl rollout restart deployment/{{app}}"
    wrong:
      - "kubelet обновит переменную окружения в работающем контейнере в течение минуты, нужно подождать"
      - "Нужно выполнить kubectl apply для ConfigMap повторно с флагом --force"
      - "Нужно отправить контейнеру SIGHUP: он перечитает переменные окружения из ConfigMap"
      - "ConfigMap нельзя изменить после создания; нужно удалить его и создать заново, и поды подхватят значение"
      - "Нужно увеличить replicas до {{replicas}} + 1: новые значения увидят только новые поды, а старые обновятся сами"

- id: ops.k8s.cpu_throttling
  specializations: [devops]
  topic: containers
  skills: [kubernetes, linux, prometheus]
  kind: single_choice
  irt: {a: 1.2, b: 1.5}
  params:
    app: {choice: [billing, orders, gateway, search, checkout, auth]}
    limit: {choice: [500m, "1", 1500m, "2"]}
    avg: {int: [15, 40], step: 5}
  stem_variants:
    - "У контейнера {{app}} limits.cpu: {{limit}}. По графикам средняя загрузка CPU — около {{avg}}% от лимита, нода почти свободна, но p99 латентности высокая, а метрика container_cpu_cfs_throttled_periods_total быстро растёт. Что происходит?"
    - "Сервис {{app}} (limits.cpu: {{limit}}) в среднем потребляет лишь {{avg}}% лимита CPU, но отвечает с всплесками задержки; растёт container_cpu_cfs_throttled_seconds_total. Как это объяснить?"
  options:
    correct:
      - "Лимит CPU — это квота CFS на каждый короткий период (по умолчанию 100 мс); всплески потребления выбирают квоту раньше конца периода, и потоки ждут следующего, хотя в среднем загрузка низкая"
    wrong:
      - "Throttling возникает только при 100% загрузке всей ноды; значит, графики неверны"
      - "limits.cpu учитывается только планировщиком при размещении пода и на работу не влияет"
      - "Контейнер упирается в лимит памяти, и ядро замедляет его вместо OOM kill"
      - "Причина в requests.cpu: он ограничивает потребление сверху так же, как limits"
      - "Средняя загрузка ниже лимита, значит, задержки вызваны только сетью"
