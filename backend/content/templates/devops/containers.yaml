- id: ops.k8s.requests_capacity
  specializations: [devops]
  topic: containers
  skills: [kubernetes]
  kind: numeric
  irt: {a: 1.2, b: 0.4}
  time_limit_sec: 150
  params:
    node_cpu: {choice: [3800, 7600, 15600]}
    node_mem: {choice: [12, 24, 28, 56]}
    req_cpu: {choice: [250, 400, 500, 750]}
    req_mem: {choice: [512, 768, 1024, 1536]}
    lim_cpu: {choice: [1000, 1500, 2000]}
    lim_mem: {choice: [2048, 3072, 4096]}
  stem: >-
    На пустой ноде Kubernetes allocatable — {{node_cpu}}m CPU и {{node_mem}}Gi памяти; других подов и
    DaemonSet'ов нет. Под приложения задаёт requests: cpu {{req_cpu}}m, memory {{req_mem}}Mi; limits: cpu
    {{lim_cpu}}m, memory {{lim_mem}}Mi. Сколько таких подов планировщик сможет разместить на ноде?
  answer:
    # планировщик сравнивает сумму requests с allocatable, limits не учитываются
    expr: "min({{node_cpu}} // {{req_cpu}}, {{node_mem}} * 1024 // {{req_mem}})"
    tolerance: 0

