- id: ops.cont.multistage_build
  specializations: [devops]
  topic: containers
  skills: [docker]
  kind: single_choice
  irt: {a: 1.1, b: -0.4}
  params:
    lang: {choice: [Go, Rust, Java (Maven), TypeScript, C++]}
    size: {int: [700, 1600], step: 100}
    app: {choice: [billing, orders, gateway, catalog, notifier, reports]}
  stem_variants:
    - "Образ сервиса {{app}} на {{lang}} весит {{size}} МБ: в нём остались компилятор, исходники и кэш зависимостей, хотя для запуска нужен только собранный артефакт. Как уменьшить образ, не меняя процесс сборки?"
    - "Dockerfile сервиса {{app}} ({{lang}}) собирает приложение и запускает его в одном образе размером {{size}} МБ, вместе со всеми инструментами сборки. Какой приём Docker решает проблему?"
  options:
    correct:
      - "Multi-stage build: собрать в стадии с инструментами, а в финальный минимальный образ скопировать только артефакт (COPY --from=build)"
    wrong:
      - "Удалить инструменты сборки отдельной инструкцией RUN rm в конце Dockerfile"
      - "Выполнить docker image prune после сборки"
      - "Сжать образ через docker save | gzip перед публикацией"
      - "Добавить флаг --squash и оставить всё в одном образе"
      - "Указать в .dockerignore каталог с компилятором"

