- id: ops.cont.port_publish
  specializations: [devops]
  topic: containers
  skills: [docker, networking]
  kind: single_choice
  irt: {a: 1.0, b: -1.5}
  params:
    hport: {choice: [8080, 8081, 9090, 18080, 3001, 5050, 7000]}
    cport: {choice: [80, 3000, 8000, 5000, 8888, 4000]}
    image: {choice: [nginx, my-api, billing, docs-site, grafana-demo, orders]}
  stem_variants:
    - "Приложение в контейнере слушает порт {{cport}}. Контейнер запущен командой docker run -d -p {{hport}}:{{cport}} {{image}}. По какому адресу открыть приложение в браузере на этом же хосте?"
    - "docker run -d -p {{hport}}:{{cport}} {{image}}. Внутри контейнера сервис слушает {{cport}}. Какой адрес нужно открыть на хост-машине?"
  options:
    correct: ["http://localhost:{{hport}}"]
    wrong:
      - "http://localhost:{{cport}}"
      - "http://localhost:{{cport}}, а {{hport}} — порт для доступа из других контейнеров"
      - "Никак: нужно ещё добавить в Dockerfile EXPOSE {{hport}}"
      - "http://localhost:{{hport}}, но только при запуске с --network host"
      - "http://localhost:{{cport}}{{hport}}"

- id: ops.cont.docker_logs
  specializations: [devops]
  topic: containers
  skills: [docker]
  kind: single_choice
  irt: {a: 0.9, b: -1.7}
  params:
    name: {choice: [billing, orders-api, gateway, worker-1, notifier, web, auth-service]}
    n: {choice: [50, 100, 200, 500]}
  stem_variants:
    - "Контейнер {{name}} пишет логи в stdout. Какой командой посмотреть, что он выводил?"
    - "Сервис {{name}} в контейнере упал при старте. Как посмотреть его вывод в stdout и stderr?"
    - "Нужно увидеть последние {{n}} строк вывода контейнера {{name}} (приложение пишет в stdout). Какую команду использовать?"
  options:
    correct: ["docker logs {{name}}", "docker logs --tail {{n}} {{name}}"]
    wrong:
      - "docker inspect {{name}}"
      - "docker ps -a {{name}}"
      - "docker top {{name}}"
      - "docker stats {{name}}"
      - "docker events {{name}}"
      - "cat /var/log/{{name}}.log"

