# DevOps · контейнеры и оркестрация (§10.2). Формат: content/templates/README.md

- id: ops.cont.layer_cache_order
  specializations: [devops]
  topic: containers
  skills: [docker]
  kind: single_choice
  irt: {a: 1.2, b: -1.0}
  params:
    base: {choice: ["python:3.12-slim", "python:3.13-slim"]}
    deps: {choice: [requirements.txt, requirements.lock]}
    workdir: {choice: [/app, /srv/app, /opt/service]}
  stem_variants:
    - "При любом изменении исходников docker build заново выполняет установку зависимостей, и сборка занимает много минут. Как это исправить?"
    - "Сборка образа по этому Dockerfile медленная: правка одной строки кода приводит к повторному pip install. Что нужно изменить?"
  code: |-
    FROM {{base}}
    WORKDIR {{workdir}}
    COPY . .
    RUN pip install --no-cache-dir -r {{deps}}
    CMD ["python", "main.py"]
  code_language: dockerfile
  options:
    correct:
      - "Сначала скопировать только {{deps}} и установить зависимости, а COPY . . перенести после RUN pip install"
    wrong:
      - "Добавить флаг --no-cache к docker build"
      - "Заменить COPY . . на ADD . ."
      - "Объединить все инструкции в одну строку RUN через &&"
      - "Использовать базовый образ с тегом latest"

