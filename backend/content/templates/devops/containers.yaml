- id: ops.k8s.pending_requests
  specializations: [devops]
  topic: containers
  skills: [kubernetes]
  kind: single_choice
  irt: {a: 1.3, b: 1.0}
  params:
    nodes: {int: [3, 9]}
    used: {int: [30, 55], step: 5}
    app: {choice: [billing, orders, gateway, reports, search]}
  stem_variants:
    - "Под {{app}} висит в Pending с событием «0/{{nodes}} nodes are available: {{nodes}} Insufficient memory». При этом kubectl top nodes показывает, что на нодах занято лишь около {{used}}% памяти. Почему под не планируется?"
    - "В кластере из {{nodes}} нод фактическое потребление памяти около {{used}}%, но новый под {{app}} не может запланироваться: Insufficient memory. Что объясняет ситуацию?"
  options:
    correct:
      - "Планировщик сравнивает с allocatable сумму memory requests подов на ноде, а не фактическое потребление"
    wrong:
      - "kubectl top показывает данные с задержкой, нужно подождать обновления metrics-server"
      - "Планировщик учитывает limits подов, а они превышают объём памяти ноды"
      - "Не хватает swap: Kubernetes требует swap размером с запрошенную память"
      - "Под ждёт, пока kubelet освободит page cache на нодах"

