- id: ops.ci.immutable_tags
  specializations: [devops]
  topic: ci_cd
  skills: [ci_cd, docker, kubernetes]
  kind: single_choice
  irt: {a: 1.1, b: -0.3}
  params:
    app: {choice: [billing, orders, gateway, catalog, auth, notifier, reports]}
    registry: {choice: [registry.gitlab.example, cr.yandex/crp1, harbor.corp.example, ghcr.io/acme]}
    env: {choice: [production, staging, pre-prod]}
  stem_variants:
    - "CI собирает образ {{registry}}/{{app}}:latest и деплоит в {{env}} манифест с этим тегом. После неудачного релиза откатиться на предыдущую версию оказалось сложно, а на разных нодах крутились разные образы. Как тегировать образы?"
    - "В {{env}} манифест ссылается на {{registry}}/{{app}}:latest. Команда не может понять, какая версия кода сейчас запущена, и не может быстро откатиться. Какая схема тегов это решает?"
  options:
    correct:
      - "Неизменяемый уникальный тег на каждую сборку (например, SHA коммита) и деплой по нему; откат — деплой предыдущего тега"
      - "Тегировать образ SHA коммита или номером версии и никогда не перезаписывать существующие теги"
    wrong:
      - "Оставить latest, но добавить в манифест imagePullPolicy: Always"
      - "Тегировать образ именем ветки (main) и перезаписывать его при каждой сборке"
      - "Тегировать образ датой сборки с точностью до дня и перезаписывать в течение дня"
      - "Оставить latest и хранить предыдущий образ локально на нодах для отката"
      - "Использовать тег stable и переносить его на новую сборку после деплоя"

