# DevOps · CI/CD (§10.2). Формат: content/templates/README.md

- id: ops.ci.pipeline_order
  specializations: [devops]
  topic: ci_cd
  skills: [ci_cd]
  kind: ordering
  irt: {a: 1.0, b: -1.0}
  time_limit_sec: 120
  params:
    sha: {choice: [3f2a9c1, 9b07de4, c41e8a2, 7d5f013, e2a66b9]}
    image: {choice: [billing, orders, gateway, catalog]}
    registry: {choice: [GitLab Container Registry, Harbor, Yandex Container Registry, Docker Hub]}
    stage_env: {choice: [staging, stage, pre-prod]}
  stem: >-
    Расположите этапы пайплайна в правильном порядке. Быстрые проверки должны выполняться до сборки
    артефакта (fail fast), а в production выкатывается тот же образ, который прошёл {{stage_env}}.
  order_items:
    - "Checkout кода коммита {{sha}}"
    - "Линтер и юнит-тесты"
    - "Сборка образа {{image}}:{{sha}}"
    - "Публикация образа в {{registry}}"
    - "Деплой образа {{image}}:{{sha}} на {{stage_env}}"
    - "Smoke- и интеграционные тесты на {{stage_env}}"
    - "Деплой того же образа в production"

- id: ops.ci.cache_or_artifacts
  specializations: [devops]
