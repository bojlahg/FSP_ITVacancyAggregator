# QA · стек-модуль qa_automation_java (§10.2). Формат: content/templates/README.md

- id: qa.java.junit5_lifecycle
  specializations: [qa]
  topic: stack
  stack_module: qa_automation_java
  skills: [junit, java]
  kind: ordering
  irt: {a: 1.0, b: -1.0}
  params:
    cls: {choice: [CartTest, LoginTest, PaymentApiTest]}
    test: {choice: [returnsResult, validatesInput, handlesError]}
  stem: >-
    В классе {{cls}} (JUnit 5) один тест {{test}}() и методы с аннотациями @BeforeAll, @BeforeEach,
    @AfterEach, @AfterAll. Расположите вызовы в порядке выполнения.
  order_items:
    - "@BeforeAll"
    - "@BeforeEach"
    - "{{test}}() с аннотацией @Test"
    - "@AfterEach"
    - "@AfterAll"

