- id: qa.java.selenium_waits
  specializations: [qa]
  topic: stack
  stack_module: qa_automation_java
  skills: [selenium, java]
  kind: multi_choice
  irt: {a: 1.2, b: 1.0}
  n_options: 5
  params:
    element: {choice: [кнопка «Оплатить», таблица заказов, модальное окно, поле поиска]}
  stem: "Тесты на Selenium WebDriver (Java) нестабильно находят элемент: {{element}}. Какие утверждения об ожиданиях верны?"
  options:
    correct:
      - "Implicit wait применяется ко всем вызовам findElement и задерживает NoSuchElementException"
      - "Смешивание implicit и explicit ожиданий может давать непредсказуемое время ожидания"
      - "WebDriverWait с ExpectedConditions ждёт конкретного условия, например elementToBeClickable"
      - "StaleElementReferenceException возникает, если элемент перерисовали после того, как его нашли"
    wrong:
      - "Thread.sleep надёжнее явных ожиданий, потому что ждёт фиксированное время"
      - "Implicit wait дожидается завершения всех AJAX-запросов на странице"
      - "Explicit wait, однажды созданный, действует на все последующие поиски элементов"
      - "StaleElementReferenceException означает, что элемент ещё не появился в DOM"
