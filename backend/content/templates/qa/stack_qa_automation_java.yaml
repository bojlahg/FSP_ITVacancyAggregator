# QA · стек-модуль qa_automation_java (§10.2). Формат: content/templates/README.md

- id: qa.java.junit5_lifecycle
  specializations: [qa]
  topic: stack
  stack_module: qa_automation_java
  skills: [junit, java]
  kind: ordering
  irt: {a: 1.0, b: -1.0}
  params:
    cls: {choice: [CartTest, LoginTest, PaymentApiTest, SearchTest, ProfileTest, OrderDaoTest]}
    test: {choice: [returnsResult, validatesInput, handlesError, savesOrder, rejectsEmpty, logsOut]}
    all_init: {choice: [startServer, initDatabase, loadConfig, startBrowser]}
    each_init: {choice: [openPage, createUser, resetState, login]}
    each_done: {choice: [clearCookies, deleteUser, logout, takeScreenshot]}
    all_done: {choice: [stopServer, closeDatabase, quitBrowser, cleanUp]}
  stem_variants:
    - >-
      В классе {{cls}} (JUnit 5) один тест {{test}}() и методы с аннотациями @BeforeAll, @BeforeEach,
      @AfterEach, @AfterAll. Расположите вызовы в порядке выполнения.
    - >-
      Класс {{cls}} на JUnit 5 запускается целиком; в нём один метод с @Test и четыре служебных метода.
      В каком порядке JUnit вызовет методы?
  order_items:
    - "@BeforeAll static void {{all_init}}()"
    - "@BeforeEach void {{each_init}}()"
    - "@Test void {{test}}()"
    - "@AfterEach void {{each_done}}()"
    - "@AfterAll static void {{all_done}}()"

