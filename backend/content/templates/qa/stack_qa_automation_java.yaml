- id: qa.java.parallel_lifecycle
  specializations: [qa]
  topic: stack
  stack_module: qa_automation_java
  skills: [junit, selenium, java]
  kind: multi_choice
  irt: {a: 1.2, b: 1.5}
  n_options: 5
  params:
    cls: {choice: [CheckoutUiTest, LoginUiTest, SearchUiTest, ProfileUiTest]}
    tests: {int: [4, 12]}
  stem: >-
    В классе {{cls}} {{tests}} UI-тестов используют поле static WebDriver driver. После включения
    junit.jupiter.execution.parallel.enabled=true и режима concurrent тесты стали падать случайным
    образом. Какие утверждения верны?
  options:
    correct:
      - "Статический драйвер общий для потоков: параллельные тесты управляют одним браузером"
      - "Хранение драйвера в ThreadLocal<WebDriver> даёт каждому потоку свой экземпляр"
      - "@Execution(ExecutionMode.SAME_THREAD) на классе заставляет его тесты выполняться последовательно"
      - "По умолчанию JUnit 5 создаёт новый экземпляр тестового класса для каждого тестового метода"
    wrong:
      - "По умолчанию JUnit 5 создаёт один экземпляр тестового класса на все его методы"
      - "@BeforeEach выполняется один раз на класс, поэтому драйвер в нём общий для всех тестов"
      - "Метод с @BeforeAll может быть нестатическим только при параллельном запуске"
      - "Параллельный запуск в JUnit 5 включается аннотацией @RepeatedTest"

