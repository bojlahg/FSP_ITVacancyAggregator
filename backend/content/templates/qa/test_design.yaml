- id: qa.td.promo_code_strategy
  specializations: [qa]
  topic: test_design
  skills: [test_design, api_testing]
  kind: open_approach
  irt: {a: 1.0, b: 0.8}
  time_limit_sec: 600
  params:
    pct: {choice: [10, 15, 20]}
    min: {choice: ["1 000", "3 000", "5 000"]}
  stem: >-
    В интернет-магазин добавляют промокоды: скидка {{pct}}% на заказ от {{min}} ₽, промокод одноразовый для
    каждого пользователя и имеет срок действия. Опишите, как вы будете тестировать эту функцию: что
    проверите и в каком порядке.
  rubric:
    - "Применяет техники тест-дизайна: граничные значения суммы и даты окончания, классы эквивалентности"
    - Описывает негативные сценарии (истёкший, чужой, повторно использованный, несуществующий промокод)
    - Проверяет не только UI, но и API или БД (пересчёт суммы на сервере, а не только на клиенте)
    - Учитывает конкурентное применение одного промокода (два заказа одновременно)
    - Расставляет приоритеты по риску (деньги, повторное использование) и упоминает регрессию корзины и оплаты
