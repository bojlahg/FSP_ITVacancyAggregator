# QA · тест-дизайн (§10.2). Формат: content/templates/README.md

- id: qa.td.full_combinations
  specializations: [qa]
  topic: test_design
  skills: [test_design]
  kind: numeric
  irt: {a: 1.0, b: -1.3}
  params:
    browsers: {int: [2, 4]}
    os: {int: [2, 3]}
    langs: {int: [2, 5]}
    roles: {int: [2, 4]}
  stem: >-
    Форму нужно проверить в {{browsers}} браузерах, на {{os}} ОС, с {{langs}} языками интерфейса и для
    {{roles}} ролей пользователя. Все сочетания допустимы. Сколько тестов потребуется при полном переборе
    всех комбинаций?
  answer:
    expr: "{{browsers}} * {{os}} * {{langs}} * {{roles}}"

