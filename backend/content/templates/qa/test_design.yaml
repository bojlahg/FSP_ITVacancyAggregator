# QA · тест-дизайн (§10.2). Формат: content/templates/README.md

- id: qa.td.full_combinations
  specializations: [qa]
  topic: test_design
  skills: [test_design]
  kind: numeric
  irt: {a: 1.0, b: -1.3}
  params:
    form: {choice: [регистрации, оформления заказа, входа, оплаты, поиска, обратной связи]}
    browsers: {int: [2, 5]}
    os: {int: [2, 4]}
    langs: {int: [2, 6]}
    roles: {int: [2, 5]}
  stem_variants:
    - >-
      Форму {{form}} нужно проверить в {{browsers}} браузерах, на {{os}} ОС, с {{langs}} языками интерфейса и
      для {{roles}} ролей пользователя. Все сочетания допустимы. Сколько тестов потребуется при полном
      переборе всех комбинаций?
    - >-
      Для формы {{form}} заданы параметры: браузер ({{browsers}} вариантов), ОС ({{os}}), язык интерфейса
      ({{langs}}), роль пользователя ({{roles}}). Ограничений на сочетания нет. Сколько комбинаций нужно
      проверить, чтобы перебрать их все?
  answer:
    expr: "{{browsers}} * {{os}} * {{langs}} * {{roles}}"

