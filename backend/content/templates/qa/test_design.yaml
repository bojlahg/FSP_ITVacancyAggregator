- id: qa.td.race_condition_design
  specializations: [qa]
  topic: test_design
  skills: [test_design, api_testing, test_automation]
  kind: multi_choice
  irt: {a: 1.3, b: 1.4}
  time_limit_sec: 120
  n_options: 5
  params:
    item: {choice: [билета на концерт, места в самолёте, товара со склада, слота на приём к врачу, промокода с одним использованием]}
  stem_variants:
    - >-
      Нужно проверить, что при одновременной попытке двух пользователей купить последний экземпляр ({{item}})
      система не продаст его дважды. Какие приёмы реально помогают воспроизвести и поймать гонку?
    - >-
      Риск: при параллельных запросах резервирование последнего {{item}} может пройти дважды. Что из перечисленного
      — действенные способы тестирования этой гонки?
  options:
    correct:
      - "Отпускать параллельные запросы одновременно через барьер (CyclicBarrier, общее событие) и повторять сценарий сотни раз"
      - "В тестовом окружении внедрить задержку между чтением остатка и записью (fault injection, отладочный хук)"
      - "После прогона проверять инвариант в БД: продано не больше, чем было, остаток не отрицательный"
      - "Вручную вести две транзакции в двух сессиях БД, выполняя шаги поочерёдно в опасном порядке"
    wrong:
      - "Отправить два запроса последовательно и сравнить ответы"
      - "Проверить только, что оба ответа вернули код 200"
      - "Увеличить таймауты клиента, чтобы запросы гарантированно пересеклись"
      - "Один раз нажать «Купить» в двух вкладках браузера: если дубля нет, гонки нет"
      - "Запустить тест в одном потоке с моком репозитория"

- id: qa.td.mutation_interpretation
  specializations: [qa]
  topic: test_design
  skills: [test_design, unit_testing]
  kind: multi_choice
  irt: {a: 1.4, b: 1.5}
  time_limit_sec: 120
  n_options: 5
  params:
    module: {choice: [pricing, discounts, limits, billing, scoring]}
    cov: {int: [85, 98]}
    ms: {int: [35, 60]}
    call: {choice: [audit.log, cache.invalidate, notifier.send, metrics.inc]}
  stem_variants:
    - >-
      У модуля {{module}} покрытие строк {{cov}}%, а mutation score — {{ms}}%. Среди выживших мутантов много
      замен «>» на «>=» в условиях и удалений вызова {{call}}(). Какие выводы корректны?
    - >-
      Отчёт мутационного тестирования для {{module}}: line coverage {{cov}}%, mutation score {{ms}}%. Выжили в
      основном мутанты «> → >=» и «удалён вызов {{call}}()». Что из этого следует?
  options:
    correct:
      - "Тесты выполняют код, но их проверки слабые: изменения поведения остаются незамеченными"
      - "Выживший мутант «> → >=» указывает на отсутствие теста на граничное значение"
      - "Выживший мутант без вызова {{call}}() означает, что ни один тест не проверяет эффект этого вызова"
      - "Часть выживших мутантов может оказаться эквивалентной: поведение не меняется, и убить их тестом нельзя"
    wrong:
      - "Покрытие строк {{cov}}% гарантирует, что mutation score можно поднять только новыми тестами на непокрытые строки"
      - "Mutation score 100% доказал бы отсутствие ошибок в модуле"
      - "Выжившие мутанты появляются только в строках, не покрытых тестами"
      - "Мутационное тестирование заменяет покрытие ветвей: его можно больше не считать"
      - "Чтобы поднять mutation score, достаточно довести покрытие строк до 100%"
