- id: qa.td.promo_code_strategy
  specializations: [qa]
  topic: test_design
  skills: [test_design, api_testing]
  kind: open_approach
  irt: {a: 1.0, b: 0.8}
  time_limit_sec: 600
  params:
    pct: {choice: [10, 15, 20]}
    min: {choice: ["1 000", "3 000", "5 000"]}
  stem: >-
    В интернет-магазин добавляют промокоды: скидка {{pct}}% на заказ от {{min}} ₽, промокод одноразовый для
    каждого пользователя и имеет срок действия. Опишите, как вы будете тестировать эту функцию: что
    проверите и в каком порядке.
  rubric:
    - "Применяет техники тест-дизайна: граничные значения суммы и даты окончания, классы эквивалентности"
    - Описывает негативные сценарии (истёкший, чужой, повторно использованный, несуществующий промокод)
    - Проверяет не только UI, но и API или БД (пересчёт суммы на сервере, а не только на клиенте)
    - Учитывает конкурентное применение одного промокода (два заказа одновременно)
    - Расставляет приоритеты по риску (деньги, повторное использование) и упоминает регрессию корзины и оплаты

- id: qa.td.black_white_box
  specializations: [qa]
  topic: test_design
  skills: [test_design]
  kind: multi_choice
  irt: {a: 1.0, b: -1.2}
  n_options: 5
  params:
    feature: {choice: [расчёта доставки, регистрации, корзины, начисления бонусов, поиска, оплаты]}
    kind: {choice: [чёрного ящика, спецификационным (black-box)]}
  stem_variants:
    - "Для функции {{feature}} нужно выбрать техники тест-дизайна. Какие из них относятся к техникам {{kind}}, то есть не требуют знания кода?"
    - "Тестировщик не видит исходный код модуля {{feature}} и опирается только на требования. Какие техники он может применить?"
  options:
    correct:
      - "Классы эквивалентности"
      - "Анализ граничных значений"
      - "Таблица решений"
      - "Диаграмма состояний и переходов"
      - "Попарное тестирование (pairwise)"
    wrong:
      - "Покрытие операторов (statement coverage)"
      - "Покрытие ветвей (branch coverage)"
      - "Покрытие MC/DC"
      - "Покрытие путей выполнения кода"
      - "Анализ потока данных в коде (data flow)"

