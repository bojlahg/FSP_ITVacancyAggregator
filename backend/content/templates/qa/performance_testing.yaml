- id: qa.perf.saturation
  specializations: [qa]
  topic: performance_testing
  skills: [load_testing]
  kind: multi_choice
  irt: {a: 1.2, b: 1.5}
  n_options: 5
  params:
    rps: {int: [300, 2000], step: 100}
    cpu: {int: [25, 45], step: 5}
    service: {choice: [оформления заказа, поиска, авторизации, личного кабинета]}
  stem: >-
    При росте нагрузки на сервис {{service}} пропускная способность перестала расти на {{rps}} RPS, время
    ответа и число одновременных запросов растут, а загрузка CPU серверов приложения — около {{cpu}}%.
    Какие выводы и проверки верны?
  options:
    correct:
      - "Узким местом может быть не CPU, а пул соединений к БД, блокировки или пул потоков"
      - "Нужно убедиться, что генератор нагрузки сам не упёрся в свои ресурсы"
      - "По закону Литтла при неизменной пропускной способности рост времени ответа означает рост очереди запросов"
      - "Стоит посмотреть время ожидания соединения из пула и метрики БД на этом же интервале"
    wrong:
      - "Раз CPU загружен на {{cpu}}%, у сервиса есть запас и узкого места нет"
      - "Рост времени ответа при постоянном RPS невозможен, значит, метрики собраны неверно"
      - "Достаточно добавить ядер CPU, чтобы пропускная способность выросла пропорционально"
      - "Перцентили времени ответа в такой ситуации не меняются, смотреть нужно только на среднее"

- id: qa.perf.total_requests
  specializations: [qa]
  topic: performance_testing
  skills: [load_testing]
  kind: numeric
  irt: {a: 1.0, b: -1.9}
  params:
    rps: {int: [5, 50], step: 5}
    minutes: {int: [2, 10]}
    tool: {choice: [JMeter, k6, Locust, Gatling]}
  stem_variants:
    - "Нагрузочный тест в {{tool}} держит постоянную нагрузку {{rps}} запросов в секунду в течение {{minutes}} минут. Сколько всего запросов будет отправлено?"
    - "Сценарий {{tool}}: ровно {{rps}} RPS на протяжении {{minutes}} минут, без разгона и паузы. Сколько запросов получит сервис за весь тест?"
  answer:
    expr: "{{rps}} * {{minutes}} * 60"
    tolerance: 0

# --- Senior ---

- id: qa.perf.closed_model_users
  specializations: [qa]
  topic: performance_testing
  skills: [load_testing]
  kind: numeric
  irt: {a: 1.3, b: 1.4}
  time_limit_sec: 120
  params:
    rps: {int: [50, 400], step: 10}
    resp: {choice: [200, 300, 400, 500, 800]}
    think: {choice: [2, 3, 5, 8, 10]}
  stem_variants:
    - >-
      Сценарий нагрузочного теста в закрытой модели: виртуальный пользователь отправляет запрос, ждёт ответ
      (среднее время ответа {{resp}} мс), делает паузу {{think}} с (think time) и повторяет. Сколько виртуальных
      пользователей нужно, чтобы в установившемся режиме получить {{rps}} запросов в секунду?
    - >-
      Нужно подать {{rps}} RPS закрытой моделью: у каждого виртуального пользователя цикл «запрос → ответ в
      среднем за {{resp}} мс → пауза {{think}} с». Сколько виртуальных пользователей потребуется (закон Литтла)?
  answer:
    # закон Литтла: N = X · (R + Z)
    expr: "{{rps}} * ({{resp}} / 1000 + {{think}})"
    tolerance: 1

- id: qa.perf.coordinated_omission
  specializations: [qa]
  topic: performance_testing
  skills: [load_testing, statistics]
  kind: multi_choice
  irt: {a: 1.4, b: 1.7}
  time_limit_sec: 120
  n_options: 5
  params:
    users: {int: [20, 200], step: 10}
    stall: {int: [5, 30]}
  stem_variants:
    - >-
      Генератор нагрузки работает в закрытой модели: {{users}} виртуальных пользователей, каждый отправляет
      следующий запрос только после ответа на предыдущий. Во время теста сервис «замер» на {{stall}} с, затем
      восстановился. Какие утверждения о результатах верны?
    - >-
      Тест: {{users}} потоков, каждый шлёт запросы последовательно, ожидая ответ. Сервис однажды встал на
      {{stall}} с. В отчёте p99 выглядит прилично. Что верно?
  options:
    correct:
      - "Пока сервис стоит, генератор почти не отправляет новых запросов, поэтому медленных замеров мало и p99 занижен (coordinated omission)"
      - "Реальные независимые пользователи продолжали бы приходить, и их запросы ждали бы в очереди — эти задержки в отчёт не попали"
      - "Открытая модель (постоянная интенсивность прихода) или отсчёт задержки от запланированного времени отправки показывает реальную картину"
    wrong:
      - "Закрытая модель точнее отражает публичный веб-сервис с независимыми пользователями"
      - "Перцентили устойчивы к паузам: p99 из отчёта можно брать как SLI без поправок"
      - "Чтобы избежать эффекта, достаточно вдвое увеличить число виртуальных пользователей"
      - "Во время паузы генератор продолжает отправлять запросы с прежней интенсивностью"
