# QA · нагрузочное тестирование (§10.2). Формат: content/templates/README.md

- id: qa.perf.test_type
  specializations: [qa]
  topic: performance_testing
  skills: [load_testing]
  kind: single_choice
  irt: {a: 1.0, b: -0.8}
  generator: qa.perf_test_type

- id: qa.perf.littles_law
  specializations: [qa]
  topic: performance_testing
  skills: [load_testing]
  kind: numeric
  irt: {a: 1.2, b: 0.4}
  time_limit_sec: 150
  generator: qa.littles_law

- id: qa.perf.percentile
  specializations: [qa]
