- id: qa.proc.static_testing
  specializations: [qa]
  topic: process
  skills: [manual_testing, test_design]
  kind: multi_choice
  irt: {a: 1.0, b: -0.4}
  n_options: 5
  params:
    product: {choice: [мобильного банка, сервиса доставки, CRM-системы, онлайн-школы, маркетплейса]}
    stage: {choice: [на этапе требований, до первой сборки, в начале спринта]}
  stem_variants:
    - "Команда {{product}} хочет находить дефекты {{stage}}. Какие активности относятся к статическому тестированию (без выполнения кода)?"
    - "Какие из активностей в проекте {{product}} — статическое тестирование, то есть проходят без запуска программы?"
  options:
    correct:
      - "Ревью требований и пользовательских историй"
      - "Код-ревью pull request"
      - "Статический анализ кода линтером"
      - "Проверка макетов и спецификации API на противоречия"
    wrong:
      - "Прогон юнит-тестов в CI"
      - "Дымовое тестирование новой сборки"
      - "Нагрузочный тест на стенде"
      - "Исследовательское тестирование собранного приложения"
      - "Запуск автотестов API в Postman"

- id: qa.proc.flaky_tests
  specializations: [qa]
  topic: process
  skills: [test_automation]
  kind: multi_choice
  irt: {a: 1.2, b: 1.4}
  n_options: 5
  params:
    suite: {choice: [UI-автотестов, API-автотестов, e2e-набора, регрессионного набора]}
    rate: {int: [3, 15]}
  stem: >-
    В наборе {{suite}} около {{rate}}% тестов то падают, то проходят на одном и том же коде (flaky). Какие
    утверждения и действия верны?
  options:
    correct:
      - "Частые причины — зависимость от порядка тестов, общие тестовые данные и ожидания по фиксированному времени"
      - "Автоматический перезапуск упавших тестов скрывает проблему: причину всё равно нужно искать"
      - "Нестабильные тесты стоит изолировать (карантин) и вести по ним задачи, чтобы не блокировать конвейер"
      - "Нестабильность может быть дефектом продукта, например гонкой в коде, а не только теста"
    wrong:
      - "Если тест прошёл хотя бы при одном перезапуске, его результат можно считать надёжным"
      - "Flaky-тесты всегда вызваны медленным железом CI, увеличение ресурсов решит проблему"
      - "Лучшее решение — добавить time.sleep или Thread.sleep во все шаги"
      - "Нестабильные тесты нужно сразу удалять без анализа"

- id: qa.proc.pass_rate
  specializations: [qa]
  topic: process
  skills: [manual_testing, test_automation]
  kind: numeric
  irt: {a: 1.0, b: -2.0}
  params:
    total: {choice: [20, 25, 50]}
    failed: {int: [1, 9]}
    run: {choice: [смоук-прогоне, регрессионном прогоне, ночном прогоне автотестов, прогоне перед релизом]}
  stem_variants:
    - "В {{run}} было {{total}} тестов: {{failed|упал|упали|упали}}, остальные прошли. Какой процент тестов прошёл?"
    - "Отчёт о {{run}}: всего тестов — {{total}}, упавших — {{failed}}, пропущенных нет. Сколько процентов тестов прошло успешно?"
  answer:
    expr: "({{total}} - {{failed}}) * 100 / {{total}}"
    tolerance: 0

# --- Senior ---

- id: qa.proc.flaky_suite
  specializations: [qa]
  topic: process
  skills: [test_automation, manual_testing]
  kind: numeric
  irt: {a: 1.3, b: 1.6}
  time_limit_sec: 150
  params:
    tests: {int: [100, 600], step: 50}
    permille: {choice: [1, 2, 3, 5]}
    retries: {choice: [0, 1]}
  stem_variants:
    - >-
      В регрессионном наборе {{tests}} автотестов, каждый независимо от других ложно падает с вероятностью
      {{permille}}‰ (на исправном коде). Число автоматических перезапусков упавшего теста — {{retries}}; тест
      считается упавшим, если упали все попытки. Какой процент прогонов на исправном коде окажется «красным»?
      Ответ в процентах, с точностью до десятых.
    - >-
      Набор из {{tests}} тестов; вероятность ложного падения каждого — {{permille}}‰, независимо. Перезапусков
      упавшего теста в CI — {{retries}}; тест считается упавшим, только если упали все попытки. Какая
      доля прогонов на исправном коде будет красной? Ответ в процентах, точность — десятые.
  answer:
    # P(красный) = 1 − (1 − p^(r+1))^n при независимых падениях
    expr: "100 * (1 - (1 - ({{permille}} / 1000) ** ({{retries}} + 1)) ** {{tests}})"
    tolerance: 0.15
