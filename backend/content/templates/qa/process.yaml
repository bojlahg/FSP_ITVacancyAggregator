# QA · процессы и документация (§10.2). Формат: content/templates/README.md

- id: qa.proc.bug_lifecycle
  specializations: [qa]
  topic: process
  skills: [manual_testing, jira]
  kind: ordering
  irt: {a: 0.9, b: -1.2}
  params:
    project: {choice: [SHOP, PAY, CRM, APP, BANK, DLV, HR, LMS]}
    num: {int: [10, 9999]}
    tracker: {choice: [Jira, YouTrack, Redmine, GitLab]}
  stem_variants:
    - "Расположите статусы дефекта {{project}}-{{num}} в {{tracker}} в порядке типичного жизненного цикла: от создания до закрытия."
    - "Дефект {{project}}-{{num}} прошёл путь от обнаружения до закрытия без возвратов. Расположите статусы в правильном порядке."
    - "В {{tracker}} заведён дефект {{project}}-{{num}}; его исправили и проверили с первого раза. В каком порядке он проходил статусы?"
  order_items:
    - "Новый (New)"
    - "Назначен разработчику (Assigned)"
    - "Исправлен (Fixed)"
    - "Проверен тестировщиком (Verified)"
    - "Закрыт (Closed)"

- id: qa.proc.bug_report_fields
  specializations: [qa]
  topic: process
  skills: [manual_testing]
  kind: multi_choice
  irt: {a: 1.0, b: -1.0}
  n_options: 5
  params:
    feature: {choice: [оплаты картой, загрузки аватара, экспорта отчёта, восстановления пароля]}
  stem: "Вы нашли дефект в функции {{feature}}. Что обязательно должно быть в баг-репорте, чтобы разработчик мог воспроизвести проблему?"
  options:
    correct:
      - "Шаги воспроизведения"
      - "Ожидаемый результат"
      - "Фактический результат"
      - "Окружение: версия сборки, браузер или устройство, ОС"
    wrong:
      - "Имя разработчика, который допустил ошибку"
      - "Оценка времени на исправление от тестировщика"
      - "Предлагаемый тестировщиком код исправления"
      - "Список всех тест-кейсов, прошедших успешно"

- id: qa.proc.testing_principles
  specializations: [qa]
  topic: process
  skills: [manual_testing, test_design]
  kind: multi_choice
  irt: {a: 1.0, b: -0.2}
  n_options: 5
  params:
    product: {choice: [мобильного банка, сервиса доставки, CRM-системы, онлайн-школы]}
  stem: "Руководитель проекта {{product}} спрашивает, что гарантирует тестирование. Какие утверждения соответствуют принципам тестирования ISTQB?"
  options:
    correct:
      - "Тестирование показывает наличие дефектов, но не доказывает их отсутствие"
      - "Исчерпывающее тестирование невозможно, кроме тривиальных случаев"
      - "Дефекты обычно скапливаются в небольшом числе модулей"
      - "Повторение одних и тех же тестов со временем перестаёт находить новые дефекты"
    wrong:
      - "Достаточное число тестов доказывает отсутствие дефектов"
      - "Чем позже начато тестирование, тем дешевле исправлять дефекты"
      - "Если дефектов не найдено, продукт гарантированно решает задачи пользователей"
      - "Автоматизация позволяет проверить все возможные входные данные"

- id: qa.proc.test_type_scenario
  specializations: [qa]
  topic: process
  skills: [manual_testing]
  kind: single_choice
  irt: {a: 1.1, b: 0.0}
  generator: qa.test_type_scenario

- id: qa.proc.defect_removal_efficiency
  specializations: [qa]
  topic: process
  skills: [manual_testing]
  kind: numeric
  irt: {a: 1.0, b: 0.3}
  time_limit_sec: 120
  params:
    before: {int: [40, 200]}
    after: {int: [3, 30]}
  stem: >-
    До релиза команда нашла {{before|дефект|дефекта|дефектов}}, после релиза пользователи сообщили ещё о {{after}}.
    Чему равна эффективность устранения дефектов (DRE = найдено до релиза / всего найдено × 100%)?
    Ответ в процентах, округлите до десятых.
  answer:
    expr: "round(100 * {{before}} / ({{before}} + {{after}}), 1)"
    tolerance: 0.1

- id: qa.proc.risk_based_regression
  specializations: [qa]
  topic: process
  skills: [manual_testing, test_design]
  kind: multi_choice
  irt: {a: 1.1, b: 1.0}
  n_options: 5
  params:
    total: {int: [600, 1200], step: 100}
    fit: {int: [150, 300], step: 50}
    days: {int: [1, 3]}
  stem: >-
    В регрессионном наборе {{total}} ручных тест-кейсов, а до релиза ({{days}} дн.) команда успевает
    выполнить около {{fit}}. Какие действия разумны?
  options:
    correct:
      - "Приоритизировать кейсы по риску: критичные бизнес-сценарии и области, затронутые изменениями"
      - "Провести анализ влияния изменений (impact analysis), чтобы выбрать связанные кейсы"
      - "Автоматизировать стабильные и часто повторяемые проверки для следующих релизов"
    wrong:
      - "Выполнить первые {{fit}} кейсов по порядку в тест-плане"
      - "Сократить каждый кейс до проверки первого шага"
      - "Пропустить регрессию, раз разработчики написали юнит-тесты"
      - "Выбрать кейсы случайным образом, чтобы покрытие было равномерным"

