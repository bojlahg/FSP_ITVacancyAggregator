- id: qa.api.negative_checks
  specializations: [qa]
  topic: api_testing
  skills: [api_testing, test_design]
  kind: multi_choice
  irt: {a: 1.0, b: -0.8}
  n_options: 5
  params:
    resource: {choice: [/api/v1/users, /api/v1/tickets, /api/v1/comments, /api/v1/products]}
    field: {choice: [name, title, text]}
    max: {choice: [50, 100, 255]}
  stem: >-
    Для POST {{resource}} поле {{field}} обязательно, это строка длиной от 1 до {{max}} символов, запрос
    требует токен. Какие проверки относятся к негативным?
  options:
    correct:
      - "Запрос без поля {{field}}"
      - "Поле {{field}} длиной на 1 символ больше {{max}}"
      - "Поле {{field}} передано числом вместо строки"
      - "Запрос без заголовка Authorization"
    wrong:
      - "Поле {{field}} длиной ровно {{max}} символов"
      - "Поле {{field}} длиной 1 символ"
      - "Корректный запрос со всеми полями и валидным токеном"
      - "Поле {{field}} с кириллицей длиной 10 символов"

- id: qa.api.idempotent_methods
  specializations: [qa]
  topic: api_testing
  skills: [api_testing, http]
  kind: multi_choice
  irt: {a: 1.1, b: -0.2}
  n_options: 5
  params:
    resource: {choice: [заказа, платежа, профиля, бронирования]}
  stem_variants:
    - "Клиент API {{resource}} автоматически повторяет запрос после таймаута. Какие HTTP-методы по RFC 9110 идемпотентны?"
    - "Проверяете, безопасно ли повторять запросы к API {{resource}}. Какие методы по RFC 9110 идемпотентны?"
  options:
    correct: [GET, PUT, DELETE, HEAD, OPTIONS]
    wrong: [POST, PATCH, CONNECT]

