- id: qa.api.jwt_checks
  specializations: [qa]
  topic: api_testing
  skills: [api_testing, oauth]
  kind: multi_choice
  irt: {a: 1.2, b: 1.1}
  n_options: 5
  params:
    service: {choice: [платёжного сервиса, личного кабинета, API партнёров, мобильного банка]}
  stem: "API {{service}} принимает JWT в заголовке Authorization: Bearer. Какие утверждения и проверки верны?"
  options:
    correct:
      - "Payload JWT не зашифрован: его может прочитать любой, у кого есть токен"
      - "Нужно проверить, что сервер отклоняет токен с alg: none"
      - "Токен с изменённым payload без новой подписи должен отклоняться"
      - "Токен с истёкшим exp должен приводить к 401"
    wrong:
      - "Подпись JWT шифрует payload, поэтому в нём можно хранить пароль"
      - "Сервер обязан хранить все выданные JWT, иначе подпись не проверить"
      - "Токен с истёкшим exp должен приводить к 403"
      - "Base64url-кодирование частей JWT защищает данные от чтения"

- id: qa.api.graphql_partial_error
  specializations: [qa]
  topic: api_testing
  skills: [api_testing, graphql]
  kind: single_choice
  status: pilot
  irt: {a: 1.0, b: 0.5}
  params:
    field: {choice: [reviews, recommendations, deliveryInfo]}
    root: {choice: [product, order, user]}
  stem: >-
    GraphQL-запрос { {{root}}(id: 1) { name {{field}} { id } } } выполняется, но резолвер поля {{field}}
    падает с ошибкой. Как обычно выглядит ответ сервера (application/json) и что проверить?
  options:
    correct:
      - "HTTP 200; в теле есть data с частичными данными ({{field}}: null) и массив errors с path к {{field}}"
    wrong:
      - "HTTP 500 и пустое тело"
      - "HTTP 404, потому что поле {{field}} не найдено"
      - "HTTP 200 и только data без errors: ошибки резолверов не возвращаются"
      - "HTTP 400, потому что запрос считается синтаксически неверным"
