- id: qa.web.accessibility
  status: showcase
  specializations: [qa]
  topic: web_mobile
  skills: [manual_testing]
  kind: multi_choice
  irt: {a: 1.0, b: 0.2}
  n_options: 5
  params:
    page: {choice: [оформления заказа, регистрации, личного кабинета, поиска билетов, записи к врачу]}
  stem_variants:
    - "Какие проверки относятся к проверке доступности (accessibility, WCAG) страницы {{page}}?"
    - "Страницу {{page}} проверяют на соответствие WCAG. Что из списка входит в такую проверку?"
  options:
    correct:
      - "У информативных изображений есть текстовая альтернатива (alt)"
      - "Всеми элементами можно управлять с клавиатуры, фокус виден и идёт в логичном порядке"
      - "Контраст обычного текста с фоном не ниже 4,5:1 (уровень AA)"
      - "У полей формы есть связанные подписи (label), которые читает скринридер"
    wrong:
      - "Страница загружается быстрее 2 секунд"
      - "Пароль хранится в базе в виде хеша"
      - "Контраст 2:1 достаточен для уровня AA, если шрифт жирный 12px"
      - "Ошибки формы обозначены только красным цветом рамки, без текста"
      - "На странице нет горизонтальной прокрутки на десктопе 1920 px"

- id: qa.web.cookie_flags
  specializations: [qa]
  topic: web_mobile
  skills: [manual_testing, owasp]
  kind: multi_choice
  irt: {a: 1.1, b: 0.6}
  n_options: 5
  params:
    name: {choice: [session_id, sid, auth_token, JSESSIONID]}
    site: {choice: [онлайн-банка, интернет-магазина, личного кабинета, CRM]}
  stem: "Cookie {{name}} сайта {{site}} выставлена с флагами HttpOnly; Secure; SameSite=Strict. Какие утверждения верны?"
  options:
    correct:
      - "Из JavaScript её не прочитать через document.cookie"
      - "Браузер отправляет её только по HTTPS"
      - "Браузер не отправит её при переходе на сайт по ссылке с другого домена"
      - "HttpOnly снижает ущерб от XSS: скрипт не украдёт значение {{name}}"
    wrong:
      - "HttpOnly шифрует значение cookie"
      - "Secure запрещает пользователю видеть cookie в DevTools"
      - "SameSite=Strict запрещает отправлять cookie на поддомены того же сайта"
      - "С этими флагами сайт полностью защищён от XSS и CSRF, проверять их не нужно"

- id: qa.mob.app_lifecycle
  specializations: [qa]
  topic: web_mobile
  skills: [manual_testing, android]
  kind: multi_choice
  irt: {a: 1.2, b: 1.4}
  n_options: 5
  params:
    app: {choice: [такси, доставки еды, мобильного банка, маркетплейса]}
    screen: {choice: [оформления заказа, перевода денег, заполнения анкеты, редактирования профиля]}
  stem: >-
    Тестируете Android-приложение {{app}}: на экране {{screen}} пользователь вводит данные. Какие
    утверждения о жизненном цикле и соответствующие проверки верны?
  options:
    correct:
      - "При повороте экрана Activity по умолчанию пересоздаётся, и несохранённое состояние может потеряться"
      - "Свёрнутое приложение система может завершить; при возврате экран восстанавливается из сохранённого состояния"
      - "Опция разработчика «Не сохранять действия» (Don't keep activities) помогает воспроизвести уничтожение Activity"
      - "Смену языка или темы системы стоит проверить так же, как поворот: это тоже смена конфигурации"
    wrong:
      - "Свёрнутое приложение Android никогда не выгружается из памяти, пока пользователь его не закроет"
      - "При повороте экрана вызывается только onResume, состояние всегда сохраняется"
      - "Проверки жизненного цикла нужны только на эмуляторе, на реальных устройствах поведение иное"
      - "Если приложение пережило сворачивание на 5 секунд, восстановление после завершения процесса проверять не нужно"

# --- Senior ---

- id: qa.web.samesite_lax
  specializations: [qa]
  topic: web_mobile
  skills: [manual_testing, owasp, http]
  kind: multi_choice
  irt: {a: 1.3, b: 1.5}
  time_limit_sec: 120
  n_options: 5
  params:
    site: {choice: [shop, bank, clinic, school, travel]}
  stem_variants:
    - >-
      Сессионная cookie сайта https://{{site}}.ru выставлена с атрибутами SameSite=Lax; Secure; HttpOnly,
      пользователь залогинен. В каких случаях браузер отправит эту cookie на {{site}}.ru?
    - >-
      Проверяете защиту от CSRF на https://{{site}}.ru: сессия хранится в cookie с SameSite=Lax (атрибут задан
      явно). Пользователь залогинен. Когда браузер приложит эту cookie к запросу на {{site}}.ru?
  options:
    correct:
      - "Пользователь переходит по обычной ссылке со стороннего сайта на страницу {{site}}.ru"
      - "Сторонний сайт отправляет форму методом GET, и браузер переходит на {{site}}.ru"
      - "Скрипт страницы https://{{site}}.ru делает fetch('/api/profile') на тот же источник"
      - "Пользователь вводит адрес {{site}}.ru в адресной строке"
    wrong:
      - "Сторонний сайт отправляет форму методом POST на {{site}}.ru"
      - "Сторонний сайт показывает картинку <img src=\"https://{{site}}.ru/avatar.png\">"
      - "Скрипт стороннего сайта делает fetch к {{site}}.ru с credentials: 'include'"
      - "Сторонний сайт встраивает {{site}}.ru во <iframe>"
