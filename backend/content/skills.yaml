# Онтология навыков — docs/implementation.md §5.3 (формат из docs/early сохранён).
# Поля: id (snake_case, уникален), name, family, parent (id навыка или null), aliases.
# family ∈ {language, backend, frontend, mobile, data, ml, devops, qa, database,
#           messaging, architecture, security, tools, analysis, gamedev}
# parent даёт частичный кредит при матчинге: «фреймворк → его язык», «диалект → sql»,
#   «инструмент → общий навык» (FastAPI требуется, у кандидата только Python).
# aliases — в нижнем регистре, уникальны по всему файлу и не совпадают с id других
#   навыков; включают name в нижнем регистре, русские написания и сокращения.

