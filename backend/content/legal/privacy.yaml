# Политика обработки персональных данных (152-ФЗ ст. 18.1) — docs/implementation.md §13.1.
title: Политика обработки персональных данных
summary: >-
  Как ITScout обрабатывает персональные данные кандидатов и представителей работодателей: зачем,
  какие данные, на каком основании, сколько хранит и как реализовать свои права.
sections:
  - heading: Оператор
    paragraphs:
      - "Оператор персональных данных: {operator}. Обращения по вопросам обработки данных — {contact_email}."
      - "Политика действует для сайта itscout.ru и его API. Текущая редакция всегда опубликована на этой странице."

  - heading: Цели обработки
    items:
      - "Регистрация и вход, работа личного кабинета."
      - "Определение категории «специализация × грейд» по результатам теста."
      - "Показ профиля кандидата работодателям и подбор кандидатов под потребности (см. правила рекомендательных технологий)."
      - "Приглашения, отклики и раскрытие контактов после согласия кандидата."
      - "Импорт подтверждённых достижений из реестра ФСП — по отдельному согласию кандидата."
      - "Уведомления на почту о событиях подбора (отключаются в настройках)."
      - "Безопасность сервиса и журнал юридически значимых действий."

  - heading: Какие данные обрабатываются
    items:
      - "Учётная запись: email, хэш пароля, роль, даты регистрации и подтверждения почты."
      - "Профиль кандидата: имя, фамилия, отчество, телефон, Telegram, контактный email, город, готовность к переезду, формат работы, ожидания по зарплате, стаж, специализация, роли, отрасли, навыки, опыт работы, «О себе»."
      - "Резюме в PDF и извлечённый из него текст — если кандидат загрузил резюме."
      - "Ответы на опрос и тест, время ответов, θ̂ и SE, категория, перцентиль, ответы на открытые вопросы и задания работодателей, сигналы честности попытки."
      - "Данные ФСП: ФСП ID, результаты соревнований, разряды, роль в команде."
      - "Профиль работодателя: название компании, ИНН, контактное лицо, email, телефон, Telegram."
      - "Технические данные: IP-адрес для ограничения частоты запросов, журнал согласий и раскрытия контактов."
    paragraphs:
      - "Пол, возраст, дату рождения, фото, национальность, гражданство и другие специальные категории персональных данных ITScout не запрашивает."

  - heading: Правовые основания
    items:
      - "Согласие на обработку персональных данных (ст. 6 ч. 1 п. 1, ст. 9 152-ФЗ) — отдельный документ, даётся при регистрации."
      - "Согласие на распространение — публикацию профиля работодателям (ст. 10.1 152-ФЗ) — отдельный документ, даётся кандидатом и отзывается в настройках."
      - "Согласие на импорт данных из реестра ФСП — даётся при привязке ФСП ID."

  - heading: Кому передаются данные
    items:
      - "Работодателям на платформе — обезличенная карточка кандидата по согласию на публикацию; контакты — только после принятия приглашения или отклика самого кандидата."
      - "Yandex Cloud (ООО «Яндекс.Облако»), сервис Yandex AI Studio, — обработчик по поручению оператора: разбор текста резюме и потребностей, проверка ответов по чек-листу. Сохранение запросов на стороне Yandex отключено. Модель не выставляет грейд и не решает, кого показывать."
      - "Реестр ФСП — источник данных: ITScout запрашивает результаты по ФСП ID, указанному кандидатом, и не передаёт реестру данные профиля."
      - "Системы подбора (ATS), которые подключил работодатель, — только то, что этот работодатель и так видит в кабинете."

  - heading: Где хранятся данные
    paragraphs:
      - "Базы данных и файлы находятся на серверах в России. Языковая модель работает в Yandex Cloud в России. Трансграничной передачи персональных данных нет."

  - heading: Сроки хранения
    items:
      - "Данные профиля — пока действует аккаунт и согласие на обработку."
      - "После удаления аккаунта ФИО и контакты стираются сразу, резюме, опыт работы и данные ФСП удаляются; результаты теста остаются без ФИО и контактов — для статистики теста."
      - "Данные ФСП удаляются сразу при отзыве согласия на импорт."
      - "Журнал согласий и раскрытия контактов хранится без ФИО и контактов — как подтверждение законности обработки."

  - heading: Права пользователя
    items:
      - "Узнать, какие данные обрабатываются, и получить их копию — запросом на {contact_email}."
      - "Исправить данные — в профиле или запросом."
      - "Отозвать согласие на публикацию профиля и на импорт ФСП — в настройках, в любой момент."
      - "Отозвать согласие на обработку и удалить данные — кнопкой «Удалить аккаунт» в настройках."
      - "Возразить против решения, принятого на основании автоматизированной обработки (ст. 16 152-ФЗ): кнопка «Оспорить» в разделе «Категория и грейд». Обращение рассматривает человек."
      - "Обжаловать действия оператора в Роскомнадзоре или в суде."
    paragraphs:
      - "На запросы оператор отвечает в течение 10 рабочих дней (ст. 20 152-ФЗ)."

  - heading: Защита данных
    items:
      - "Пароли хранятся как хэш argon2id, сессии — короткоживущие токены, в базе только хэши refresh-токенов."
      - "Доступ к данным проверяется на уровне каждого объекта: кандидат видит только свои приглашения и отклики, работодатель — только свои потребности."
      - "Контакты кандидата раскрываются только после его согласия, каждое раскрытие записывается в журнал."
      - "Резервные копии хранятся 7 дней."
