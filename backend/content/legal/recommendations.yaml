# Правила применения рекомендательных технологий (149-ФЗ ст. 10.2-2) — docs/implementation.md §13.1.
# Числа не пишем руками: {плейсхолдеры} подставляет backend из content/matching.yaml, blueprints.yaml и настроек.
title: Правила применения рекомендательных технологий
summary: >-
  ITScout использует рекомендательные технологии: подбирает кандидатов под потребность работодателя
  и вакансии под профиль кандидата. Здесь описано, какие данные для этого используются, как устроен
  расчёт и как от рекомендаций отказаться.
sections:
  - heading: Где применяются рекомендации
    items:
      - "Подборка кандидатов под потребность работодателя: список категорий «специализация × грейд» и кандидатов с оценкой соответствия от 0 до 100 и объяснением."
      - "Поиск по базе и каталог категорий без потребности: порядок кандидатов внутри категории по силе подтверждённого профиля."
      - "Вакансии для кандидата: оценка соответствия вакансии его профилю с объяснением."
      - "Рынок категории в кабинете кандидата: агрегаты по потребностям и подсказки, что поможет."

  - heading: Какие данные используются
    items:
      - "Результат теста: оценка способности θ̂ на шкале специализации, грейд и специализация (категория), перцентиль внутри категории, доли верных ответов по темам."
      - "Навыки и их статус: проверено тестом, подтверждено ФСП или заданием, заявлено самим кандидатом."
      - "Подтверждённые достижения из реестра ФСП (место, уровень и дата соревнования, роль в команде) — только если кандидат сам привязал ФСП ID и дал согласие на импорт."
      - "Дата последнего подтверждённого действия (тест, задание, результат ФСП) — для свежести."
      - "Условия кандидата: ожидания по зарплате, формат работы, город и готовность к переезду."
      - "Условия потребности или вакансии: специализация, грейд, обязательные и желательные навыки, формат, город, вилка зарплаты."
    paragraphs:
      - "Источники данных: ответы кандидата в опросе и тесте, поля профиля, которые он заполнил или подтвердил, реестр ФСП (по согласию кандидата), потребности и вакансии работодателей."

  - heading: Какие данные не используются
    items:
      - "Пол, возраст и дата рождения, фото, национальность, гражданство, место рождения, семейное положение — ITScout их не собирает, и они не участвуют ни в оценке, ни в фильтрах."
      - "Текст резюме и описания опыта работы: резюме только предзаполняет профиль, навыки из него получают статус «заявлено»."
      - "ФИО и контакты кандидата."
      - "История просмотров и поведение на сайте: рекомендации не строятся по кликам."
      - "Отсутствие данных ФСП не снижает оценку: компонент ФСП только добавляет баллы тем, у кого есть подтверждённые результаты."

  - heading: Как считается оценка соответствия
    paragraphs:
      - "Оценка соответствия кандидата потребности: match = 100 × Σ (вес × компонент), каждый компонент от 0 до 1. Объяснение в карточке («Категория совпадает», «PostgreSQL — проверено тестом», «Ожидания выше вилки») собирается тем же кодом из тех же компонентов, поэтому всегда совпадает с оценкой."
    table:
      columns: [Компонент, Вес, Как считается]
      rows:
        - ["Навыки", "{w_skills}", "Покрытие стека потребности: обязательный навык весит {required_weight}, желательный — {optional_weight}. Ценность навыка: проверен тестом — {sv_verified}, подтверждён ФСП или заданием — {sv_fsp}, заявлен — {sv_declared}, есть только родительский навык — {sv_parent}."]
        - ["Сила по тесту", "{w_strength}", "{ability_share} × насколько θ̂ выше порога грейда + {topic_share} × доля верных по темам, важным для стека. Если кандидат по тесту уже перерос грейд потребности, это показывается в объяснении и снижает компонент."]
        - ["Категория", "{w_category}", "Та же специализация и грейд — {fit_exact}; смежная специализация — {fit_adj_spec}; соседний грейд — {fit_adj_grade}; и то и другое — {fit_adj_both}. Грейд не подтверждён тестом (категории нет, специализация из опроса) — {fit_unconfirmed}, сила по тесту — 0; такие кандидаты той же специализации показываются отдельным блоком после всех кандидатов с категорией. Остальные категории в подборку не попадают."]
        - ["ФСП", "{w_fsp}", "Сила подтверждённой компетенции ФСП с учётом её связи со специализацией. Нет данных ФСП — 0, без штрафа."]
        - ["Свежесть", "{w_fresh}", "Вклад подтверждённого действия уменьшается вдвое каждые {half_life_days} дней."]
        - ["Условия", "{w_conditions}", "{salary_share} × совпадение зарплаты + {format_share} × совпадение формата. Ожидания выше вилки на {salary_tolerance_pct} % и больше дают 0 по зарплате."]
  - heading: Порядок без потребности
    paragraphs:
      - "В каталоге и поиске по базе кандидаты внутри категории упорядочены по силе подтверждённого профиля: {vps_percentile} × перцентиль θ̂ в категории + {vps_fsp} × ФСП + {vps_fresh} × свежесть + {vps_approach} × оценка ответа на открытый вопрос о подходе. Если оценки подхода нет, остальные слагаемые нормируются на свою сумму — её отсутствие не считается нулём."
      - "Кандидаты без подтверждённого тестом грейда показываются в поиске после всех кандидатов с категорией, с пометкой «Грейд не подтверждён»; фильтр по грейду их не находит. Платформа может отключить их показ."
      - "Фильтры подборки (формат, город, зарплата) не прячут кандидатов: не прошедшие фильтр показываются отдельным блоком с причиной."

  - heading: Как определяется грейд
    paragraphs:
      - "Категорию определяет только тест. θ̂ сравнивается с порогами грейдов на шкале специализации: стажёр {cut_intern}, junior {cut_junior}, middle {cut_middle}, senior {cut_senior}. Резюме, опрос и языковая модель грейд не выставляют."
      - "Кандидат видит в кабинете, как определён его грейд, и может оспорить результат: обращение рассматривает человек."

  - heading: Роль языковой модели (LLM)
    paragraphs:
      - "ITScout использует YandexGPT через Yandex AI Studio (Yandex Cloud, данные обрабатываются в России). Модель:"
    items:
      - "разбирает текст резюме и описание потребности в поля формы — пользователь проверяет и подтверждает результат;"
      - "отмечает, какие пункты чек-листа выполнены в ответе на открытый вопрос и в задании работодателя. Долю выполненных пунктов считает код; в порядке каталога без потребности она весит {vps_approach}, в оценку соответствия под потребность и в грейд не входит."
      - "Модель не выставляет грейд и оценку соответствия, не решает, кого показывать работодателю, и не участвует в объяснении выдачи. Оценка открытого ответа не входит в θ̂."

  - heading: Решения принимает человек
    paragraphs:
      - "Рекомендации только упорядочивают список. Пригласить кандидата решает работодатель, принять приглашение или откликнуться — кандидат. Контакты открываются только после согласия кандидата."

  - heading: Как отказаться от рекомендаций
    items:
      - "Статус поиска «Не ищу» в настройках — профиль сразу исчезает из подборок и поиска."
      - "Отзыв согласия на публикацию профиля в настройках — то же, с записью об отзыве."
      - "Скрыть профиль от выбранных компаний, например от текущего работодателя."
      - "Удаление аккаунта — данные обезличиваются, профиль удаляется из выдачи."

  - heading: Контакты
    paragraphs:
      - "Оператор: {operator}. Вопросы о рекомендациях и обработке данных — {contact_email}."
