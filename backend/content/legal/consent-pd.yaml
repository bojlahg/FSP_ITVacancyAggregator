# Согласие на обработку персональных данных (152-ФЗ ст. 9, отдельный документ с 01.09.2025).
# Версия текста записывается в consents.policy_version при регистрации.
title: Согласие на обработку персональных данных
summary: >-
  Отмечая это согласие при регистрации, вы свободно, своей волей и в своём интересе разрешаете
  оператору ITScout обрабатывать ваши персональные данные на условиях ниже.
sections:
  - heading: Оператор
    paragraphs:
      - "{operator}. Контакт: {contact_email}."

  - heading: Цели
    items:
      - "Регистрация, вход и работа личного кабинета."
      - "Проведение теста и определение категории «специализация × грейд»."
      - "Подбор: расчёт соответствия кандидатов потребностям и вакансиям, приглашения и отклики."
      - "Уведомления на почту о событиях подбора."

  - heading: Какие данные
    items:
      - "Email и пароль (хранится только хэш)."
      - "Данные профиля, которые вы заполните: ФИО, контакты, город, формат работы, ожидания по зарплате, стаж, навыки, опыт работы, «О себе»; для работодателя — данные компании и контактного лица."
      - "Резюме, если вы его загрузите."
      - "Ответы на опрос, тест, открытые вопросы и задания, время ответов и результаты."

  - heading: Действия с данными
    paragraphs:
      - "Сбор, запись, систематизация, накопление, хранение, уточнение, извлечение, использование, передача обработчику по поручению, обезличивание, блокирование, удаление и уничтожение — с использованием средств автоматизации."
      - "Категорию и грейд определяет автоматизированный тест, порядок кандидатов в подборке — рекомендательный алгоритм. Решение о приглашении принимает работодатель, о принятии — вы. Результат теста можно оспорить: возражение рассматривает человек."

  - heading: Обработчик по поручению
    paragraphs:
      - "Yandex Cloud (ООО «Яндекс.Облако»), сервис Yandex AI Studio, — разбор текста резюме в поля профиля и проверка ответов на открытые вопросы по чек-листу. Данные обрабатываются в России. Модель не выставляет грейд и не решает, кого показывать работодателю."

  - heading: Источник данных ФСП
    paragraphs:
      - "Если вы привяжете ФСП ID и отдельно согласитесь на импорт, ITScout получит ваши результаты из реестра Федерации спортивного программирования. Без этого согласия данные ФСП не запрашиваются."

  - heading: Срок и отзыв
    paragraphs:
      - "Согласие действует до удаления аккаунта. Отозвать его можно кнопкой «Удалить аккаунт» в настройках (у соискателя) или письмом на {contact_email}: данные профиля будут обезличены и удалены, профиль исчезнет из выдачи."
      - "Подробности — в политике обработки персональных данных."
