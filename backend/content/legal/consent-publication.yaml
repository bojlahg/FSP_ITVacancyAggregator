# Согласие на распространение персональных данных (152-ФЗ ст. 10.1): публикация профиля работодателям.
# Версия текста записывается в consents.policy_version; отзыв — в настройках кандидата.
title: Согласие на публикацию профиля работодателям
summary: >-
  Это отдельное согласие на распространение персональных данных (ст. 10.1 152-ФЗ). Оно нужно, чтобы
  зарегистрированные на ITScout работодатели могли найти ваш профиль в поиске и подборках.
sections:
  - heading: Оператор
    paragraphs:
      - "{operator}. Контакт: {contact_email}."

  - heading: Кому видны данные
    paragraphs:
      - "Работодателям, зарегистрированным на itscout.ru, — в поиске по базе, каталоге категорий и подборках под их потребности. Публично в интернете профиль не показывается."

  - heading: Что видят работодатели
    items:
      - "Имя и первую букву фамилии (полную фамилию — если вы включите это в настройках приватности)."
      - "Категорию, грейд, перцентиль, результаты теста по темам и пометку «стоит перепроверить», если попытка была нетипичной; статусы навыков."
      - "Город, формат работы, готовность к переезду, стаж, роли, отрасли и soft skills."
      - "«О себе» и опыт работы — без названий компаний, email, телефонов, Telegram и ссылок до раскрытия контактов."
      - "Ожидания по зарплате — если не скрыты в настройках приватности."
      - "Достижения ФСП — если вы их импортировали и не скрыли."
      - "Ответы на открытые вопросы и задания — без контактов и ссылок."

  - heading: Запреты и условия
    items:
      - "Телефон, Telegram и email не распространяются: работодатель получает их только после того, как вы примете его приглашение или сами откликнетесь на вакансию."
      - "Можно скрыть профиль от выбранных компаний, например от текущего работодателя."
      - "Работодатели не вправе передавать данные из профиля третьим лицам."

  - heading: Срок и отзыв
    paragraphs:
      - "Согласие действует, пока вы его не отзовёте. Отозвать можно в любой момент в настройках («Согласия») или письмом на {contact_email}. После отзыва профиль сразу исчезает из поиска и подборок; уже принятые приглашения и открытые контакты сохраняются у тех работодателей, которым вы их открыли."
