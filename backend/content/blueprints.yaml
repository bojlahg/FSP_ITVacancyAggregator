# Blueprint'ы тестов и параметры шкалы — docs/implementation.md §10.3–10.4.
# Числа стартовые; проверяются процедурой валидации (§12). Сумма topics на специализацию = stage1 + stage2.

scale:
  # Пороги грейдов на IRT-шкале специализации (логиты). Окончательные — по modified Angoff (§10.4, content/angoff.yaml).
  cuts: {intern: -1.8, junior: -0.8, middle: 0.2, senior: 1.2}
  # Маршрут второго этапа: θ̂ выше cut_G + split — блок у следующего порога; ниже cut_G − split — блок ниже.
  stage_split: 0.3

modes:
  full:
    stage1_items: 9
    stage2_items: 9
    extra_items_max: 4
    pilot_slots: 2
  # TEST_MODE=short — сокращённый тест для демо жюри
  short:
    stage1_items: 4
    stage2_items: 4
    extra_items_max: 2
    pilot_slots: 0

selection:
  window: 0.6            # стартовое окно сложности |b − цель|, расширяется при нехватке шаблонов
  exposure_cap: 0.25     # шаблоны с долей показов выше — временно исключаются
  exposure_strength: 10  # вес шаблона ∝ exp(−((b − цель)/окно)²) / (1 + exposure_strength · доля показов)
  window_step: 0.4       # на сколько расширяется окно, если в нём нет шаблонов
  edge_offset: 1.0       # цель второго этапа выше Senior / ниже Intern: порог ± edge_offset
  open_candidates: 3     # открытый вопрос — случайный из стольких, ближайших по b к порогу грейда
verify_skill: {min_items: 2, min_share: 0.7}
open_approach_from_grade: middle

# «Проверка под вакансию» (§10.7): насколько навыки вакансии смещают веса тем blueprint'а.
# Каждый обязательный навык добавляет boost_required к весу своей темы, желательный — boost_optional;
# затем веса снова делятся на прежнее число заданий методом наибольшего остатка.
vacancy:
  boost_required: 2
  boost_optional: 1
  sample_items: 3

