# Признаки мошеннического приглашения (§8.5, docs/research/integrity.md): кандидату показываем
# предупреждение рядом с приглашением, работодателю ничего не блокируем — решает кандидат и модерация по жалобе.
# Все правила — warn: формулировки бывают и у честных компаний.
context_chars: 25
rules:
  - id: payment
    severity: warn
    label: оплата от кандидата
    message: "Честный работодатель не берёт деньги за обучение, оформление или «пакет документов»."
    patterns:
      - '\b(?:платн\w*|оплат\w*|стоимост\w*|взнос\w*|предоплат\w*)\s+(?:\w+\s+){0,2}(?:обучени\w*|стажировк\w*|курс\w*|оформлени\w*|материал\w*)(?![^.\n]{0,30}(?:за\s+сч[её]т\s+компани|компани\w*\s+берёт))'
      - '\bобучени\w*\s+за\s+(?:свой|ваш)\s+сч[её]т'
      - '\bстраховой\s+(?:взнос|депозит)\w*'
  - id: crypto
    severity: warn
    label: криптовалюта и «быстрый заработок»
    message: "Зарплата в криптовалюте, «пассивный доход» и обещания быстрого заработка — частые признаки мошенничества."
    patterns:
      - '\b(?:usdt|крипт\w*|биткоин\w*|bitcoin)\b'
      - '\bпассивн\w*\s+доход\w*'
      - '\bзаработ\w*\s+от\s+\d[\d\s]*\s*(?:₽|руб\w*|т\.?\s*р\.?)?\s*в\s+(?:день|сутки|неделю)'
  - id: messenger
    severity: warn
    label: уход в мессенджер
    message: "Просьба срочно перейти в мессенджер до принятия приглашения уводит переписку с площадки. Контакты откроются после принятия."
    patterns:
      - '\b(?:пиши\w*|напиши\w*|свяжи\w*|добав\w*|переход\w*|перейди\w*)\s+(?:\w+\s+){0,2}(?:в|во)\s+(?:telegram|телеграм\w*|тг|whatsapp|ватсап\w*|вотсап\w*)'
      - '(?:t\.me|wa\.me)/\w+'
      - '(?<![\w.])@[a-z0-9_]{5,32}\b'
  - id: documents
    severity: warn
    label: персональные данные и деньги
    message: "Не отправляйте фото паспорта, данные карты, коды из СМС и не открывайте счета «для зарплаты» до оформления."
    patterns:
      - '\b(?:фото|скан\w*|копи\w*)\s+паспорт\w*'
      - '\b(?:номер|данные|реквизит\w*)\s+(?:вашей\s+)?карт\w*'
      - '\bкод\w*\s+из\s+(?:смс|sms)'
      - '\bоформ\w*\s+(?:на\s+себя\s+)?(?:карт\w*|сим\w*|ип)\b'
