# Регулярные задания — docs/implementation.md §11.
# Кандидату категории предлагается одно задание раз в offer_interval_days, не больше одного активного.
offer_interval_days: 7
# Сколько дней кандидат может решать предложенное задание
due_days: 7
# Автопроверяемое задание подтверждает навыки шаблона при score не ниже порога (0/1 для IRT-заданий)
confirm_min_score: 1.0
# Критериев в чек-листе задания на подход (§10.5: 4–6 бинарных; допускаем от 0 — тогда только оценка работодателя)
rubric_max: 6
