# Modified Angoff для порогов грейдов — docs/implementation.md §10.4, §12.4.
# Набор шаблонов на пару «специализация × граница грейда»: items активных автопроверяемых шаблонов
# с |b − cut_грейда| ≤ window (окно расширяется на window_step, пока шаблонов меньше items).
# Отобранные шаблоны упорядочены по b и делятся на items равных групп; из каждой группы берётся один
# шаблон по хэшу «специализация:грейд:id» — так набор детерминирован и покрывает весь диапазон сложности.
items: 12
window: 1.5
window_step: 0.5
# seed экземпляра, который видит эксперт (рендер без ключа ответа, как на странице «Как работает тест»)
instance_seed: 1
# Шаг шкалы оценки в интерфейсе: 0,05 = 5 процентных пунктов
rating_step: 0.05

# Два раунда (§12.4): после раунда 1 эксперт видит данные о последствиях (impact data) — распределение
# кандидатов по грейдам при действующих и предложенных порогах, медиану и разброс оценок группы — и может
# пересмотреть оценки в раунде 2. Рекомендуемый порог — по раунду 2, если его прошёл хотя бы один эксперт.
# Рекомендация по числу экспертов: SE = SD/√k; при меньшем числе сводка предупреждает (Cizek & Bunch, 2007)
recommended_raters: 8
# Медиана и разброс группы по заданию показываются в раунде 2, только если раунд 1 прошли столько экспертов:
# при одном эксперте «группа» — это он сам
feedback_min_raters: 2

impact:
  # Кандидаты — последняя завершённая попытка каждого кандидата в специализации (θ̂ на шкале специализации).
  # Если их меньше min_candidates, распределение строится на синтетической популяции (как в validation/)
  min_candidates: 30
  synthetic:
    size: 2000
    seed: 2026
    grade_share: {below: 5, intern: 10, junior: 30, middle: 33, senior: 22}
    theta_mean: {below: -2.4, intern: -1.3, junior: -0.3, middle: 0.7, senior: 1.75}
    theta_sd: 0.35

# Проверка Hofstee (1983): эксперт задаёт допустимые порог (доля верных по набору у минимально компетентного)
# и долю кандидатов специализации, не дотягивающих до грейда. Значения по умолчанию в форме — доли;
# доли «не дотягивают» растут с грейдом: до Senior не дотягивает большинство
hofstee_defaults:
  intern: {min_cut: 0.40, max_cut: 0.70, min_fail: 0.02, max_fail: 0.15}
  junior: {min_cut: 0.40, max_cut: 0.70, min_fail: 0.10, max_fail: 0.30}
  middle: {min_cut: 0.40, max_cut: 0.70, min_fail: 0.30, max_fail: 0.60}
  senior: {min_cut: 0.40, max_cut: 0.70, min_fail: 0.60, max_fail: 0.90}
