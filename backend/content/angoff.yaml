# Modified Angoff для порогов грейдов — docs/implementation.md §10.4, §12.4.
# Набор шаблонов на пару «специализация × граница грейда»: items активных автопроверяемых шаблонов
# с |b − cut_грейда| ≤ window (окно расширяется на window_step, пока шаблонов меньше items).
# Отобранные шаблоны упорядочены по b и делятся на items равных групп; из каждой группы берётся один
# шаблон по хэшу «специализация:грейд:id» — так набор детерминирован и покрывает весь диапазон сложности.
items: 12
window: 1.5
window_step: 0.5
# seed экземпляра, который видит эксперт (рендер без ключа ответа, как на странице «Как работает тест»)
instance_seed: 1
# Шаг шкалы оценки в интерфейсе: 0,05 = 5 процентных пунктов
rating_step: 0.05
