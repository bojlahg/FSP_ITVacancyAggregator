name: CI / Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# PR — отменяем устаревший прогон; push в master — нет: иначе новый коммит обрывает идущий деплой
# посреди `docker compose up`. Прогоны master идут по очереди (ждущий заменяется более новым), порядок деплоя сохраняется.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEPLOY_HOST: 94.103.87.151
  DEPLOY_PATH: /opt/itscout/app
  # Публичный ключ хоста сервера (проверен по /etc/ssh/ssh_host_ed25519_key.pub)
  DEPLOY_KNOWN_HOST: "94.103.87.151 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINVPCF8guOIy7eb6bXHzy+zNJMVjJWGJSWFBpm6740MA"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itscout
          POSTGRES_PASSWORD: itscout
          POSTGRES_DB: itscout
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U itscout" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://itscout:itscout@localhost:5432/itscout
      # Тесты PDF-профиля в CI обязательны: без библиотек WeasyPrint они падают, а не пропускаются
      REQUIRE_WEASYPRINT: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: System libraries for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . ../validation && uv run ruff format --check . ../validation
      - name: Migrations apply from scratch and match models
        run: uv run alembic upgrade head && uv run alembic check
      - name: Tests
        run: uv run pytest -q
      - name: OpenAPI is up to date
        run: uv run python -m app.scripts.export_openapi --check

  fsp-mock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fsp-mock
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: API client is generated from current openapi.json
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run build

  deploy:
    needs: [backend, fsp-mock, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: SSH setup
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "$DEPLOY_KNOWN_HOST" > ~/.ssh/known_hosts
      - name: Upload sources
        run: |
          rsync -az --delete \
            --exclude '.git/' --exclude '.env' --exclude 'node_modules/' --exclude '.venv/' \
            --exclude 'frontend/dist/' --exclude '__pycache__/' \
            -e "ssh -i ~/.ssh/deploy" ./ "root@${DEPLOY_HOST}:${DEPLOY_PATH}/"
      - name: Build and restart
        run: |
          ssh -i ~/.ssh/deploy "root@${DEPLOY_HOST}" "cd ${DEPLOY_PATH} && \
            docker compose --env-file .env -f infra/docker-compose.yml up -d --build --remove-orphans && \
            docker image prune -f >/dev/null"
      - name: Smoke test
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "http://${DEPLOY_HOST}/api/v1/health" | grep -q '"db":true'; then
              echo "healthy"; exit 0
            fi
            sleep 5
          done
          echo "health check failed"; exit 1

  # Демо-сценарий §18 (шаги 1–9) против прода после каждого деплоя; героев показа не трогает
  e2e:
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: e2e-prod
      cancel-in-progress: false
    env:
      E2E_BASE_URL: https://itscout.ru
      # Пароль служебного кандидата e2e — тот же, что E2E_CANDIDATE_PASSWORD в .env сервера (docs/deploy.md §5.5)
      E2E_CANDIDATE_PASSWORD: ${{ secrets.E2E_CANDIDATE_PASSWORD }}
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright against production
        run: npx playwright test
      # Только скриншоты: трейсы, видео и HTML-отчёт содержат значения fill() (пароль) и refresh-cookie,
      # а артефакты станут публичными вместе с репозиторием (playwright.config.ts их и не пишет)
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
