name: Server ops

# Операции с продом без SSH-доступа у разработчика: `gh workflow run server-ops.yml -f action=status`.
# Только фиксированный набор действий — произвольные команды на сервере отсюда не выполняются.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "status | logs | reseed | restart | swap | llm-check | backup | backups"
        required: true
        type: choice
        options: [status, logs, reseed, restart, swap, llm-check, backup, backups]
      service:
        description: "Сервис для logs/restart"
        required: false
        default: backend
        type: choice
        options: [backend, web, db, keycloak, fsp-mock, mail, backup]
      lines:
        description: "Сколько строк логов"
        required: false
        default: "200"

# GITHUB_TOKEN нужен только для checkout
permissions:
  contents: read

env:
  DEPLOY_HOST: 94.103.87.151
  DEPLOY_PATH: /opt/itscout/app
  DEPLOY_KNOWN_HOST: "94.103.87.151 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINVPCF8guOIy7eb6bXHzy+zNJMVjJWGJSWFBpm6740MA"

jobs:
  run:
    runs-on: ubuntu-latest
    # Не пересекаемся с деплоем
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: SSH setup
        # Секрет — через env, а не подстановкой в текст скрипта
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "$DEPLOY_KNOWN_HOST" > ~/.ssh/known_hosts
      # Только скрипты из infra/scripts (для action=swap), без LFS
      - uses: actions/checkout@v7
        with:
          sparse-checkout: infra/scripts
      - name: Run
        env:
          ACTION: ${{ inputs.action }}
          SERVICE: ${{ inputs.service }}
          LINES: ${{ inputs.lines }}
        run: |
          case "$LINES" in ''|*[!0-9]*) LINES=200 ;; esac
          DC="cd ${DEPLOY_PATH} && docker compose --env-file .env -f infra/docker-compose.yml"
          case "$ACTION" in
            status)
              ssh -i ~/.ssh/deploy "root@${DEPLOY_HOST}" "uptime; free -m; df -h / | tail -1; \
                docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}'; ${DC} ps"
              curl -fsS "https://itscout.ru/api/v1/health"; echo ;;
            logs)
              # Лог Actions станет публичным вместе с репозиторием: access-логи uvicorn (IP, пути с кодами
              # OIDC) отбрасываем, email и IPv4 в остальных строках маскируем (docs/deploy.md §5.3)
              ssh -i ~/.ssh/deploy "root@${DEPLOY_HOST}" "${DC} logs --no-color --no-log-prefix --timestamps --tail ${LINES} ${SERVICE}" 2>&1 \
                | grep -Ev 'INFO: +[^ ]+ - "[A-Z]+ [^ ]+ HTTP/' \
                | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email>/g; s/([0-9]{1,3}\.){3}[0-9]{1,3}/<ip>/g' ;;
            reseed)
              # Перед пересидированием — бэкап: reseed очищает все таблицы, кроме экспертной разметки
              ssh -i ~/.ssh/deploy "root@${DEPLOY_HOST}" \
                "${DC} exec -T backup sh /usr/local/bin/backup.sh once && ${DC} exec -T backend python -m seed.generate" ;;
            restart)
              ssh -i ~/.ssh/deploy "root@${DEPLOY_HOST}" "${DC} restart ${SERVICE}"
              sleep 10; curl -fsS "https://itscout.ru/api/v1/health"; echo ;;
            swap)
              # Скрипт из checkout, не из /opt/itscout/app: не зависит от того, прошёл ли деплой
              ssh -i ~/.ssh/deploy "root@${DEPLOY_HOST}" "sh -s" < infra/scripts/setup-swap.sh ;;
            backup)
              ssh -i ~/.ssh/deploy "root@${DEPLOY_HOST}" "${DC} exec -T backup sh /usr/local/bin/backup.sh once" ;;
            backups)
              ssh -i ~/.ssh/deploy "root@${DEPLOY_HOST}" "${DC} exec -T backup sh /usr/local/bin/backup.sh list" ;;
            llm-check)
              # Все сценарии LLM на настоящем провайдере; LLM_PROVIDER=yandex только для этой команды
              ssh -i ~/.ssh/deploy "root@${DEPLOY_HOST}" \
                "${DC} exec -T -e LLM_PROVIDER=yandex backend python -m app.scripts.llm_check" ;;
          esac
